          application/json:
            schema: { $ref: "#/components/schemas/CustomStrategyInput" }
      responses:
        "201":
          description: Created/updated (id + refreshed catalog)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomStrategyMutationResponse" }

  /strategy-control/custom/{id}:
    delete:
      operationId: deleteCustomStrategy
      tags: [strategy-control]
      summary: Owner-only — delete a custom strategy
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK (refreshed catalog)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomStrategyDeleteResponse" }

  /backtest/fno/runs:
    get:
      operationId: listBacktestRuns
      tags: [backtest]
      summary: List the current user's backtest runs (metadata only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestRunListResponse" }
    post:
      operationId: createBacktestRun
      tags: [backtest]
      summary: Run an F&O backtest (REAL_REPLAY or DIRECTIONAL) and persist the result
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BacktestRunRequest" }
      responses:
        "201":
          description: Created (the completed run, including summary + dataQuality)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestRun" }

  /backtest/fno/runs/{id}:
    get:
      operationId: getBacktestRun
      tags: [backtest]
      summary: Get one backtest run with its summary + data-quality blob
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestRun" }
    delete:
      operationId: deleteBacktestRun
      tags: [backtest]
      summary: Delete a backtest run and all its trades + blocked setups
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestDeleteResponse" }

  /backtest/fno/runs/{id}/trades:
    get:
      operationId: getBacktestRunTrades
      tags: [backtest]
      summary: List the trades produced by a backtest run
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestTradesResponse" }

  /backtest/fno/runs/{id}/blocked:
    get:
      operationId: getBacktestRunBlocked
      tags: [backtest]
      summary: List the blocked/skipped setups recorded by a backtest run
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestBlockedResponse" }

  /backtest/fno/snapshot-coverage:
    get:
      operationId: getBacktestSnapshotCoverage
      tags: [backtest]
      summary: Option-chain snapshot capture coverage (Mode D — for the data-quality panel)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestSnapshotCoverage" }

  /backtest/fno/strategies:
    get:
      operationId: getBacktestStrategies
      tags: [backtest]
      summary: List the generic Strategy-Research strategy catalog (V2)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestStrategiesResponse" }

  /global/screener-presets:
    get:
      operationId: listGlobalScreenerPresets
      tags: [global-screener]
      summary: List the current user's saved screener presets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalScreenerPresetsResponse" }
    post:
      operationId: createGlobalScreenerPreset
      tags: [global-screener]
      summary: Save a new named screener preset for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalScreenerPresetCreateBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalScreenerPreset" }

  /global/screener-presets/library:
    get:
      operationId: listGlobalScreenerPresetLibrary
      tags: [global-screener]
      summary: List the curated, read-only library of starter screener presets
      description: >-
        Returns a small set of expert-curated example presets that ship in
        code (so they evolve in lockstep with new filter capabilities). The
        UI renders these alongside the user's own list, clearly tagged as
        read-only. A "Fork" action calls `POST /global/screener-presets`
        with the body to create an editable personal copy.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalScreenerPresetLibraryResponse" }

  /global/screener-presets/{id}:
    patch:
      operationId: updateGlobalScreenerPreset
      tags: [global-screener]
      summary: Rename a saved preset and/or replace its filter body
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalScreenerPresetUpdateBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalScreenerPreset" }
    delete:
      operationId: deleteGlobalScreenerPreset
      tags: [global-screener]
      summary: Delete a saved preset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalScreenerPresetDeleteResponse" }

  /global/screener-presets/{id}/acknowledge:
    post:
      operationId: acknowledgeGlobalScreenerPresetAlerts
      tags: [global-screener]
      summary: Clear pending new-hit alerts for a preset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalScreenerPreset" }

  /global/screener-presets/{id}/run-now:
    post:
      operationId: runGlobalScreenerPresetNow
      tags: [global-screener]
      summary: Force the preset's scheduler-style run immediately
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalScreenerPreset" }

  /global/screener-presets/{id}/share:
    post:
      operationId: createGlobalScreenerPresetShareLink
      tags: [global-screener]
      summary: Generate (or return the existing) share token for a preset
      description: >-
        Lazily mints an opaque share token for the preset on first call,
        then always returns the same token until it is revoked. Recipients
        open `<artifact base path>screener?share=<token>` (e.g.
        `/global/screener?share=<token>`) to preview and import a personal
        copy via `POST /global/screener-presets/import/{token}`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalScreenerPresetShareResponse" }
    delete:
      operationId: revokeGlobalScreenerPresetShareLink
      tags: [global-screener]
      summary: Revoke the share token so existing share URLs stop resolving
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalScreenerPresetDeleteResponse" }

  /global/screener-presets/share/{token}:
    get:
      operationId: getGlobalScreenerPresetShare
      tags: [global-screener]
      summary: Resolve a share token to a sanitized preset preview
      description: >-
        Returns only `name` and `body` — never the owner's session key,
        timestamps, alert state, or other identifying details. Used by the
        recipient's UI to render a "Save this preset" prompt.
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalScreenerPresetSharePreview" }

  /global/screener-presets/import/{token}:
    post:
      operationId: importGlobalScreenerPresetShare
      tags: [global-screener]
      summary: Import a shared preset into the recipient's library
      description: >-
        Creates a personal, editable copy of the shared preset for the
        current session. If the recipient already has a preset with the
        same name, the import is suffixed with " (2)", " (3)", … to keep
        the per-session unique-name invariant.
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalScreenerPreset" }

  /global/instruments/disabled:
    get:
      operationId: listGlobalDisabledInstruments
      tags: [global-instruments]
      summary: List instruments operators have muted from the dashboard
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalDisabledInstrumentsResponse" }

  /global/instruments/{symbol}/disabled:
    post:
      operationId: disableGlobalInstrument
      tags: [global-instruments]
      summary: Mute an instrument so refreshers skip it and the dashboard hides it
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalInstrumentDisableBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalInstrumentOverride" }
    delete:
      operationId: enableGlobalInstrument
      tags: [global-instruments]
      summary: Re-enable a previously-muted instrument
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalInstrumentOverride" }

  /global/status:
    get:
      operationId: getGlobalSourceStatus
      tags: [global-status]
      summary: Per-data-source freshness / last-error for the dashboard health strip
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalSourceStatusResponse" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Signal:
      type: string
      enum: [STRONG_BUY, BUY, NEUTRAL, SELL, STRONG_SELL]

    Quote:
      type: object
      required: [symbol, price, change, changePercent, open, high, low, previousClose, volume, updatedAt]
      properties:
        symbol: { type: string }
        name: { type: string }
        exchange: { type: string }
        price: { type: number }
        change: { type: number }
        changePercent: { type: number }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        previousClose: { type: number }
        volume: { type: number }
        avgVolume: { type: number }
        marketCap: { type: number }
        dayRange: { type: string }
        yearRange: { type: string }
        fiftyTwoWeekHigh: { type: number }
        fiftyTwoWeekLow: { type: number }
        updatedAt: { type: string, format: date-time }

    EtfQuote:
      type: object
      required: [symbol, name, exchange, price, change, changePercent, open, high, low, previousClose, volume, instrumentType, updatedAt]
      description: >
        Quote-only payload for a whitelisted NSE ETF. Fundamentals and
        recommendations are intentionally absent (not applicable to ETFs).
      properties:
        symbol: { type: string }
        name: { type: string }
        exchange: { type: string }
        price: { type: number }
        change: { type: number }
        changePercent: { type: number }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        previousClose: { type: number }
        volume: { type: number }
        instrumentType: { type: string, description: "Always 'ETF' for this endpoint" }
        updatedAt: { type: string, format: date-time }

    EtfNav:
      type: object
      required: [symbol, isin, nav, navDate, source]
      description: >
        Latest published end-of-day NAV for an ETF from the AMFI feed. NAV is
        from the latest published session (navDate), not a live intraday iNAV.
      properties:
        symbol: { type: string }
        isin: { type: string }
        nav: { type: number, description: "Net asset value per unit (INR)" }
        navDate: { type: string, description: "Published NAV date, e.g. '03-Jun-2026'" }
        schemeName: { type: string, description: "AMFI scheme name for the matched ISIN" }
        source: { type: string, description: "Always 'AMFI' for this endpoint" }

    Indicators:
      type: object
      # Every field is optional — Kite-only rows have no intraday bars to
      # compute EMAs/RSI/MACD/VWAP/ATR with, so they ship `undefined` for
      # those fields and the UI renders "—" instead of fake zeros.
      # Pivot/S/R/delivery% are derived from real OHLC and are always
      # populated when a row exists.
      properties:
        ema9: { type: number }
        ema21: { type: number }
        ema20: { type: number }
        ema50: { type: number }
        ema100: { type: number }
        ema200: { type: number }
        vwap: { type: number, description: "Daily intraday VWAP if available, else rolling proxy" }
        rsi14: { type: number }
        macd: { type: number }
        macdSignal: { type: number }
        macdHist: { type: number }
        atr14: { type: number }
        adx14: { type: number }
        volumeRatio: { type: number, description: "current volume / 20-day average" }
        deliveryPct: { type: number, description: "estimated delivery percentage" }
        trendStrength: { type: number, description: "0-100" }
        supportLevel: { type: number }
        resistanceLevel: { type: number }
        pivot: { type: number }
        r1: { type: number }
        s1: { type: number }
        valueAreaHigh: { type: number }
        valueAreaLow: { type: number }
        pointOfControl: { type: number }
        futOiBuildup:
          type: string
          enum: [LONG_BUILDUP, SHORT_BUILDUP, SHORT_COVERING, LONG_UNWINDING, NEUTRAL]
          description: "Futures OI buildup classification from the OI heatmap (null if heatmap unavailable or stock not in F&O)"

    SignalReason:
      type: object
      required: [label, weight, bullish]
      properties:
        label: { type: string }
        detail: { type: string }
        weight: { type: number }
        bullish: { type: boolean }

    HorizonName:
      type: string
      enum: [INTRADAY, SWING, LONG_TERM]
      description: "Trading horizon — Intraday (today), Swing (1-4 weeks), Long-term (months+)"

    HorizonBias:
      type: object
      required: [horizon, bias, label, confidence, timeframe, reason]
      properties:
        horizon: { $ref: "#/components/schemas/HorizonName" }
        bias:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL_BULLISH, NEUTRAL_BEARISH, RANGE_BOUND, INSUFFICIENT_DATA]
          description: "Per-horizon bias classification — never just 'NEUTRAL' when one side dominates"
        label: { type: string, description: "Human-readable label e.g. 'Neutral-to-Bearish', 'Bullish'" }
        confidence: { type: number, description: "0-100, share of horizon-relevant evidence aligned with the bias" }
        timeframe: { type: string, description: "Display window e.g. 'Today / 1-3 days'" }
        reason: { type: string, description: "Concise plain-English rationale" }
        conflicts: { type: string, description: "Opposing evidence on this horizon, if any" }
        confirmation: { type: string, description: "What confirms a trade on this horizon" }
        invalidation: { type: string, description: "What cancels the bias on this horizon" }

    SetupStatus:
      type: string
      enum:
        - TRADEABLE
        - NO_SETUP_RR
        - NO_SETUP_NEUTRAL
        - NO_SETUP_AWAITING_LEVELS
        - NO_SETUP_AWAITING_CONFIRMATION
      description: |
        TRADEABLE — entry/stop/target valid with R:R >= 1.
        NO_SETUP_RR — risk/reward unfavorable.
        NO_SETUP_NEUTRAL — bias is range-bound; wait for breakout/breakdown.
        NO_SETUP_AWAITING_LEVELS — directional bias but ATR/S-R inputs missing (insufficient session data).
        NO_SETUP_AWAITING_CONFIRMATION — directional bias but waiting for breakout/breakdown trigger.

    Recommendation:
      type: object
      required: [signal, score, confidence, reasons]
      properties:
        signal: { $ref: "#/components/schemas/Signal" }
        score: { type: number, description: "-100 to 100" }
        confidence: { type: number, description: "0 to 100" }
        timeframe: { type: string, description: "e.g. swing, intraday, positional" }
        target: { type: number }
        stopLoss: { type: number }
        riskRewardRatio: { type: number }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/SignalReason" }
        # ---- additive: structured decision-engine fields (Stock Detail page) ----
        displayLabel:
          type: string
          description: |
            UI-friendly label that resolves the "Neutral when evidence is one-sided" bug.
            Examples: 'Strong Bullish', 'Bullish', 'Neutral-to-Bearish',
            'No Trade — Bearish Pressure', 'Range-bound', 'Bearish Bias, Waiting for Confirmation'.
        setupStatus: { $ref: "#/components/schemas/SetupStatus" }
        setupMessage:
          type: string
          description: |
            Plain-English explanation that ALWAYS replaces blank target/stop boxes.
            E.g. 'No valid trade setup generated because risk/reward (0.6:1) is not favorable.'
            or 'Target and stop-loss will appear once volatility (ATR) is established.'
        confirmation:
          type: string
          description: "Top-level: what confirms the active setup (mirrors the swing horizon when tradeable)"
        invalidation:
          type: string
          description: "Top-level: what cancels the active setup"
        conflicts:
          type: array
          description: "Opposing evidence summary for the dominant bias (top 1-3 dissenting reasons)"
          items: { type: string }
        horizons:
          type: array
          description: "Three-horizon bias panel (Intraday / Swing / Long-term)"
          items: { $ref: "#/components/schemas/HorizonBias" }
        # ---- additive: equity Entry-Safety gate (Pass-A + Pass-B, 2026-05-08) ----
        entryQuality:
          type: string
          enum: [GOOD, FAIR, POOR]
          description: |
            Separate from trend (`signal`/`displayLabel`). Tells the user how
            SAFE this exact moment is to take a fresh entry, regardless of how
            strong the trend is. POOR = price extended into a major resistance
            (or support, mirror for bearish) after a strong same-day move —
            high rejection risk; wait for breakout confirmation or pullback.
            FAIR = inside the proximity zone but conditions for POOR not all
            satisfied. GOOD = clear path; trend signal can be acted on.
        entryPlan:
          $ref: "#/components/schemas/EntryPlan"

    PriceZone:
      type: object
      required: [low, high]
      properties:
        low:  { type: number }
        high: { type: number }

    EntryPlan:
      type: object
      description: |
        Actionable entry guidance shown alongside the Recommendation card.
        Populated when `entryQuality` is FAIR or POOR (GOOD setups do not
        need a special plan — the existing target / stop / R:R already
        tells the full story).
      required: [reason]
      properties:
        reason:
          type: string
          description: "Plain-English explanation of WHY entry quality is degraded right now."
        avoidZone:
          $ref: "#/components/schemas/PriceZone"
        breakoutTrigger:
          type: number
          description: "Price level above which a fresh momentum entry becomes safer (bullish) — or below for bearish."
        pullbackZone:
          $ref: "#/components/schemas/PriceZone"
        invalidates:
          type: number
          description: "Level at which the trend thesis itself fails (mirrors the recommendation stopLoss when set)."

