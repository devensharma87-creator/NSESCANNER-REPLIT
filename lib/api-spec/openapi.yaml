openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NSE Stock Scanner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: market
  - name: sectors
  - name: stocks
  - name: scan
  - name: options
  - name: news
  - name: global-auth
  - name: global-data
  - name: global-watchlist
  - name: global-screener
  - name: global-status
  - name: portfolio
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /market/summary:
    get:
      operationId: getMarketSummary
      tags: [market]
      summary: Indian market indices snapshot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketSummary" }

  /market/global:
    get:
      operationId: getGlobalIndices
      tags: [market]
      summary: Global indices including GIFT NIFTY for pre-market read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalMarket" }

  /market/trend:
    get:
      operationId: getMarketTrend
      tags: [market]
      summary: Overall market trend (breadth + index alignment)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketTrend" }

  /market/macroHistory:
    get:
      operationId: getMarketMacroHistory
      tags: [market]
      summary: 5-day daily-close sparklines for VIX, India VIX, DXY and Crude
      description: |
        Powers the macro mini-sparklines beside the Mood gauge. Backed by
        Yahoo Finance 5d/1d charts; cached server-side for 5 minutes (these
        readings barely move intraday compared to spot quotes). Empty array
        is returned when every upstream fetch fails — the UI must degrade
        gracefully.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MacroHistoryResponse" }

  /sectors:
    get:
      operationId: listSectors
      tags: [sectors]
      summary: All sectors with aggregate stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SectorSummary" }

  /sectors/{sector}:
    get:
      operationId: getSector
      tags: [sectors]
      summary: Sector detail with all stocks
      parameters:
        - in: path
          name: sector
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectorDetail" }

  /stocks:
    get:
      operationId: listStocks
      tags: [stocks]
      summary: List all scanned stocks (with live quote + signal)
      parameters:
        - in: query
          name: sector
          schema: { type: string }
        - in: query
          name: signal
          schema:
            type: string
            enum: [STRONG_BUY, BUY, NEUTRAL, SELL, STRONG_SELL]
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StockRow" }

  /stocks/{symbol}:
    get:
      operationId: getStockDetail
      tags: [stocks]
      summary: Detailed view of a single stock
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockDetail" }

  /stocks/{symbol}/statements:
    get:
      operationId: getStockStatements
      tags: [stocks]
      summary: Full financial statements (P&L, Balance Sheet, Cash Flow, Ratios, Shareholding)
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockStatements" }

  /stocks/{symbol}/history:
    get:
      operationId: getStockHistory
      tags: [stocks]
      summary: Historical OHLC + indicators
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: range
          schema:
            type: string
            enum: ["1mo", "3mo", "6mo", "1y", "2y"]
            default: "6mo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockHistory" }

  /etf/{symbol}/quote:
    get:
      operationId: getEtfQuote
      tags: [stocks]
      summary: Lightweight live quote for a whitelisted NSE ETF
      description: >
        Resolves a real live CMP (via Kite) for liquid NSE ETFs (e.g.
        NIFTYBEES / GOLDBEES / BANKBEES) that are not in the curated/scored
        equity catalog and therefore 404 on /stocks/{symbol}. Quote-only — no
        fundamentals or recommendation (not applicable to ETFs). Never returns
        fabricated prices: 404 for non-whitelisted symbols, 503 when the live
        quote source is offline.
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EtfQuote" }
        "404":
          description: Not a recognised ETF, or no live quote available
        "503":
          description: Live quote source (Kite) unavailable

  /etf/{symbol}/nav:
    get:
      operationId: getEtfNav
      tags: [stocks]
      summary: Latest published NAV for an ETF (AMFI feed)
      description: >
        Resolves the latest published end-of-day Net Asset Value (NAV) for an
        NSE ETF from the official AMFI NAVAll feed, keyed by ISIN. The NAV is
        END-OF-DAY (latest published session, see `navDate`), not a live
        intraday iNAV, so a premium/discount computed against a live CMP is
        approximate and slightly lagged. Never fabricates a NAV: 404 when the
        symbol has no ISIN mapping or the ISIN is absent from the feed, 503 when
        the AMFI feed is unreachable. An optional `isin` query overrides the
        curated map (e.g. the user's own holding ISIN).
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: isin
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EtfNav" }
        "404":
          description: No ISIN mapping for this ETF, or NAV absent from the feed
        "503":
          description: AMFI NAV feed unavailable

  /chart/instruments:
    get:
      operationId: searchChartInstruments
      tags: [chart]
      summary: Unified instrument search for the charting tab
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Free-text match against symbol or name (case-insensitive).
        - in: query
          name: segment
          schema:
            type: string
            enum: [index, equity, global]
          description: Optional segment filter.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChartInstrumentsResponse" }

  /chart/candles:
    get:
      operationId: getChartCandles
      tags: [chart]
      summary: Normalized OHLCV candles for a charting instrument
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: segment
          required: true
          schema:
            type: string
            enum: [index, equity, global]
        - in: query
          name: tf
          required: true
          schema:
            type: string
            enum: ["1m", "3m", "5m", "15m", "30m", "1h", "1D", "1W", "1M"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChartCandlesResponse" }

  /scan/top:
    get:
      operationId: getTopScans
      tags: [scan]
      summary: Top buy and sell ideas right now
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopScans" }

  /options/signals:
    get:
      operationId: getOptionSignals
      tags: [options]
      summary: Index option (CALL/PUT) buy/sell setups with entry/SL/target
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionSignalSet" }

  /options/signal-history:
    get:
      operationId: getOptionSignalHistory
      tags: [options]
      summary: "Today's persisted option signals with live status, MFE/MAE and exit info."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionSignalHistorySet" }

  /options/signal-report:
    get:
      operationId: getOptionSignalReport
      tags: [options]
      summary: "Signal history report — daily or monthly."
      parameters:
        - in: query
          name: date
          schema: { type: string }
          description: "Single date YYYY-MM-DD (daily report). Mutually exclusive with month."
        - in: query
          name: month
          schema: { type: string }
          description: "Month YYYY-MM (monthly report). Mutually exclusive with date."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionSignalReportResponse" }

  /options/signal-report/export:
    get:
      operationId: exportOptionSignalReport
      tags: [options]
      summary: "Export signal history report as CSV (opens in Excel)."
      parameters:
        - in: query
          name: date
          schema: { type: string }
          description: "Single date YYYY-MM-DD."
        - in: query
          name: month
          schema: { type: string }
          description: "Month YYYY-MM."
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema: { type: string }

  /options/signal-report/dates:
    get:
      operationId: getOptionSignalReportDates
      tags: [options]
      summary: "Available signal dates for the date picker."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [dates]
                properties:
                  dates:
                    type: array
                    items: { type: string }

  /paper/account:
    get:
      operationId: getPaperAccount
      tags: [paper]
      summary: "Owner-only paper trading account state for one segment."
      parameters:
        - in: query
          name: segment
          required: true
          schema: { type: string, enum: [FNO, EQUITY] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperAccountState" }

  /paper/positions/fo:
    get:
      operationId: getPaperPositionsFO
      tags: [paper]
      summary: "Owner-only list of currently OPEN F&O paper positions with live MTM."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperPositionsFOResponse" }

  /paper/trades/fo:
    get:
      operationId: getPaperTradesFO
      tags: [paper]
      summary: "Owner-only list of CLOSED F&O paper trades for a given IST date."
      parameters:
        - in: query
          name: date
          required: false
          schema: { type: string, description: "IST date YYYY-MM-DD; defaults to today." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperTradesFOResponse" }

  /paper/positions/fo/{id}/close:
    post:
      operationId: closePaperPositionFO
      tags: [paper]
      summary: "Owner-only manual force-exit of an OPEN F&O paper position at last known premium."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, description: "paper_trade_fo.id (uuid)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperTradeFOClosed" }

  /paper/reports/fo/monthly:
    get:
      operationId: getPaperReportFoMonthly
      tags: [paper]
      summary: "Owner-only F&O paper P&L report for one IST calendar month with daily buckets and per-trade detail."
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, description: "IST calendar month YYYY-MM" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperReportFoMonthly" }

  /paper/reports/fo/yearly:
    get:
      operationId: getPaperReportFoYearly
      tags: [paper]
      summary: "Owner-only F&O paper P&L report for one Indian financial year with monthly buckets."
      parameters:
        - in: query
          name: fy
          required: true
          schema: { type: string, description: "Indian FY in YYYY-YYYY form, eg 2026-2027" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperReportFoYearly" }

  /paper/positions/eq:
    get:
      operationId: getPaperPositionsEq
      tags: [paper]
      summary: "Owner-only list of currently OPEN equity (delivery) paper positions with live MTM."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperPositionsEqResponse" }

  /paper/trades/eq:
    get:
      operationId: getPaperTradesEq
      tags: [paper]
      summary: "Owner-only list of CLOSED equity paper trades for a given IST date (by exitedAt)."
      parameters:
        - in: query
          name: date
          required: false
          schema: { type: string, description: "IST date YYYY-MM-DD; defaults to today." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperTradesEqResponse" }

  /paper/positions/eq/{id}/close:
    post:
      operationId: closePaperPositionEq
      tags: [paper]
      summary: "Owner-only manual force-exit of an OPEN equity paper position at last known LTP."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, description: "paper_trade_eq.id (uuid)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperTradeEqClosed" }

  /paper/reports/eq/monthly:
    get:
      operationId: getPaperReportEqMonthly
      tags: [paper]
      summary: "Owner-only equity paper P&L report for one IST calendar month with daily buckets and per-trade detail."
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, description: "IST calendar month YYYY-MM" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperReportEqMonthly" }

  /paper/reports/eq/yearly:
    get:
      operationId: getPaperReportEqYearly
      tags: [paper]
      summary: "Owner-only equity paper P&L report for one Indian financial year with monthly buckets."
      parameters:
        - in: query
          name: fy
          required: true
          schema: { type: string, description: "Indian FY in YYYY-YYYY form, eg 2026-2027" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperReportEqYearly" }

  /paper/combos:
    get:
      operationId: listPaperCombos
      tags: [paper]
      summary: "Owner-only list of paper-trading combos (server-priced)."
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [OPEN, CLOSED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperComboListResponse" }
    post:
      operationId: openPaperCombo
      tags: [paper]
      summary: "Owner-only manual open of a multi-leg combo. Server reprices from the live chain — client cannot supply premium, Greeks, margin, or P&L."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaperComboOpenRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperComboResponse" }

  /paper/combos/{id}:
    get:
      operationId: getPaperCombo
      tags: [paper]
      summary: "Owner-only paper-trading combo detail (re-marks live for OPEN combos)."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperComboResponse" }

  /paper/combos/{id}/close:
    post:
      operationId: closePaperCombo
      tags: [paper]
      summary: "Owner-only manual close of an OPEN paper combo at freshly-marked premium."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaperComboCloseRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperComboResponse" }

  /options/chain/{underlying}:
    get:
      operationId: getOptionChain
      tags: [options]
      summary: "Live NSE option chain (indices + F&O equities)"
      parameters:
        - in: path
          name: underlying
          required: true
          schema: { type: string, description: "NIFTY, BANKNIFTY, FINNIFTY, MIDCPNIFTY or NSE equity symbol" }
        - in: query
          name: expiry
          required: false
          schema: { type: string, description: "Active expiry YYYY-MM-DD; defaults to nearest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionChainResponse" }

  /options/analytics/{underlying}:
    get:
      operationId: getOptionAnalytics
      tags: [options]
      summary: "PCR, Max Pain, ATM IV, OI buildup interpretation"
      parameters:
        - in: path
          name: underlying
          required: true
          schema: { type: string }
        - in: query
          name: expiry
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionAnalyticsResponse" }

  /options/strategies/{underlying}:
    get:
      operationId: getOptionStrategies
      tags: [options]
      summary: "Pre-built multi-leg strategies with payoff diagrams + Greeks"
      parameters:
        - in: path
          name: underlying
          required: true
          schema: { type: string }
        - in: query
          name: expiry
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionStrategiesResponse" }

  /options/strategies/{underlying}/custom:
    post:
      operationId: postOptionStrategyCustom
      tags: [options]
      summary: "Free-form multi-leg strategy builder with scenario re-prices"
      parameters:
        - in: path
          name: underlying
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomStrategyRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomStrategyResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /inst/fii-dii:
    get:
      operationId: getFiiDii
      tags: [institutional]
      summary: FII / DII cash market monthly aggregates with daily breakdown
      parameters:
        - in: query
          name: months
          schema: { type: integer, minimum: 1, maximum: 36, default: 12 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiiDiiResponse" }

  /inst/participant-oi:
    get:
      operationId: getParticipantOi
      tags: [institutional]
      summary: Participant-wise OI (Client / FII / DII / Pro / TOTAL) for a single trading day
      parameters:
        - in: query
          name: date
          schema: { type: string, description: "YYYY-MM-DD; latest if omitted" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantOiResponse" }

  /inst/participant-oi/audit:
    get:
      operationId: getParticipantOiAudit
      tags: [institutional]
      summary: |
        Diagnostic audit of Participant-wise OI for a single trading day.
        Returns source metadata, raw long/short components, computed Net /
        Change OI per (participant × segment), the formula string used, and
        the corresponding day-over-day previous trading date pulled from the
        same DB rows the public /inst/participant-oi endpoint consumes.
        Read-only, no secrets.
      parameters:
        - in: query
          name: date
          schema: { type: string, description: "YYYY-MM-DD; latest if omitted" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantOiAuditResponse" }

  /inst/fno-ban:
    get:
      operationId: getFnoBanList
      tags: [institutional]
      summary: NSE F&O Ban List — stocks restricted to square-off-only trades (MWPL breach)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FnoBanListResponse" }

  /inst/refresh:
    post:
      operationId: refreshInstFlows
      tags: [institutional]
      summary: Force-refresh FII/DII and participant OI from upstream sources
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /news:
    get:
      operationId: getNews
      tags: [news]
      summary: Market news (optionally filtered by symbol)
      parameters:
        - in: query
          name: symbol
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NewsItem" }

  /market/events:
    get:
      operationId: getMarketEvents
      tags: [news]
      summary: Market events — exchange holidays, earnings calendar, central bank & macro events (90-day horizon)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketEventsResponse" }

  /home/enrichment:
    get:
      operationId: getHomeEnrichment
      tags: [market]
      summary: Aggregated home dashboard enrichment — sparklines, momentum, options summary per Indian index
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeEnrichmentResponse" }

  /market/premarket:
    get:
      operationId: getPreMarket
      tags: [market]
      summary: Pre/Post-market deep analysis — overnight cues, GIFT NIFTY, gainers/losers, gappers, market internals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreMarketReport" }
  /watchlist/{key}:
    get:
      operationId: getWatchlist
      tags: [market]
      summary: Pre-defined watchlist (Nifty 100 / Midcap 100 / Smallcap 100) with live quotes and MC trend
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
            enum: [SENSEX, BANKNIFTY, NIFTY50, NIFTY100, NIFTYMIDCAP100, NIFTYSMALLCAP100, NIFTY500]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchlistResponse" }

  /indices:
    get:
      operationId: getIndicesBoard
      tags: [market]
      summary: Indices board — Indian + global benchmarks + commodities with full fact pack
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndicesBoardSnapshot" }

  # ---------------------------------------------------------------------
  # Global Multi-Asset Scanner (Phase 1 — Crypto / Commodities / Forex)
  # All endpoints below are gated by the new GLOBAL_APP_ACCESS_PASSWORD
  # cookie ("global_session"); independent from the NSE scanner gate.
  # ---------------------------------------------------------------------

  /global/auth/status:
    get:
      operationId: getGlobalAuthStatus
      tags: [global-auth]
      summary: Whether the global-scanner session cookie is present and the password is configured
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalAuthStatus" }

  /global/auth/login:
    post:
      operationId: globalLogin
      tags: [global-auth]
      summary: Log into the global scanner with the configured access password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalLoginBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalLoginResponse" }

  /global/auth/logout:
    post:
      operationId: globalLogout
      tags: [global-auth]
      summary: Clear the global scanner session cookie
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalLogoutResponse" }

  /global/instruments:
    get:
      operationId: listGlobalInstruments
      tags: [global-data]
      summary: Full instrument universe (crypto + commodities + forex + equities + indices)
      parameters:
        - in: query
          name: assetClass
          required: false
          schema: { type: string, enum: [crypto, commodity, forex, equity, index] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GlobalInstrument" }

  /global/dashboard:
    get:
      operationId: getGlobalDashboard
      tags: [global-data]
      summary: Live snapshot rows for an asset class (or watchlist) with freshness metadata
      parameters:
        - in: query
          name: asset
          required: true
          schema: { type: string, enum: [crypto, commodities, forex, equities, indices, watchlist] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalDashboardResponse" }

  /global/instruments/{symbol}:
    get:
      operationId: getGlobalInstrumentDetail
      tags: [global-data]
      summary: Per-instrument quote, day stats and supported timeframes
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalInstrumentDetail" }

  /global/instruments/{symbol}/candles:
    get:
      operationId: getGlobalCandles
      tags: [global-data]
      summary: OHLCV candles for an instrument and timeframe (real source data)
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: timeframe
          required: true
          schema: { type: string, enum: ["1m","5m","15m","1h","4h","1d"] }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 10, maximum: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalCandlesResponse" }

  /global/instruments/{symbol}/indicators:
    get:
      operationId: getGlobalInstrumentIndicators
      tags: [global-data]
      summary: Indicator series (SMA/EMA/RSI/MACD/BB/ATR/VWAP/Supertrend) for an instrument
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: timeframe
          required: true
          schema: { type: string, enum: ["1m","5m","15m","1h","4h","1d"] }
        - in: query
          name: list
          required: false
          schema: { type: string, description: "CSV of indicator ids (sma20,sma50,sma200,ema20,ema50,rsi14,macd,bb20,atr14,vwap,supertrend)" }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 20, maximum: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalIndicatorsResponse" }

  /global/screen:
    post:
      operationId: runGlobalScreener
      tags: [global-screener]
      summary: Run a screener against the universe using cached candles + indicator filters
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalScreenerBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalScreenerResponse" }

  /global/watchlist:
    get:
      operationId: getGlobalWatchlist
      tags: [global-watchlist]
      summary: Current user's personal global-scanner watchlist
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalWatchlistResponse" }
    post:
      operationId: addGlobalWatchlist
      tags: [global-watchlist]
