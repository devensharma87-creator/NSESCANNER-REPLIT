      tags: [strategy-control]
      summary: Owner-only unified strategy catalog (engine allow-list + backtest list + custom)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyCatalogResponse" }

  /strategy-control/engine:
    put:
      operationId: setStrategyEngineSelection
      tags: [strategy-control]
      summary: Owner-only — bulk-set which strategies the live F&O engine may use
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StrategyEngineUpdateBody" }
      responses:
        "200":
          description: OK (refreshed catalog)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyCatalogResponse" }

  /strategy-control/custom:
    post:
      operationId: upsertCustomStrategy
      tags: [strategy-control]
      summary: Owner-only — create or update a config/parameter-driven custom strategy
      requestBody:
        required: true
