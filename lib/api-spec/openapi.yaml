          description: "Phase-3 confluence-engine score (sum of EMA-stack/VWAP/VolumeProfile/Regime/IVR factor weights, roughly -30..+20). Added to the detector's raw confidence before the HC emission floor; positive = confluence supports the bias, negative = opposed."
        dailyEma50: { type: number, description: "Higher-timeframe EMA50 used for HTF bias." }
        htfBias:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
          description: "Daily-timeframe bias derived from spot vs daily EMA50."
        htfConflict:
          type: boolean
          description: "True if intraday signal direction opposes the daily HTF bias."
        tags:
          type: array
          items: { type: string }
          description: "Status tags e.g. HTF_CONFLICT, RR_LOW, EXTENDED, BASELINE."
        setupKey:
          type: string
          enum: [TREND_CONTINUATION, VWAP_RECLAIM, VOLUME_BREAKOUT, EMA_PULLBACK, MEAN_REVERSION, BASELINE]
          description: "Type of intraday setup"
        setupName: { type: string, description: "Human-readable setup label" }
        setupSummary: { type: string, description: "One-line trade idea explanation" }
        entryTrigger: { type: string, description: "Precise condition to enter (e.g. 15-min close above level X)" }
        leg: { $ref: "#/components/schemas/OptionLeg" }
        drivers:
          type: array
          items: { $ref: "#/components/schemas/SignalReason" }
        invalidation: { type: string }
        generatedAt: { type: string, format: date-time }
        status:
          type: string
          enum: [PENDING, TRIGGERED, TARGET1_HIT, TARGET2_HIT, STOPPED, EXPIRED]
          description: "Live lifecycle state vs locked entry/SL/targets."
        firstSeenAt:
          type: string
          format: date-time
          description: "When this exact (date+index+setup+direction) signal was first emitted today; persisted, never moves."
        triggeredAt:
          type: string
          format: date-time
          description: "First time spot crossed the entry trigger in trade direction."
        exitedAt:
          type: string
          format: date-time
          description: "Time the trade was closed by stop, target, or session end."
        exitReason:
          type: string
          enum: [TARGET1_HIT, TARGET2_HIT, STOPPED, EXPIRED_TRIGGERED, EXPIRED_PENDING, STALE_TRIGGER]
          description: "Reason the lifecycle row exited. STALE_TRIGGER is a Phase-1 quality gate for PENDING rows whose trigger has not fired within ~45 minutes — the level is no longer relevant to the live tape."
        exitPrice: { type: number }
        maxFavorableExcursionPts:
          type: number
          description: "Maximum points moved in trade's favour from entry, observed today."
        maxAdverseExcursionPts:
          type: number
          description: "Maximum points moved against trade from entry, observed today."
        lastSpot:
          type: number
          description: "Most recent observed spot used to evaluate this signal."
        lastEvaluatedAt:
          type: string
          format: date-time
          description: "Wall-clock time the lifecycle was last evaluated against live spot. Surfaced on the card so the user can verify the trigger pipeline is alive — not stuck on stale data."
        optionLtp:
          type: number
          description: "Current premium (₹/share) of the option at the chosen strike — CE for BULLISH, PE for BEARISH. Sourced from Kite or NSE option chain when available."
        optionEntry:
          type: number
          description: "Greeks-projected option premium at the spot entry trigger. Equals optionLtp + delta×(spotEntry − spot). What the trader will likely pay if the trigger fires now."
        optionTarget1:
          type: number
          description: "Greeks-projected option premium at the spot target 1. Equals optionEntry + delta×(spotT1 − spotEntry)."
        optionTarget2:
          type: number
          description: "Greeks-projected option premium at the spot target 2."
        optionStopLoss:
          type: number
          description: "Greeks-projected option premium at the spot stop. Floored at 0.05 ₹/share so it never goes negative."
        optionDelta:
          type: number
          description: "Delta of the chosen strike at signal time. Used to translate spot moves into option moves."
        optionTheta:
          type: number
          description: "Theta (₹/share/day, time decay) of the chosen strike."
        optionVega:
          type: number
          description: "Vega (₹/share per 1 vol point) of the chosen strike."
        dataQuality:
          type: string
          enum: [LIVE_KITE_FULL, LIVE_KITE_PARTIAL, DELAYED_YAHOO, STALE]
          description: "Data quality label indicating the source and freshness of intraday data used to generate this signal."
        regime:
          type: string
          enum: [TRENDING_BULL, TRENDING_BEAR, RANGING, VOLATILE, EXPIRY_DAY]
          description: "Phase-1 regime classification for the index at signal time. Read-only label — does not gate setup emission yet (Phase-2 will use it to route setup eligibility)."
        regimeReason:
          type: string
          description: "Plain-English explanation for the regime label. UI surfaces verbatim under the regime badge."
        ivRank:
          type: number
          minimum: 0
          maximum: 100
          description: "ATM IV-rank over the trailing 252 sessions (0-100). 0 = today's IV is the lowest; 100 = highest. Null when sample <5 days."
        ivPercentile:
          type: number
          minimum: 0
          maximum: 100
          description: "Fraction of trailing-252 sessions whose ATM IV was strictly below today's, expressed 0-100. Null when sample <5 days."

    OptionSignalDiagnostics:
      type: object
      required: [indicesConfigured, indicesWithBars, highConvictionCount, baselineCount, suppressed]
      properties:
        indicesConfigured: { type: integer }
        indicesWithBars: { type: integer }
        highConvictionCount: { type: integer }
        baselineCount: { type: integer }
        suppressed:
          type: array
          description: "Per-index report of why no high-conviction setup fired."
          items:
            type: object
            required: [index, reasons]
            properties:
              index: { type: string }
              reasons:
                type: array
                items: { type: string }
        gates:
          type: object
          description: "Phase-1 quality-gate state for the current cycle. Surfaced so the UI banner can show why live cards are missing on a given session (circuit breaker after consecutive stops, VIX spike, correlated-exposure dedupe, OI veto, etc.)."
          required:
            - circuitBreakerActive
            - stoppedToday
            - stopLimit
            - vixSpike
            - correlationDroppedCount
            - oiVetoCount
            - staleExpiredCount
            - notes
          properties:
            circuitBreakerActive:
              type: boolean
              description: "True when stoppedToday >= stopLimit. New high-conviction emission is suspended for the rest of the session."
            stoppedToday:
              type: integer
              description: "Number of STOPPED outcomes recorded for today (IST date)."
            stopLimit:
              type: integer
              description: "Daily stop limit that triggers the circuit breaker."
            vixSpike:
              type: boolean
              description: "True when India VIX has tripped either the intraday or day-over-day spike threshold."
            vixIntradayPct:
              type: number
              nullable: true
              description: "India VIX percent move from session open. Null when intraday VIX data is unavailable."
            vixDayPct:
              type: number
              nullable: true
              description: "India VIX percent move vs prior daily close. Null when daily VIX data is unavailable."
            vixSpikeReason:
              type: string
              nullable: true
              description: "Human-readable description of which VIX threshold tripped, if any."
            correlationDroppedCount:
              type: integer
              description: "How many high-conviction signals were suppressed in this cycle by the correlated-exposure cap (BROAD / BANK buckets keep only the highest-confidence card per direction)."
            oiVetoCount:
              type: integer
              description: "How many high-conviction signals were hard-vetoed this cycle because OI sentiment opposed the trade direction with magnitude above the veto threshold."
            staleExpiredCount:
              type: integer
              description: "How many PENDING lifecycle rows were expired this cycle by the stale-trigger sweep."
            notes:
              type: array
              items: { type: string }
              description: "Plain-English lines describing every active gate. UI banner reads these verbatim."

    OptionSignalSet:
      type: object
      required: [signals, generatedAt]
      properties:
        signals:
          type: array
          items: { $ref: "#/components/schemas/OptionSignal" }
        generatedAt: { type: string, format: date-time }
        lastUpdated: { type: string, format: date-time, description: "Alias for generatedAt for UI consistency." }
        marketState:
          type: string
          enum: [open, closed, pre_open]
          description: "NSE equity-market session state at generation time."
        diagnostics: { $ref: "#/components/schemas/OptionSignalDiagnostics" }

    OptionSignalHistoryItem:
      type: object
      required:
        - signalDate
        - indexSymbol
        - indexName
        - setupKey
        - direction
        - optionType
        - strike
        - entry
        - stopLoss
        - target1
        - target2
        - confidence
        - status
        - generatedAt
        - maxFavorableExcursionPts
        - maxAdverseExcursionPts
        - lastSpot
        - lastEvaluatedAt
      properties:
        signalDate:    { type: string, description: "IST trading date YYYY-MM-DD" }
        indexSymbol:   { type: string }
        indexName:     { type: string }
        setupKey:      { type: string }
        setupName:     { type: string, nullable: true }
        direction:     { type: string, enum: [BULLISH, BEARISH] }
        optionType:    { type: string, enum: [CALL, PUT] }
        strike:        { type: number }
        entry:         { type: number }
        stopLoss:      { type: number }
        target1:       { type: number }
        target2:       { type: number }
        entryTrigger:  { type: string, nullable: true }
        # Option-premium plan locked at signal generation time. Nullable
        # because (a) older lifecycle rows pre-date these columns, and
        # (b) the option chain may have been unavailable when the signal
        # was first emitted.
        optionEntry:     { type: number, nullable: true }
        optionStopLoss:  { type: number, nullable: true }
        optionTarget1:   { type: number, nullable: true }
        optionTarget2:   { type: number, nullable: true }
        confidence:    { type: integer }
        tier:          { type: string, nullable: true }
        status:
          type: string
          enum: [PENDING, TRIGGERED, TARGET1_HIT, TARGET2_HIT, STOPPED, EXPIRED]
        generatedAt:   { type: string, format: date-time }
        triggeredAt:   { type: string, format: date-time, nullable: true }
        exitedAt:      { type: string, format: date-time, nullable: true }
        exitReason:
          type: string
          nullable: true
          enum: [TARGET1_HIT, TARGET2_HIT, STOPPED, EXPIRED_TRIGGERED, EXPIRED_PENDING, STALE_TRIGGER]
          description: "Reason the lifecycle row exited. STALE_TRIGGER is a Phase-1 quality gate for PENDING rows whose trigger has not fired within ~45 minutes."
        exitPrice:     { type: number, nullable: true }
        maxFavorableExcursionPts: { type: number }
        maxAdverseExcursionPts:   { type: number }
        lastSpot:      { type: number }
        lastEvaluatedAt: { type: string, format: date-time }

    OptionSignalHistorySet:
      type: object
      required: [signalDate, generatedAt, signals]
      properties:
        signalDate:  { type: string, description: "IST trading date YYYY-MM-DD" }
        generatedAt: { type: string, format: date-time }
        signals:
          type: array
          items: { $ref: "#/components/schemas/OptionSignalHistoryItem" }

    OptionSignalReportResponse:
      type: object
      required: [mode, label, generatedAt, signals]
      properties:
        mode:  { type: string, enum: [daily, monthly] }
        label: { type: string, description: "Human-readable label, e.g. 2026-05-04 or May 2026" }
        generatedAt: { type: string, format: date-time }
        signals:
          type: array
          items: { $ref: "#/components/schemas/OptionSignalHistoryItem" }

    TopScans:
      type: object
      required: [topBuys, topSells, generatedAt]
      properties:
        topBuys:
          type: array
          items: { $ref: "#/components/schemas/StockRow" }
        topSells:
          type: array
          items: { $ref: "#/components/schemas/StockRow" }
        generatedAt: { type: string, format: date-time }

    FiiDiiDay:
      type: object
      required: [date, fiiBuy, fiiSell, fiiNet, diiBuy, diiSell, diiNet, source]
      properties:
        date:    { type: string, description: "YYYY-MM-DD" }
        fiiBuy:  { type: number }
        fiiSell: { type: number }
        fiiNet:  { type: number }
        diiBuy:  { type: number }
        diiSell: { type: number }
        diiNet:  { type: number }
        source:  { type: string }
        niftyClose:     { type: number, nullable: true }
        niftyChangePct: { type: number, nullable: true }

    FiiDiiMonth:
      type: object
      required: [month, label, fiiBuy, fiiSell, fiiNet, diiBuy, diiSell, diiNet, daysCount, days]
      properties:
        month:     { type: string, description: "YYYY-MM" }
        label:     { type: string }
        fiiBuy:    { type: number }
        fiiSell:   { type: number }
        fiiNet:    { type: number }
        diiBuy:    { type: number }
        diiSell:   { type: number }
        diiNet:    { type: number }
        daysCount: { type: integer }
        days:
          type: array
          items: { $ref: "#/components/schemas/FiiDiiDay" }

    FiiDiiResponse:
      type: object
      required: [months, generatedAt]
      properties:
        months:
          type: array
          items: { $ref: "#/components/schemas/FiiDiiMonth" }
        generatedAt: { type: string, format: date-time }

    FnoBanListResponse:
      type: object
      required: [symbols, count, available]
      properties:
        symbols:
          type: array
          items: { type: string }
          description: "F&O underlyings restricted to square-off-only trades today"
        count:    { type: integer }
        sourceUrl:
          type: string
          nullable: true
          description: "Upstream NSE archive URL the list was loaded from"
        fetchedAt:
          type: string
          format: date-time
          nullable: true
        cached:    { type: boolean, description: "true when served from in-process cache (≤30 min old)" }
        available: { type: boolean, description: "false when all NSE upstreams were unreachable; treat as 'unknown' rather than 'no bans'" }

    ParticipantOiRow:
      type: object
      required:
        - clientType
        - futureIndexLong
        - futureIndexShort
        - futureIndexNet
        - futureStockLong
        - futureStockShort
        - futureStockNet
        - optionIndexCallLong
        - optionIndexCallShort
        - optionIndexPutLong
        - optionIndexPutShort
        - optionStockCallLong
        - optionStockCallShort
        - optionStockPutLong
        - optionStockPutShort
        - totalLongContracts
        - totalShortContracts
        - netContracts
      properties:
        clientType:             { type: string }
        futureIndexLong:        { type: integer }
        futureIndexShort:       { type: integer }
        futureIndexNet:         { type: integer }
        futureStockLong:        { type: integer }
        futureStockShort:       { type: integer }
        futureStockNet:         { type: integer }
        optionIndexCallLong:    { type: integer }
        optionIndexCallShort:   { type: integer }
        optionIndexPutLong:     { type: integer }
        optionIndexPutShort:    { type: integer }
        optionStockCallLong:    { type: integer }
        optionStockCallShort:   { type: integer }
        optionStockPutLong:     { type: integer }
        optionStockPutShort:    { type: integer }
        totalLongContracts:     { type: integer }
        totalShortContracts:    { type: integer }
        netContracts:           { type: integer }

    ParticipantOiResponse:
      type: object
      required: [date, rows, availableDates, generatedAt]
      properties:
        date:           { type: string, nullable: true }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ParticipantOiRow" }
        availableDates:
          type: array
          items: { type: string }
        previousDate:
          type: string
          nullable: true
          description: |
            The trading date immediately preceding `date` for which we have
            participant-OI data, used by the Segment View to compute
            day-over-day "Change OI". Null if `date` is the oldest available.
        previousRows:
          type: array
          description: |
            Participant rows for `previousDate`. Empty when no prior date
            exists. Same shape as `rows`.
          items: { $ref: "#/components/schemas/ParticipantOiRow" }
        generatedAt:    { type: string, format: date-time }

    ParticipantOiAuditCell:
      type: object
      description: |
        Computed Net OI for one (participant × segment) cell, alongside the
        raw long/short components that fed the formula. Use this to verify
        that the directional options formula is being applied correctly.
      required: [segment, formula, net]
      properties:
        segment:
          type: string
          enum: [indexFut, stockFut, indexOpt, stockOpt]
        formula:
          type: string
          description: Human-readable formula string used to compute `net`.
        components:
          type: object
          description: Raw long/short legs that fed the formula.
          additionalProperties: { type: integer }
        net: { type: integer }
        change:
          type: integer
          nullable: true
          description: Net(today) − Net(prev). Null when prev data is missing.

    ParticipantOiAuditParticipant:
      type: object
      required: [clientType, segments]
      properties:
        clientType: { type: string }
        segments:
          type: array
          items: { $ref: "#/components/schemas/ParticipantOiAuditCell" }

    ParticipantOiAuditResponse:
      type: object
      required: [date, source, sourceUrl, fetchedAt, participants, generatedAt]
      properties:
        date:
          type: string
          nullable: true
          description: Trading date the audit covers (YYYY-MM-DD).
        previousDate:
          type: string
          nullable: true
          description: |
            Prior trading date with data, used as the baseline for Change OI.
        source:
          type: string
          description: Logical source name (e.g. "nse-archive").
        sourceUrl:
          type: string
          nullable: true
          description: |
            Upstream URL the persisted row originated from, when known. The
            participant-OI ingestion always reads
            `https://archives.nseindia.com/content/nsccl/fao_participant_oi_DDMMYYYY.csv`.
        fetchedAt:
          type: string
          format: date-time
          nullable: true
          description: When the persisted row was last upserted.
        participants:
          type: array
          items: { $ref: "#/components/schemas/ParticipantOiAuditParticipant" }
        generatedAt:
          type: string
          format: date-time

    MarketHoliday:
      type: object
      required: [date, name, exchange, region]
      properties:
        date:     { type: string, description: "YYYY-MM-DD" }
        name:     { type: string }
        exchange: { type: string }
        region:   { type: string, enum: [IN, US, UK, EU, JP, HK, CN] }

    EarningResult:
      type: object
      required: [date, symbol, name, source]
      properties:
        date:        { type: string }
        symbol:      { type: string }
        name:        { type: string }
        estimateEPS: { type: number }
        source:      { type: string }

    EconomicEvent:
      type: object
      required: [date, name, region, category, impact]
      properties:
        date:        { type: string }
        name:        { type: string }
        region:      { type: string, enum: [IN, US, UK, EU, JP, GLOBAL] }
        category:    { type: string, enum: [rate, data, policy, event] }
        impact:      { type: string, enum: [high, medium, low] }
        description: { type: string }

    MarketEventsResponse:
      type: object
      required: [generatedAt, holidays, earnings, events]
      properties:
        generatedAt: { type: string, format: date-time }
        holidays:
          type: object
          required: [upcoming, total]
          properties:
            upcoming:
              type: array
              items: { $ref: "#/components/schemas/MarketHoliday" }
            total: { type: integer }
        earnings:
          type: array
          items: { $ref: "#/components/schemas/EarningResult" }
        events:
          type: array
          items: { $ref: "#/components/schemas/EconomicEvent" }

    PreMarketSentiment:
      type: string
      enum: [STRONG_BULLISH, BULLISH, NEUTRAL, BEARISH, STRONG_BEARISH]

    OvernightCue:
      type: object
      required: [label, value, changePercent, sentiment]
      properties:
        label:         { type: string, description: "Human label e.g. 'GIFT NIFTY (proxy)'" }
        symbol:        { type: string }
        category:      { type: string, enum: [proxy, asia, us, europe, commodity, currency, vix] }
        value:         { type: number }
        changePercent: { type: number }
        change:        { type: number }
        sentiment:     { type: string, enum: [bullish, bearish, neutral] }
        note:          { type: string, description: "Optional context note" }
        asOf:          { type: string, format: date-time }
        inverted:      { type: boolean, description: "True if cue inversely correlates with Indian equities (e.g. DXY, VIX)" }

    PreMarketMover:
      type: object
      required: [symbol, name, price, changePercent, change]
      properties:
        symbol:        { type: string }
        name:          { type: string }
        sector:        { type: string }
        price:         { type: number }
        previousClose: { type: number }
        change:        { type: number }
        changePercent: { type: number }
        volume:        { type: number }

    GapStock:
      type: object
      required: [symbol, name, gapPercent, gapDirection, atrPct]
      properties:
        symbol:       { type: string }
        name:         { type: string }
        sector:       { type: string }
        previousClose: { type: number }
        currentPrice: { type: number }
        gapPercent:   { type: number, description: "(current - prev) / prev * 100" }
        gapDirection: { type: string, enum: [UP, DOWN] }
        atrPct:       { type: number, description: "ATR(14) as % of price" }
        gapVsAtr:     { type: number, description: "gapPercent / atrPct — >1 means gap exceeds normal daily range" }
        signal:       { type: string, enum: [STRONG_BUY, BUY, NEUTRAL, SELL, STRONG_SELL] }

    PreMarketIndexPreview:
      type: object
      required: [symbol, name, previousClose, indicativeChangePercent]
      properties:
        symbol: { type: string }
        name:   { type: string }
        previousClose: { type: number }
        indicativePrice: { type: number, description: "Best estimate of opening price (GIFT proxy or last close)" }
        indicativeChange: { type: number }
        indicativeChangePercent: { type: number }
        source: { type: string, description: "e.g. 'GIFT NIFTY proxy', 'previous close (no pre-open data)'" }

    PostMarketDigest:
      type: object
      required: [advancers, decliners, unchanged, totalVolume, marketBreadthScore, new52wHigh, new52wLow, upperCircuits, lowerCircuits, narrative]
      properties:
        advancers: { type: integer }
        decliners: { type: integer }
        unchanged: { type: integer }
        adRatio:   { type: number, nullable: true }
        totalVolume: { type: number }
        avgChangePercent: { type: number }
        marketBreadthScore: { type: number, description: "-100 to 100" }
        new52wHigh:    { type: integer, description: "Stocks within 0.5% of their 52-week high" }
        new52wLow:     { type: integer, description: "Stocks within 0.5% of their 52-week low" }
        upperCircuits: { type: integer, description: "Stocks at +4.8% or more (probable upper circuit hit)" }
        lowerCircuits: { type: integer, description: "Stocks at -4.8% or less (probable lower circuit hit)" }
        narrative: { type: string, description: "One-line market summary" }

    KeyIndexLevels:
      type: object
      required: [symbol, name, previousClose, prevHigh, prevLow, weekHigh, weekLow, yearHigh, yearLow, pivot, r1, r2, s1, s2, cprTop, cprPivot, cprBottom, cprWidthPct, cprWidthLabel, positionInYearRangePct]
      description: "Pro pre-market index level pack. CPR (Central Pivot Range) and classic floor pivots from previous-session OHLC. Narrow CPR (<0.4% of price) tends to precede a trending day, wide CPR (>1.0%) precedes range/chop. positionInYearRangePct = where price sits inside the 52-week high-low band (0%=at low, 100%=at high)."
      properties:
        symbol:                  { type: string, description: "Yahoo-style symbol (e.g. ^NSEI)" }
        name:                    { type: string, description: "Display name (e.g. NIFTY 50)" }
        previousClose:           { type: number }
        prevHigh:                { type: number, description: "Previous session high" }
        prevLow:                 { type: number, description: "Previous session low" }
        todayOpen:               { type: number, nullable: true, description: "Today's open if market has opened" }
        weekHigh:                { type: number, description: "Highest close over last 5 trading days" }
        weekLow:                 { type: number, description: "Lowest close over last 5 trading days" }
        monthHigh:               { type: number, nullable: true, description: "Highest close over last 21 trading days" }
        monthLow:                { type: number, nullable: true, description: "Lowest close over last 21 trading days" }
        yearHigh:                { type: number, description: "52-week high (~252 trading days)" }
        yearLow:                 { type: number, description: "52-week low" }
        pivot:                   { type: number, description: "Classic floor pivot P = (PH + PL + PC) / 3" }
        r1:                      { type: number }
        r2:                      { type: number }
        s1:                      { type: number }
        s2:                      { type: number }
        cprTop:                  { type: number, description: "TC = 2P - BC (top of CPR)" }
        cprPivot:                { type: number, description: "= classic pivot, middle of CPR" }
        cprBottom:               { type: number, description: "BC = (PH + PL) / 2 (bottom of CPR)" }
        cprWidthPct:             { type: number, description: "(TC - BC) / PC * 100" }
        cprWidthLabel:           { type: string, enum: [NARROW, NORMAL, WIDE], description: "NARROW < 0.4% (trending day likely), WIDE > 1.0% (range/chop likely)" }
        positionInYearRangePct:  { type: number, description: "0..100 — distance through the 52-week range (PC at yearLow=0, at yearHigh=100)" }

    OptionSnapshot:
      type: object
      required: [underlying, spot, expiry, daysToExpiry, expiryContext, atmStrike, atmStraddle, expectedMovePct, pcrOi, pcrVolume, maxPain, bias, interpretation, generatedAt]
      description: "Compact pre-market option-chain read for a single F&O underlying. Sourced from the same chain endpoint that powers the Options page; surfaced here so the morning checklist (ATM strike, expected move, PCR, max-pain, top OI walls) is one glance away."
      properties:
        underlying:       { type: string, description: "F&O underlying e.g. NIFTY, BANKNIFTY, FINNIFTY" }
        spot:             { type: number }
        expiry:           { type: string, description: "Active expiry as returned by NSE (YYYY-MM-DD or DD-MMM-YYYY)" }
        daysToExpiry:     { type: integer, description: "Calendar days from today (IST) to the active expiry; 0 = expires today" }
        expiryContext:    { type: string, enum: [EXPIRY_TODAY, EXPIRY_TOMORROW, EXPIRY_THIS_WEEK, EXPIRY_NEXT_WEEK, FAR], description: "Bucket for quick visual flagging — expiry day means heightened intraday volatility and theta-decay traps" }
        atmStrike:        { type: number }
        atmStraddle:      { type: number, description: "ATM CE LTP + ATM PE LTP (in points)" }
        expectedMovePct:  { type: number, description: "atmStraddle / spot * 100 — implied move by expiry" }
        pcrOi:            { type: number }
        pcrVolume:        { type: number }
        atmIv:            { type: number, nullable: true, description: "ATM straddle IV (% annualised)" }
        maxPain:          { type: number, description: "Strike where option writers lose least" }
        maxCallOiStrike:  { type: number, nullable: true, description: "Resistance — strike with biggest CE open interest" }
        maxPutOiStrike:   { type: number, nullable: true, description: "Support — strike with biggest PE open interest" }
        bias:             { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        interpretation:   { type: string, description: "Plain-English read in one line" }
        generatedAt:      { type: string, format: date-time }

    SectorHeatmapEntry:
      type: object
      required: [sector, avgChangePercent, gainers, losers, stockCount]
      description: "One row of the daily sector ranking — full leader→laggard list (the existing /market/trend endpoint only returns top-3 leaders + bottom-3 laggards, this ranks every NSE sectoral index)."
      properties:
        sector:           { type: string, description: "Sector display name (Banks, IT, Auto, Pharma, …)" }
        avgChangePercent: { type: number, description: "Mean % change of constituent stocks today" }
        gainers:          { type: integer, description: "Stocks closing positive in the sector" }
        losers:           { type: integer, description: "Stocks closing negative in the sector" }
        stockCount:       { type: integer, description: "Sector universe size from this scan" }
        topPickSymbol:    { type: string, description: "Highest-scoring stock in the sector" }

    FiiDiiSnapshot:
      type: object
      required: [latestDate, fiiCashCr, diiCashCr, fiveDayFiiCr, fiveDayDiiCr]
      description: "Last published cash-segment FII / DII net activity, plus 5-day rolling totals. Values are in INR Crores. Negative = net seller, positive = net buyer."
      properties:
        latestDate:    { type: string, format: date, description: "Trading date the latest figures belong to (T-1 typically)" }
        fiiCashCr:     { type: number, description: "FII cash-segment net for latestDate (INR Cr)" }
        diiCashCr:     { type: number, description: "DII cash-segment net for latestDate (INR Cr)" }
        fiveDayFiiCr:  { type: number, description: "Sum of FII cash-segment net over the most recent 5 trading days" }
        fiveDayDiiCr:  { type: number, description: "Sum of DII cash-segment net over the most recent 5 trading days" }

    TradingScenario:
      type: object
      required: [kind, label, trigger, actions, invalidation, probability]
      description: "One of three pre-planned scenarios for the day (bullish / bearish / range). A pro trader prepares all three before the open and follows whichever one the market actually takes — never tries to predict a single outcome."
      properties:
        kind:        { type: string, enum: [BULLISH, BEARISH, RANGE] }
        label:       { type: string, description: "Short headline e.g. 'Bullish breakout above R1'" }
        trigger:     { type: string, description: "Specific level/condition that activates this scenario" }
        actions:
          type: array
          items: { type: string }
          description: "Concrete steps to take if this scenario plays out"
        invalidation: { type: string, description: "Specific level/condition that proves this scenario is wrong — abandon the plan and switch to the appropriate alternative." }
        probability: { type: string, enum: [HIGH, MEDIUM, LOW], description: "Heuristic likelihood given current overnight setup" }

    # ── Pro Market Analyser (Phase A) — reporting-only enrichments ──
    # Every schema below is surfaced as an OPTIONAL field on PreMarketReport.
    # Each carries source/asOf freshness labels and is failure-isolated server
    # side, so any single upstream outage simply omits its block. None of these
    # feed signal generation, paper-trade execution, or any trading decision.

    ParticipantOiSegment:
      type: object
      required: [clientType, futureIndexLong, futureIndexShort, futureIndexNet, lsrPct, longShortRatio, netChange]
      description: "One participant category's index-futures positioning for the session."
      properties:
        clientType:       { type: string, description: "FII / DII / Pro / Client" }
        futureIndexLong:  { type: number, description: "Index-futures long contracts" }
        futureIndexShort: { type: number, description: "Index-futures short contracts" }
        futureIndexNet:   { type: number, description: "long − short" }
        lsrPct:           { type: number, nullable: true, description: "Long-share % = long / (long+short) × 100" }
        longShortRatio:   { type: number, nullable: true, description: "long / short" }
        netChange:        { type: number, nullable: true, description: "futureIndexNet vs the previous session" }

    ParticipantOiView:
      type: object
      required: [date, previousDate, segments, fiiLsrPct, fiiNetChange, aggIndexFutOi, aggIndexFutOiChgPct, divergence, signal, note, source, asOf]
      description: "NSE participant-wise index-futures OI (EOD). FII long-share % is the headline 'king metric': ≤30% bearish, ≥60% bullish."
      properties:
        date:                { type: string, description: "Session date for the figures" }
        previousDate:        { type: string, nullable: true }
        segments:
          type: array
          items: { $ref: "#/components/schemas/ParticipantOiSegment" }
        fiiLsrPct:           { type: number, nullable: true, description: "FII index-futures long-share %" }
        fiiNetChange:        { type: number, nullable: true }
        aggIndexFutOi:       { type: number, nullable: true, description: "Aggregate index-futures OI (Σ longs across participants)" }
        aggIndexFutOiChgPct: { type: number, nullable: true, description: "Day-over-day % change in aggregate index-futures OI" }
        divergence:          { type: string, nullable: true, description: "FII-vs-Client positioning divergence note, when present" }
        signal:              { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        note:                { type: string }
        source:              { type: string }
        asOf:                { type: string }

    IndexOiBuildup:
      type: object
      required: [label, priceChgPct, oiChgPct, classification, bias, interpretation, note, source, asOf]
      description: "Price × OI buildup classification for aggregate index futures (same-session NIFTY move vs aggregate futures-OI change)."
      properties:
        label:          { type: string }
        priceChgPct:    { type: number, nullable: true }
        oiChgPct:       { type: number, nullable: true }
        classification: { type: string, enum: [LONG_BUILDUP, SHORT_BUILDUP, SHORT_COVERING, LONG_UNWINDING, NEUTRAL, DATA_UNAVAILABLE] }
        bias:           { type: string, enum: [BULLISH, BEARISH, NEUTRAL, UNKNOWN] }
        interpretation: { type: string, description: "Human-readable one-liner from the classifier" }
        note:           { type: string, description: "Context / data-availability note" }
        source:         { type: string }
        asOf:           { type: string }

    StrikeOiChangeEntry:
      type: object
      required: [strike, chgOi, oiChgPct, action]
      properties:
        strike:   { type: number }
        chgOi:    { type: number, description: "Change in open interest (contracts)" }
        oiChgPct: { type: number, nullable: true }
        action:   { type: string, description: "Plain-English read e.g. 'Call writing (resistance building)'" }

    StrikeOiChange:
      type: object
      required: [underlying, spot, expiry, topCallWriting, topPutWriting, topCallUnwinding, topPutUnwinding, read, source, asOf]
      description: "Top strike-level OI-change clusters for one underlying — fresh call/put writing (range edges) and unwinding."
      properties:
        underlying:       { type: string }
        spot:             { type: number }
        expiry:           { type: string }
        topCallWriting:   { type: array, items: { $ref: "#/components/schemas/StrikeOiChangeEntry" } }
        topPutWriting:    { type: array, items: { $ref: "#/components/schemas/StrikeOiChangeEntry" } }
        topCallUnwinding: { type: array, items: { $ref: "#/components/schemas/StrikeOiChangeEntry" } }
        topPutUnwinding:  { type: array, items: { $ref: "#/components/schemas/StrikeOiChangeEntry" } }
        read:             { type: string }
        source:           { type: string }
        asOf:             { type: string }

    FiveDayFlowDay:
      type: object
      required: [date, fiiNet, diiNet, niftyChangePct]
      properties:
        date:           { type: string }
        fiiNet:         { type: number, description: "FII cash net (INR Cr)" }
        diiNet:         { type: number, description: "DII cash net (INR Cr)" }
        niftyChangePct: { type: number, nullable: true }

    FiveDayFlow:
      type: object
      required: [days, cumFiiCr, cumDiiCr, fiiTrend, diiTrend, read, source, asOf]
      description: "Trailing 5-session FII/DII cash flow trend with cumulative totals (INR Cr)."
      properties:
        days:
          type: array
          items: { $ref: "#/components/schemas/FiveDayFlowDay" }
          description: "Chronological, oldest → newest"
        cumFiiCr: { type: number }
        cumDiiCr: { type: number }
        fiiTrend: { type: string, enum: [ACCUMULATING, DISTRIBUTING, MIXED] }
        diiTrend: { type: string, enum: [ACCUMULATING, DISTRIBUTING, MIXED] }
        read:     { type: string }
        source:   { type: string }
        asOf:     { type: string }

    MacroOverlayRow:
      type: object
      required: [label, symbol, value, changePercent, impact, note]
      properties:
        label:         { type: string }
        symbol:        { type: string, nullable: true }
        value:         { type: number, nullable: true }
        changePercent: { type: number, nullable: true }
        impact:        { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        note:          { type: string }

    MacroOverlay:
      type: object
      required: [rows, macroScore, read, source, asOf]
      description: "Global macro backdrop (DXY / US 10Y / USDINR / crude / gold). macroScore is a -3..+3 composite fed into the bias score; null when no inputs are live."
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/MacroOverlayRow" }
        macroScore: { type: number, nullable: true }
        read:       { type: string }
        source:     { type: string }
        asOf:       { type: string }

    SectorRotationEntry:
      type: object
      required: [sector, avgChangePercent, flow]
      properties:
        sector:           { type: string }
        avgChangePercent: { type: number }
        flow:             { type: string, enum: [INFLOW, OUTFLOW, NEUTRAL] }
        topPickSymbol:    { type: string }

    SectorRotation:
      type: object
      required: [leaders, laggards, breadthPositive, breadthNegative, rotationRead, source, asOf]
      description: "Sector rotation read derived from the live sector heatmap — leaders, laggards, breadth."
      properties:
        leaders:
          type: array
          items: { $ref: "#/components/schemas/SectorRotationEntry" }
        laggards:
          type: array
          items: { $ref: "#/components/schemas/SectorRotationEntry" }
        breadthPositive: { type: integer }
        breadthNegative: { type: integer }
        rotationRead:    { type: string }
        source:          { type: string }
        asOf:            { type: string }

    BiasSignalBreakdown:
      type: object
      required: [signal, weight, rawValue, score, contribution, note]
      properties:
        signal:       { type: string }
        weight:       { type: number }
        rawValue:     { type: number, nullable: true }
        score:        { type: number, nullable: true, description: "Per-signal score -3..+3" }
        contribution: { type: number, description: "score × weight" }
        note:         { type: string }

    CompositeBias:
      type: object
      required: [score, label, verdict, breakdown, totalWeightUsed, dataCompleteness, invalidation, source, asOf, methodologyNote]
      description: "Composite next-day bias score (-10..+10) synthesised from GIFT / FII-DII cash / participant OI / PCR / VIX / macro. Reporting-only; null feeds are excluded from numerator and denominator."
      properties:
        score:            { type: number, description: "-10..+10, 1 decimal" }
        label:            { type: string, enum: [STRONGLY_BULLISH, MILDLY_BULLISH, NEUTRAL, MILDLY_BEARISH, STRONGLY_BEARISH] }
        verdict:          { type: string }
        breakdown:
          type: array
          items: { $ref: "#/components/schemas/BiasSignalBreakdown" }
        totalWeightUsed:  { type: number, description: "Sum of weights for signals with data (max 9.0)" }
        dataCompleteness: { type: number, description: "usedWeight / 9.0, 0..1" }
        invalidation:
          type: object
          required: [bullishFlip, bearishAcceleration]
          properties:
            bullishFlip:         { type: string }
            bearishAcceleration: { type: string }
        source:           { type: string }
        asOf:             { type: string }
        methodologyNote:  { type: string }

    TradeSetup:
      type: object
      required: [symbol, direction, label, entry, target, stop, riskReward, rationale, invalidation]
      description: "Derived actionable trade setup from classical pivots + composite bias. REPORTING ONLY — never placed, sized, or executed."
      properties:
        symbol:       { type: string }
        direction:    { type: string, enum: [LONG, SHORT, RANGE] }
        label:        { type: string }
        entry:        { type: number, description: "Suggested entry reference (price)" }
        target:       { type: number }
        stop:         { type: number }
        riskReward:   { type: number, nullable: true, description: "Reward-to-risk multiple; null when degenerate (zero risk)" }
        rationale:    { type: string }
        invalidation: { type: string }

    TradeSetups:
      type: object
      required: [setups, biasScore, source, asOf]
      description: "Bundle of derived trade setups keyed off the composite bias score."
      properties:
        setups:
          type: array
          items: { $ref: "#/components/schemas/TradeSetup" }
        biasScore: { type: number }
        source:    { type: string }
        asOf:      { type: string }

    PreMarketReport:
      type: object
      required: [mode, sentiment, sentimentScore, narrative, overnightCues, indexPreviews, generatedAt]
      properties:
        mode: { type: string, enum: [PRE_MARKET, POST_MARKET, LIVE], description: "Auto-detected based on IST time" }
        sentiment: { $ref: "#/components/schemas/PreMarketSentiment" }
        sentimentScore: { type: number, description: "-100..+100 composite of all overnight cues" }
        narrative: { type: string, description: "Human-readable trading-desk style summary" }
        keyTakeaways:
          type: array
          items: { type: string }
          description: "Bullet points distilled from the cues"
        overnightCues:
          type: array
          items: { $ref: "#/components/schemas/OvernightCue" }
        indexPreviews:
          type: array
          items: { $ref: "#/components/schemas/PreMarketIndexPreview" }
        scenarios:
          type: array
          items: { $ref: "#/components/schemas/TradingScenario" }
          description: "3 pre-planned scenarios for today (bullish / bearish / range) with triggers + action plans"
        indexLevels:
          type: array
          items: { $ref: "#/components/schemas/KeyIndexLevels" }
          description: "Pro pre-market level pack — CPR + classic pivots + previous-day H/L + weekly H/L + 52-week H/L for the 5 main F&O indices"
        optionSnapshots:
          type: array
          items: { $ref: "#/components/schemas/OptionSnapshot" }
          description: "Morning option-chain summary for NIFTY / BANKNIFTY / FINNIFTY (omitted when no Kite session is active and NSE is geo-blocked)"
        sectorHeatmap:
          type: array
          items: { $ref: "#/components/schemas/SectorHeatmapEntry" }
          description: "Full sector ranking, leader → laggard"
        fiiDii: { $ref: "#/components/schemas/FiiDiiSnapshot" }
        topGainers:
          type: array
          items: { $ref: "#/components/schemas/PreMarketMover" }
        topLosers:
          type: array
          items: { $ref: "#/components/schemas/PreMarketMover" }
        gapUps:
          type: array
          items: { $ref: "#/components/schemas/GapStock" }
        gapDowns:
          type: array
          items: { $ref: "#/components/schemas/GapStock" }
        eventsToday:
          type: array
          items: { $ref: "#/components/schemas/EconomicEvent" }
        earningsToday:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              name: { type: string }
              date: { type: string, format: date }
        postMarketDigest: { $ref: "#/components/schemas/PostMarketDigest" }
        tomorrowSetup: { $ref: "#/components/schemas/TomorrowSetup" }
        participantOi: { $ref: "#/components/schemas/ParticipantOiView" }
        indexOiBuildup: { $ref: "#/components/schemas/IndexOiBuildup" }
        strikeOiChanges:
          type: array
          items: { $ref: "#/components/schemas/StrikeOiChange" }
          description: "Top strike-level OI-change clusters per F&O underlying (Pro Market Analyser)"
        fiveDayFlows: { $ref: "#/components/schemas/FiveDayFlow" }
        macroOverlay: { $ref: "#/components/schemas/MacroOverlay" }
        sectorRotation: { $ref: "#/components/schemas/SectorRotation" }
        compositeBias: { $ref: "#/components/schemas/CompositeBias" }
        tradeSetups: { $ref: "#/components/schemas/TradeSetups" }
        generatedAt: { type: string, format: date-time }

    OiBuildupStockRow:
      type: object
      properties:
        symbol: { type: string }
        priceChgPct: { type: number }
        oiChgPct: { type: number }

    OiBuildupSummary:
      type: object
      description: "F&O OI buildup summary — count of stocks in each buildup bucket plus top movers per bucket"
      properties:
        longBuildup: { type: integer }
        shortBuildup: { type: integer }
        shortCovering: { type: integer }
        longUnwinding: { type: integer }
        neutral: { type: integer }
        topLongBuildup:
          type: array
          items: { $ref: "#/components/schemas/OiBuildupStockRow" }
        topShortBuildup:
          type: array
          items: { $ref: "#/components/schemas/OiBuildupStockRow" }
        topShortCovering:
          type: array
          items: { $ref: "#/components/schemas/OiBuildupStockRow" }
        topLongUnwinding:
          type: array
          items: { $ref: "#/components/schemas/OiBuildupStockRow" }

    HighDeliveryStock:
      type: object
      properties:
        symbol: { type: string }
        deliveryPct: { type: number, description: "Delivery percentage from NSE bhavcopy (50%+ is considered high)" }

    TomorrowSetup:
      type: object
      description: "Condensed 'Setup for Tomorrow' data — Moneycontrol-style '15 things to know'. OI buildup summary, high-delivery stocks, and F&O ban list. Other items (PCR, VIX, key levels, FII/DII) are in sibling fields."
      properties:
        oiBuildupSummary:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/OiBuildupSummary" }
        highDeliveryStocks:
          type: array
          items: { $ref: "#/components/schemas/HighDeliveryStock" }
        foBanStocks:
          type: array
          items: { type: string }
          description: "Symbols currently under F&O ban (MWPL > 95%)"

    WatchlistTrend:
      type: string
      enum: ["Very Bullish", "Bullish", "Neutral", "Bearish", "Very Bearish"]
    WatchlistRow:
      type: object
      required: [symbol, name, livePrice, previousClose, change, changePercent, open, todayHigh, todayLow, volume, mcTrend]
      properties:
        symbol: { type: string }
        name: { type: string }
        livePrice: { type: number }
        previousClose: { type: number }
        change: { type: number }
        changePercent: { type: number }
        open: { type: number }
        todayHigh: { type: number }
        todayLow: { type: number }
        volume: { type: number }
        ema20: { type: number }
        ema50: { type: number }
        rsi: { type: number }
        mcTrend: { $ref: "#/components/schemas/WatchlistTrend" }
    WatchlistResponse:
      type: object
      required: [key, label, description, asOf, count, rows]
      properties:
        key: { type: string, enum: [SENSEX, BANKNIFTY, NIFTY50, NIFTY100, NIFTYMIDCAP100, NIFTYSMALLCAP100, NIFTY500] }
        label: { type: string }
        description: { type: string }
        asOf: { type: string, format: date-time }
        count: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/WatchlistRow" }

    OptionChainSide:
      type: object
      properties:
        oi:           { type: integer, description: "Open Interest in contracts" }
        chgOi:        { type: integer, description: "OI change since prev close" }
        oiChgPct:     { type: number, nullable: true, description: "Day-over-day OI % change. Null when prior-day OI cannot be derived." }
        volume:       { type: integer }
        volOiRatio:   { type: number, nullable: true, description: "Volume / OI for this leg — proxy for fresh speculative activity. Null when OI is zero/missing." }
        iv:           { type: number, description: "Implied Volatility (% annualised)" }
        ltp:          { type: number, description: "Last traded premium" }
        ltpChgPct:    { type: number, nullable: true, description: "Day-over-day LTP % change vs previous session close. Null when prev close is unavailable (e.g. NSE-direct path)." }
        bid:          { type: number }
        ask:          { type: number }
        bidQty:       { type: integer }
        askQty:       { type: integer }
        delta:        { type: number }
        theta:        { type: number }
        gamma:        { type: number }
        vega:         { type: number }
        intrinsic:    { type: number }
        intrinsicPct: { type: number, nullable: true, description: "Intrinsic / LTP × 100 — share of premium that is real intrinsic value (rest is time value)." }
        timeValue:    { type: number }
        moneyness:    { type: string, enum: [ITM, ATM, OTM] }
        oiBuildup:    { type: string, enum: [LONG_BUILDUP, SHORT_BUILDUP, LONG_UNWINDING, SHORT_COVERING, NEUTRAL] }

    OptionChainStrikeRow:
      type: object
      required: [strike]
      properties:
        strike:    { type: number }
        ce:        { $ref: "#/components/schemas/OptionChainSide" }
        pe:        { $ref: "#/components/schemas/OptionChainSide" }
        pcrOi:     { type: number, nullable: true, description: "Per-strike Put/Call ratio by OI (pe.oi / ce.oi). Null when CE OI is zero." }
        pcrVol:    { type: number, nullable: true, description: "Per-strike Put/Call ratio by Volume. Null when CE volume is zero." }
        isMaxPain: { type: boolean, description: "True on the single Max-Pain strike for the expiry." }

    OptionChainResponse:
      type: object
      required: [underlying, spot, expiry, expiries, atmStrike, strikeStep, rows, source, generatedAt]
      properties:
        underlying:     { type: string }
        underlyingName: { type: string }
        kind:           { type: string, enum: [INDEX, EQUITY] }
        spot:           { type: number }
        prevClose:      { type: number }
        changePercent:  { type: number }
        expiry:         { type: string, description: "Active expiry YYYY-MM-DD" }
        expiries:
          type: array
          items: { type: string }
        atmStrike:      { type: number }
        strikeStep:     { type: number }
        lotSize:        { type: integer }
        maxPainStrike:  { type: number, nullable: true, description: "Strike where option writers' aggregate loss is minimised — same algorithm as analytics, surfaced inline so the chain table can mark the row." }
        rows:
          type: array
          items: { $ref: "#/components/schemas/OptionChainStrikeRow" }
        source:         { type: string, description: "Origin tag — 'NSE' for live fetch, 'kite' for Kite-derived" }
        generatedAt:    { type: string, format: date-time }

    OiClusterStrike:
      type: object
      required: [strike, oi]
      properties:
        strike: { type: number }
        oi:     { type: integer }
        chgOi:  { type: integer, nullable: true, description: "Today's net OI change on this side at this strike. Positive = writers adding (level being defended); negative = unwinding. Null when previous OI is unavailable." }
        volume: { type: integer, description: "Volume at this strike on this side" }
        strength: { type: string, enum: [STRONG, MEDIUM, WEAK], description: "Computed strength of this level based on OI magnitude, OI change direction, volume activity, and proximity to spot" }

    MarketReadReason:
      type: object
      required: [signal, detail, impact]
      properties:
        signal: { type: string, description: "Short label for this signal (e.g. PCR, Max Pain, OI Flow)" }
        detail: { type: string, description: "Human-readable explanation" }
        impact: { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }

    OptionAnalyticsResponse:
      type: object
      required: [underlying, spot, expiry, pcrOi, pcrVolume, maxPain, totalCallOi, totalPutOi, marketStatus, generatedAt]
      properties:
        underlying:    { type: string }
        spot:          { type: number }
        expiry:        { type: string }
        pcrOi:         { type: number, description: "Put/Call ratio by Open Interest" }
        pcrVolume:     { type: number, description: "Put/Call ratio by Volume" }
        maxPain:       { type: number, description: "Max-pain strike — where most options expire worthless" }
        atmIv:         { type: number, nullable: true, description: "ATM straddle IV (avg of CE+PE)" }
        ivPercentile:  { type: number, nullable: true, description: "IV percentile — % of days in the lookback where ATM IV was below current (null until history is built)" }
        ivRank:        { type: number, nullable: true, description: "IV Rank — (current - min) / (max - min) over lookback window, 0-100 (null until history is built)" }
        totalCallOi:   { type: integer }
        totalPutOi:    { type: integer }
        callOiAdded:   { type: integer }
        putOiAdded:    { type: integer }
        topResistance:
          type: array
          items: { $ref: "#/components/schemas/OiClusterStrike" }
        topSupport:
          type: array
          items: { $ref: "#/components/schemas/OiClusterStrike" }
        interpretation: { type: string, description: "Plain-English read on bias from PCR + OI flow + Max Pain" }
        bias:           { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        confidenceScore: { type: integer, description: "0-100 confidence score for the market read, based on signal alignment" }
        marketReadReasons:
          type: array
          items: { $ref: "#/components/schemas/MarketReadReason" }
          description: "Structured reasons supporting the bias call"
        invalidation: { type: string, description: "Condition that would invalidate the current bias" }
        marketStatus:   { type: string, enum: [open, closed, pre_open], description: "NSE session state at compute time. Holiday-aware on the server. Clients use this to switch poll cadence." }
        generatedAt:    { type: string, format: date-time }

    CustomStrategyRequest:
      type: object
      required: [legs]
      properties:
        expiry:
          type: string
          description: "Optional expiry override (YYYY-MM-DD). Defaults to nearest weekly/monthly."
        legs:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/CustomLegSpec" }
        scenarios:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/CustomScenarioSpec" }

    CustomLegSpec:
      type: object
      required: [strike, optionType, action, lots]
      properties:
        strike:           { type: number }
        optionType:       { type: string, enum: [CE, PE] }
        action:           { type: string, enum: [BUY, SELL] }
        lots:             { type: integer, minimum: 1 }
        premiumOverride:  { type: number, nullable: true, description: "Override mid/LTP (₹/share)" }
        ivOverride:       { type: number, nullable: true, description: "Override IV (decimal, e.g. 0.18)" }

    CustomScenarioSpec:
      type: object
      required: [spotShiftPct, ivShiftPct, daysPassed]
      properties:
        spotShiftPct: { type: number, description: "% move in spot (-50..50)" }
        ivShiftPct:   { type: number, description: "% relative shift in IV (-50..50)" }
        daysPassed:   { type: number, description: "Calendar days passed (0..30)" }

    CustomStrategyLeg:
      type: object
      required: [action, optionType, strike, premium, iv, qty, delta, gamma, vega, theta, source, quoted]
      properties:
        action:     { type: string, enum: [BUY, SELL] }
        optionType: { type: string, enum: [CE, PE] }
        strike:     { type: number }
        premium:    { type: number }
        iv:         { type: number }
        qty:        { type: integer }
        delta:      { type: number }
        gamma:      { type: number }
        vega:       { type: number }
        theta:      { type: number }
        source:     { type: string, enum: [chain, bs] }
        bid:        { type: number, nullable: true }
        ask:        { type: number, nullable: true }
        spreadPct:  { type: number, nullable: true }
        oi:         { type: number, nullable: true }
        volume:     { type: number, nullable: true }
        quoted:     { type: boolean }

    CustomStrategySnapshot:
      type: object
      required: [legs, netDebit, netGreeks, breakevens, payoff, marginRequired, lotSize, perLot, legQuality, avgLegIv, displayMaxProfit, displayMaxLoss, dist, legEdges, netEdge]
      properties:
        legs:
          type: array
          items: { $ref: "#/components/schemas/CustomStrategyLeg" }
        netDebit:    { type: number, description: "₹/share (positive=debit, negative=credit)" }
        netGreeks:
          type: object
          required: [delta, gamma, vega, theta]
          properties:
            delta: { type: number }
            gamma: { type: number }
            vega:  { type: number }
            theta: { type: number }
        maxProfit:        { type: number, nullable: true }
        maxLoss:          { type: number, nullable: true }
        breakevens:
          type: array
          items: { type: number }
        payoff:
          type: array
          items: { $ref: "#/components/schemas/PayoffPoint" }
        pop:              { type: number, nullable: true }
        rrRatio:          { type: number, nullable: true }
        displayMaxProfit: { type: number }
        displayMaxLoss:   { type: number }
        displayRrRatio:   { type: number, nullable: true }
        dist:
          type: object
          required: [expectedValue, stdDev, pop, avgWin, avgLoss, expectedMove1Sigma, expectedMove2Sigma]
          properties:
            expectedValue:      { type: number }
            stdDev:             { type: number }
            pop:                { type: number }
            avgWin:             { type: number }
            avgLoss:            { type: number }
            probabilisticRr:    { type: number, nullable: true }
            expectedMove1Sigma: { type: number }
            expectedMove2Sigma: { type: number }
        legEdges:
          type: array
          items:
            type: object
            required: [strike, type, action, mid, theoretical, edge]
            properties:
              strike:      { type: number }
              type:        { type: string, enum: [CE, PE] }
              action:      { type: string, enum: [BUY, SELL] }
              mid:         { type: number }
              theoretical: { type: number }
              edge:        { type: number }
        netEdge:         { type: number }
        marginRequired:  { type: number }
        returnOnCapital: { type: number, nullable: true }
        lotSize:         { type: integer }
        perLot:
          type: object
          required: [maxProfit, maxLoss, netDebit, displayMaxProfit, displayMaxLoss]
          properties:
            maxProfit:        { type: number, nullable: true }
            maxLoss:          { type: number, nullable: true }
            netDebit:         { type: number }
            displayMaxProfit: { type: number }
            displayMaxLoss:   { type: number }
        legQuality:  { type: string, enum: [TIGHT, WIDE, POOR] }
        avgLegIv:    { type: number }
        shortLegOi:  { type: number, nullable: true }

    CustomScenarioLegResult:
      type: object
      required: [strike, optionType, action, newPrice, mtmPerShare, mtmTotal]
      properties:
        strike:      { type: number }
        optionType:  { type: string, enum: [CE, PE] }
        action:      { type: string, enum: [BUY, SELL] }
        newPrice:    { type: number }
        mtmPerShare: { type: number }
        mtmTotal:    { type: number }

    CustomScenarioResult:
      type: object
      required: [spotShiftPct, ivShiftPct, daysPassed, newSpot, newT, totalPnl, legs]
      properties:
        spotShiftPct: { type: number }
        ivShiftPct:   { type: number }
        daysPassed:   { type: number }
        newSpot:      { type: number }
        newT:         { type: number }
        totalPnl:     { type: number }
        legs:
          type: array
          items: { $ref: "#/components/schemas/CustomScenarioLegResult" }

    CustomStrategyResponse:
      type: object
      required: [underlying, spot, expiry, daysToExpiry, lotSize, ivContext, snapshot, scenarios, warnings, generatedAt]
      properties:
        underlying:   { type: string }
        spot:         { type: number }
        expiry:       { type: string }
        daysToExpiry: { type: integer }
        lotSize:      { type: integer }
        ivContext:    { type: string, enum: [LOW, HIGH, UNKNOWN] }
        snapshot:     { $ref: "#/components/schemas/CustomStrategySnapshot" }
        scenarios:
          type: array
          items: { $ref: "#/components/schemas/CustomScenarioResult" }
        warnings:
          type: array
          items: { type: string }
        generatedAt:  { type: string, format: date-time }

    OptionStrategyLeg:
      type: object
      required: [type, action, strike, premium, qty]
      properties:
        type:    { type: string, enum: [CALL, PUT] }
        action:  { type: string, enum: [BUY, SELL] }
        strike:  { type: number }
        premium: { type: number, description: "Per-share premium (LTP)" }
        qty:     { type: integer, description: "Number of lots × lot size (positive)" }
        delta:   { type: number }
        theta:   { type: number }
        gamma:   { type: number }
        vega:    { type: number }

    PayoffPoint:
      type: object
      required: [spot, pnl]
      properties:
        spot: { type: number }
        pnl:  { type: number, description: "P/L at expiry, INR (per 1 lot)" }

    OptionStrategy:
      type: object
      required: [key, name, category, outlook, legs, payoff, breakEvens, maxProfit, maxLoss, netDebit, generatedAt]
      properties:
        key:        { type: string, description: "Stable identifier e.g. LONG_STRADDLE" }
        name:       { type: string }
        category:   { type: string, enum: [DIRECTIONAL_BULL, DIRECTIONAL_BEAR, NEUTRAL_VOL, INCOME, HEDGE] }
        outlook:    { type: string, description: "Market view this strategy expresses" }
        whenToUse:  { type: string }
        legs:
          type: array
          items: { $ref: "#/components/schemas/OptionStrategyLeg" }
        payoff:
          type: array
          items: { $ref: "#/components/schemas/PayoffPoint" }
        breakEvens:
          type: array
          items: { type: number }
        maxProfit:    { type: number, description: "INR per lot; null = unlimited" , nullable: true }
        maxLoss:      { type: number, description: "INR per lot; null = unlimited" , nullable: true }
        netDebit:     { type: number, description: "Cost per lot (positive = debit, negative = credit)" }
        netDelta:     { type: number }
        netTheta:     { type: number }
        netGamma:     { type: number }
        netVega:      { type: number }
        rrRatio:      { type: number, nullable: true }
        recommendation: { type: string, description: "Why this strategy fits the current view (1-line)" }
        generatedAt:  { type: string, format: date-time }

    OptionStrategiesResponse:
      type: object
      required: [underlying, spot, expiry, lotSize, strategies, generatedAt]
      properties:
        underlying:  { type: string }
        spot:        { type: number }
        expiry:      { type: string }
        lotSize:     { type: integer }
        atmIv:       { type: number, nullable: true }
        bias:        { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        strategies:
          type: array
          items: { $ref: "#/components/schemas/OptionStrategy" }
        generatedAt: { type: string, format: date-time }

    PaperComboLegSpec:
      type: object
      required: [strike, optionType, action, lots]
      description: "Combo leg INPUT. Server explicitly ignores any premium/iv/Greeks fields — paper combos are always priced from the live chain."
      properties:
        strike:     { type: number }
        optionType: { type: string, enum: [CE, PE] }
        action:     { type: string, enum: [BUY, SELL] }
        lots:       { type: integer, minimum: 1, maximum: 1000 }

    PaperComboOpenRequest:
      type: object
      required: [underlying, legs]
      properties:
        underlying:   { type: string, description: "e.g. NIFTY, BANKNIFTY, SENSEX, RELIANCE" }
        expiry:       { type: string, description: "Optional YYYY-MM-DD; defaults to nearest available." }
        strategyName: { type: string, nullable: true, description: "Optional human label, e.g. 'Bull Call Spread'." }
        journal:      { type: string, nullable: true }
        legs:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/PaperComboLegSpec" }

    PaperComboCloseRequest:
      type: object
      properties:
        journal: { type: string, nullable: true }

    PaperComboLeg:
      type: object
      required: [id, legIndex, action, optionType, strike, qty, lots, entryPremium, entrySource]
      properties:
        id:           { type: string }
        legIndex:     { type: integer }
        action:       { type: string, enum: [BUY, SELL] }
        optionType:   { type: string, enum: [CE, PE] }
        strike:       { type: number }
        qty:          { type: integer, description: "Total shares = lots × lotSize." }
        lots:         { type: integer }
        entryPremium: { type: number, description: "Per-share premium (server-priced at open)." }
        ivAtEntry:    { type: number, nullable: true }
        entrySource:  { type: string, enum: [chain, bs] }
        lastPremium:  { type: number, nullable: true }
        lastSource:   { type: string, enum: [chain, bs, ws], nullable: true }
        exitPremium:  { type: number, nullable: true }
        unrealizedPnl: { type: number, nullable: true }

    PaperCombo:
      type: object
      required:
        - id
        - underlying
        - expiry
        - status
        - openedAt
        - lotSize
        - spotAtEntry
        - netDebitEntry
        - breakevensEntry
        - netGreeksEntry
        - marginRequired
        - capitalDeployed
        - daysToExpiry
        - legs
      properties:
        id:              { type: string }
        underlying:      { type: string }
        expiry:          { type: string, description: "YYYY-MM-DD" }
        strategyName:    { type: string, nullable: true }
        status:          { type: string, enum: [OPEN, CLOSED] }
        openedAt:        { type: string, format: date-time }
        closedAt:        { type: string, format: date-time, nullable: true }
        closeReason:     { type: string, nullable: true, enum: [MANUAL, EXPIRY, null] }
        lotSize:         { type: integer }
        spotAtEntry:     { type: number }
        spotLast:        { type: number, nullable: true }
        netDebitEntry:   { type: number, description: "₹/share at open (positive=debit, negative=credit)." }
        maxProfitEntry:  { type: number, nullable: true, description: "Per-lot ₹ at open. NULL = unbounded (rejected on open)." }
        maxLossEntry:    { type: number, nullable: true, description: "Per-lot ₹ at open. NULL = unbounded." }
        breakevensEntry:
          type: array
          items: { type: number }
        netGreeksEntry:
          type: object
          required: [delta, gamma, vega, theta]
          properties:
            delta: { type: number }
            gamma: { type: number }
            vega:  { type: number }
            theta: { type: number }
        marginRequired:  { type: number, description: "Server estimate at open (₹)." }
        capitalDeployed: { type: number, description: "max(netDebit×qty, marginRequired) in ₹." }
        netMtm:          { type: number, nullable: true, description: "Live mark, ₹. NULL until first MTM." }
        realizedPnl:     { type: number, nullable: true }
        lastEvaluatedAt: { type: string, format: date-time, nullable: true }
        journal:         { type: string, nullable: true }
        daysToExpiry:    { type: integer }
        legs:
          type: array
          items: { $ref: "#/components/schemas/PaperComboLeg" }

    PaperComboResponse:
      type: object
      required: [combo]
      properties:
        combo: { $ref: "#/components/schemas/PaperCombo" }

    PaperComboListResponse:
      type: object
      required: [combos]
      properties:
        combos:
          type: array
          items: { $ref: "#/components/schemas/PaperCombo" }

    PaperAccountState:
      type: object
      required:
        - segment
        - seedCapital
        - balance
        - dayRealizedPnl
        - dayOpenCount
        - dayTradeCount
        - lastResetDate
        - dailyTradeCap
        - maxLossPctPerTrade
      properties:
        segment:           { type: string, enum: [FNO, EQUITY] }
        seedCapital:       { type: number, description: "Starting / refill capital in INR." }
        balance:           { type: number, description: "Live cash balance after debits/credits." }
        dayRealizedPnl:    { type: number, description: "Realized P&L (INR) accumulated since last daily reset." }
        lifetimeRealizedPnl: { type: number, description: "Sum of realizedPnl across ALL closed paper trades for this segment. Top-up safe (does not include manual cash injections)." }
        dayOpenCount:      { type: integer, description: "Number of trades currently OPEN today." }
        dayTradeCount:     { type: integer, description: "Number of trades opened so far today (cap counter)." }
        lastResetDate:     { type: string, description: "IST date YYYY-MM-DD of the last daily reset." }
        dailyTradeCap:     { type: integer, description: "Hard cap on opens/day for this segment." }
        maxLossPctPerTrade: { type: number, description: "Max % of balance risked per trade (e.g. 0.02 = 2%)." }
        dailyDrawdownPct:  { type: number, description: "Phase-1 realised loss today as fraction of seed (0-1). FNO only." }
        dailyDrawdownCapPct: { type: number, description: "Configured daily DD cap fraction (0-1). New entries blocked at/above this." }
        weeklyDrawdownPct: { type: number, description: "Phase-1 realised loss for IST week-to-date as fraction of seed (0-1). FNO only." }
        weeklyDrawdownCapPct: { type: number, description: "Configured weekly DD cap fraction (0-1)." }

    FnoSpotLifecycle:
      type: object
      description: >-
        READ-ONLY spot-underlying lifecycle for an F&O paper trade, joined from
        option_signal_history by the 4-tuple (signalDate, indexSymbol, setupKey,
        direction). Reporting-only: it NEVER feeds any entry, exit, target, stop,
        or sizing decision. Every field is nullable — null when the signal row is
        absent or the column was not recorded.
      properties:
        status:                   { type: string, nullable: true, description: "Signal lifecycle status (PENDING/TRIGGERED/EXITED/...)." }
        spotEntry:                { type: number, nullable: true, description: "Spot underlying level at signal entry." }
        spotStop:                 { type: number, nullable: true, description: "Spot stop level." }
        spotTarget1:              { type: number, nullable: true, description: "Spot target-1 level." }
        spotTarget2:              { type: number, nullable: true, description: "Spot target-2 level." }
        lastSpot:                 { type: number, nullable: true, description: "Most recent observed spot underlying level." }
        maxFavorableExcursionPts: { type: number, nullable: true, description: "Max favourable spot excursion, in index points." }

    PaperTradeFOPosition:
      type: object
      required:
        - id
        - signalDate
        - indexSymbol
        - indexName
        - setupKey
        - direction
        - optionType
        - strike
        - lots
        - lotSize
        - entryPremium
        - stopPremium
        - target1Premium
        - target2Premium
        - capitalDeployed
        - lastPremium
        - unrealizedPnl
        - openedAt
        - lastEvaluatedAt
        - status
      properties:
        id:              { type: string }
        signalDate:      { type: string }
        indexSymbol:     { type: string }
        indexName:       { type: string }
        setupKey:        { type: string }
        direction:       { type: string, enum: [BULLISH, BEARISH] }
        optionType:      { type: string, enum: [CALL, PUT] }
        strike:          { type: number }
        lots:            { type: integer }
        lotSize:         { type: integer }
        entryPremium:    { type: number }
        stopPremium:     { type: number }
        target1Premium:  { type: number }
        target2Premium:  { type: number }
        capitalDeployed: { type: number, description: "INR cost (lots × lotSize × entryPremium)." }
        lastPremium:     { type: number, description: "Most recent observed option premium for MTM." }
        unrealizedPnl:   { type: number, description: "(lastPremium − entryPremium) × lots × lotSize." }
        maxRunup:        { type: number, description: "Highest unrealized P&L observed for this position." }
        maxDrawdown:     { type: number, description: "Lowest unrealized P&L observed for this position (≤ 0)." }
        openedAt:        { type: string, format: date-time }
        lastEvaluatedAt: { type: string, format: date-time }
        status:          { type: string, enum: [OPEN] }
        spotLifecycle:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/FnoSpotLifecycle"

    PaperTradeFOClosed:
      type: object
      required:
        - id
        - signalDate
        - indexSymbol
        - indexName
        - setupKey
        - direction
        - optionType
        - strike
        - lots
        - lotSize
        - entryPremium
        - exitPremium
        - capitalDeployed
        - realizedPnl
        - exitReason
        - openedAt
        - exitedAt
      properties:
        id:              { type: string }
        signalDate:      { type: string }
        indexSymbol:     { type: string }
        indexName:       { type: string }
        setupKey:        { type: string }
        direction:       { type: string, enum: [BULLISH, BEARISH] }
        optionType:      { type: string, enum: [CALL, PUT] }
        strike:          { type: number }
        lots:            { type: integer }
        lotSize:         { type: integer }
        entryPremium:    { type: number }
        exitPremium:     { type: number }
        capitalDeployed: { type: number }
        realizedPnl:     { type: number }
        exitReason:      { type: string, enum: [TARGET1_HIT, TARGET2_HIT, STOPPED, EXPIRED, MANUAL_OVERRIDE, TIME_EXIT_1520] }
        openedAt:        { type: string, format: date-time }
        exitedAt:        { type: string, format: date-time }
        journal:         { type: string, nullable: true }
        tags:
          type: array
          nullable: true
          items: { type: string }
        stopPremium:     { type: number, nullable: true, description: "Read-only: option-premium stop locked at entry." }
        target1Premium:  { type: number, nullable: true, description: "Read-only: option-premium target 1 locked at entry." }
        target2Premium:  { type: number, nullable: true, description: "Read-only: option-premium target 2 locked at entry." }
        maxRunup:        { type: number, nullable: true, description: "Read-only: highest unrealized P&L observed for this position (peak)." }
        maxDrawdown:     { type: number, nullable: true, description: "Read-only: lowest unrealized P&L observed for this position (≤ 0)." }
        spotLifecycle:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/FnoSpotLifecycle"

    PaperPositionsFOResponse:
      type: object
      required: [positions, generatedAt]
      properties:
        positions:
          type: array
          items: { $ref: "#/components/schemas/PaperTradeFOPosition" }
        generatedAt: { type: string, format: date-time }

    PaperTradesFOResponse:
      type: object
      required: [date, trades, generatedAt]
      properties:
        date:        { type: string, description: "IST trading date YYYY-MM-DD" }
        trades:
          type: array
          items: { $ref: "#/components/schemas/PaperTradeFOClosed" }
        generatedAt: { type: string, format: date-time }

    PaperReportTotals:
      type: object
      required:
        - realizedPnl
        - netPnl
        - charges
        - tradeCount
        - wins
        - losses
        - winRatePct
        - avgWin
        - avgLoss
        - bestTrade
        - worstTrade
        - avgRMultiple
        - profitFactor
        - expectancy
      properties:
        realizedPnl:    { type: number, description: "Sum of gross realized P&L across all trades in the window" }
        netPnl:         { type: number, description: "realizedPnl minus estimated taxes & charges" }
        charges:        { type: number, description: "Estimated taxes & charges using the standard NSE F&O option fee schedule" }
        tradeCount:     { type: integer }
        wins:           { type: integer, description: "Trades with positive net P&L" }
        losses:         { type: integer, description: "Trades with negative net P&L" }
        winRatePct:     { type: number }
        avgWin:         { type: number }
        avgLoss:        { type: number }
        bestTrade:      { type: number }
        worstTrade:     { type: number }
        avgRMultiple:   { type: number, description: "Average achieved R multiple across all trades" }
        profitFactor:   { type: number, description: "Sum of winning net P&L divided by absolute sum of losing net P&L" }
        expectancy:     { type: number, description: "Per-trade expected value = (winRate × avgWin) - (lossRate × avgLoss)" }

    PaperReportDayBucket:
      type: object
      required: [date, realizedPnl, netPnl, charges, tradeCount, wins, losses]
      properties:
        date:        { type: string, description: "IST date YYYY-MM-DD" }
        realizedPnl: { type: number }
        netPnl:      { type: number }
        charges:     { type: number }
        tradeCount:  { type: integer }
        wins:        { type: integer }
        losses:      { type: integer }

    PaperReportMonthBucket:
      type: object
      required: [month, realizedPnl, netPnl, charges, tradeCount, wins, losses]
      properties:
        month:       { type: string, description: "IST calendar month YYYY-MM" }
        realizedPnl: { type: number }
        netPnl:      { type: number }
        charges:     { type: number }
        tradeCount:  { type: integer }
        wins:        { type: integer }
        losses:      { type: integer }

    PaperTradeFODetail:
      type: object
      required:
        - id
        - signalDate
        - exitedAt
        - indexSymbol
        - indexName
        - setupKey
        - direction
        - optionType
        - strike
        - lots
        - lotSize
        - entryPremium
        - exitPremium
        - stopPremium
        - target1Premium
        - target2Premium
        - capitalDeployed
        - realizedPnl
        - charges
        - netPnl
        - plannedRiskPerShare
        - achievedPerShare
        - rMultiple
        - exitReason
        - durationSec
      properties:
        id:                  { type: string }
        signalDate:          { type: string }
        exitedAt:            { type: string, format: date-time }
        indexSymbol:         { type: string }
        indexName:           { type: string }
        setupKey:            { type: string }
        direction:           { type: string, enum: [BULLISH, BEARISH] }
        optionType:          { type: string, enum: [CALL, PUT] }
        strike:              { type: number }
        lots:                { type: integer }
        lotSize:             { type: integer }
        entryPremium:        { type: number }
        exitPremium:         { type: number }
        stopPremium:         { type: number }
        target1Premium:      { type: number }
        target2Premium:      { type: number }
        capitalDeployed:     { type: number }
        realizedPnl:         { type: number }
        charges:             { type: number }
        netPnl:              { type: number }
        plannedRiskPerShare: { type: number }
        achievedPerShare:    { type: number }
        rMultiple:           { type: number, description: "Achieved R = (exit-entry) / |entry-stop| per share" }
        exitReason:          { type: string, enum: [TARGET1_HIT, TARGET2_HIT, STOPPED, EXPIRED, MANUAL_OVERRIDE, TIME_EXIT_1520] }
        durationSec:         { type: integer }
        journal:             { type: string, nullable: true }
        tags:
          type: array
          nullable: true
          items: { type: string }
        maxRunup:            { type: number, nullable: true, description: "Read-only: highest unrealized P&L observed (peak)." }
        maxDrawdown:         { type: number, nullable: true, description: "Read-only: lowest unrealized P&L observed (≤ 0)." }
        spotLifecycle:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/FnoSpotLifecycle"

    PaperReportFoMonthly:
      type: object
      required: [month, from, to, totals, days, trades, generatedAt]
      properties:
        month:       { type: string, description: "IST calendar month YYYY-MM" }
        from:        { type: string }
        to:          { type: string }
        totals:      { $ref: "#/components/schemas/PaperReportTotals" }
        days:
          type: array
          items: { $ref: "#/components/schemas/PaperReportDayBucket" }
        trades:
          type: array
          items: { $ref: "#/components/schemas/PaperTradeFODetail" }
        generatedAt: { type: string, format: date-time }

    PaperReportFoYearly:
      type: object
      required: [fy, from, to, totals, months, generatedAt]
      properties:
        fy:          { type: string, description: "Indian FY YYYY-YYYY (April through March)" }
        from:        { type: string }
        to:          { type: string }
        totals:      { $ref: "#/components/schemas/PaperReportTotals" }
        months:
          type: array
          items: { $ref: "#/components/schemas/PaperReportMonthBucket" }
        generatedAt: { type: string, format: date-time }

    PaperTradeEqPosition:
      type: object
      required:
        - id
        - symbol
        - name
        - exchange
        - signalDate
        - signalTriggeredAt
        - qty
        - entryPrice
        - stopPrice
        - target1Price
        - target2Price
        - trailedToT1
        - capitalDeployed
        - lastPrice
        - unrealizedPnl
        - openedAt
        - lastEvaluatedAt
        - status
      properties:
        id:                { type: string }
        symbol:            { type: string }
        name:              { type: string }
        exchange:          { type: string }
        signalDate:        { type: string }
        signalTriggeredAt: { type: string, format: date-time }
        qty:               { type: integer }
        entryPrice:        { type: number }
        stopPrice:         { type: number, description: "Live stop — may have been trailed up to T1." }
        target1Price:      { type: number }
        target2Price:      { type: number }
        trailedToT1:       { type: boolean, description: "True once price touched T1 and the stop was trailed up." }
        capitalDeployed:   { type: number, description: "INR cost (qty × entryPrice)." }
        lastPrice:         { type: number, description: "Most recent observed LTP for MTM." }
        prevClose:         { type: number, description: "Previous trading day close price from scanner cache." }
        unrealizedPnl:     { type: number, description: "(lastPrice − entryPrice) × qty." }
        unrealizedPnlPct:  { type: number, description: "Unrealised P&L as % of capital deployed." }
        dayPnl:            { type: number, description: "(lastPrice − prevClose) × qty. Day's P&L." }
        dayPnlPct:         { type: number, description: "((lastPrice − prevClose) / prevClose) × 100." }
        maxRunup:          { type: number, description: "Highest unrealized P&L observed for this position." }
        maxDrawdown:       { type: number, description: "Lowest unrealized P&L observed for this position (≤ 0)." }
        openedAt:          { type: string, format: date-time }
        lastEvaluatedAt:   { type: string, format: date-time }
        status:            { type: string, enum: [OPEN] }

    PaperTradeEqClosed:
      type: object
      required:
        - id
        - symbol
        - name
        - exchange
        - signalDate
        - qty
        - entryPrice
        - exitPrice
        - capitalDeployed
        - realizedPnl
        - exitReason
        - openedAt
        - exitedAt
      properties:
        id:              { type: string }
        symbol:          { type: string }
        name:            { type: string }
        exchange:        { type: string }
        signalDate:      { type: string }
        qty:             { type: integer }
        entryPrice:      { type: number }
        exitPrice:       { type: number }
        capitalDeployed: { type: number }
        realizedPnl:     { type: number }
        exitReason:      { type: string, enum: [TARGET2_HIT, STOPPED, TRAIL_STOP_HIT, TIME_STOP, SIGNAL_FLIP, MANUAL_OVERRIDE] }
        openedAt:        { type: string, format: date-time }
        exitedAt:        { type: string, format: date-time }
        journal:         { type: string, nullable: true }
        tags:
          type: array
          nullable: true
          items: { type: string }

    PaperPositionsEqResponse:
      type: object
      required: [positions, generatedAt]
      properties:
        positions:
          type: array
          items: { $ref: "#/components/schemas/PaperTradeEqPosition" }
        generatedAt: { type: string, format: date-time }

    PaperTradesEqResponse:
      type: object
      required: [date, trades, generatedAt]
      properties:
        date:        { type: string, description: "IST trading date YYYY-MM-DD (bucketed by exitedAt)" }
        trades:
          type: array
          items: { $ref: "#/components/schemas/PaperTradeEqClosed" }
        generatedAt: { type: string, format: date-time }

    PaperTradeEqDetail:
      type: object
      required:
        - id
        - signalDate
        - exitedAt
        - symbol
        - name
        - exchange
        - qty
        - entryPrice
        - exitPrice
        - stopPrice
        - target1Price
        - target2Price
        - capitalDeployed
        - realizedPnl
        - charges
        - netPnl
        - plannedRiskPerShare
        - achievedPerShare
        - rMultiple
        - exitReason
        - daysHeld
        - trailedToT1
      properties:
        id:                  { type: string }
        signalDate:          { type: string }
        exitedAt:            { type: string, format: date-time }
        symbol:              { type: string }
        name:                { type: string }
        exchange:            { type: string }
        qty:                 { type: integer }
        entryPrice:          { type: number }
        exitPrice:           { type: number }
        stopPrice:           { type: number }
        target1Price:        { type: number }
        target2Price:        { type: number }
        capitalDeployed:     { type: number }
        realizedPnl:         { type: number }
        charges:             { type: number, description: "NSE delivery charges (STT + txn + SEBI + GST + stamp + DP)" }
        netPnl:              { type: number }
        plannedRiskPerShare: { type: number }
        achievedPerShare:    { type: number }
        rMultiple:           { type: number, description: "Achieved R = (exit-entry) / |entry-stop| per share" }
        exitReason:          { type: string, enum: [TARGET2_HIT, STOPPED, TRAIL_STOP_HIT, TIME_STOP, SIGNAL_FLIP, MANUAL_OVERRIDE] }
        daysHeld:            { type: integer, description: "Calendar days the trade was held (rounded)." }
        trailedToT1:         { type: boolean, description: "True if the stop had been trailed to T1 before the exit." }
        journal:             { type: string, nullable: true }
        tags:
          type: array
          nullable: true
          items: { type: string }

    PaperReportEqMonthly:
      type: object
      required: [month, from, to, totals, days, trades, generatedAt]
      properties:
        month:       { type: string, description: "IST calendar month YYYY-MM" }
        from:        { type: string }
        to:          { type: string }
        totals:      { $ref: "#/components/schemas/PaperReportTotals" }
        days:
          type: array
          items: { $ref: "#/components/schemas/PaperReportDayBucket" }
        trades:
          type: array
          items: { $ref: "#/components/schemas/PaperTradeEqDetail" }
        generatedAt: { type: string, format: date-time }

    PaperReportEqYearly:
      type: object
      required: [fy, from, to, totals, months, generatedAt]
      properties:
        fy:          { type: string, description: "Indian FY YYYY-YYYY (April through March)" }
        from:        { type: string }
        to:          { type: string }
        totals:      { $ref: "#/components/schemas/PaperReportTotals" }
        months:
          type: array
          items: { $ref: "#/components/schemas/PaperReportMonthBucket" }
        generatedAt: { type: string, format: date-time }

    # ----- Global Multi-Asset Scanner schemas (Phase 1) -----

    GlobalAuthStatus:
      type: object
      required: [authenticated, passwordConfigured]
      properties:
        authenticated: { type: boolean }
        passwordConfigured: { type: boolean }

    GlobalLoginBody:
      type: object
      required: [password]
      properties:
        password: { type: string }

    GlobalLoginResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }

    GlobalLogoutResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    GlobalAssetClass:
      type: string
      enum: [crypto, commodity, forex, equity, index]

    GlobalDataSource:
      type: string
      enum: [binance, yahoo, yahoo-fx, yahoo-equity, yahoo-index]
      description: Where the row's quote/candles come from. Tagged on every persisted row.

    GlobalTimeframe:
      type: string
      enum: ["1m", "5m", "15m", "1h", "4h", "1d"]

    GlobalInstrument:
      type: object
      required: [symbol, displayName, assetClass, source, sourceSymbol, supportedTimeframes]
      properties:
        symbol: { type: string, description: "Canonical scanner symbol e.g. BTCUSDT, GOLD, EURUSD" }
        displayName: { type: string }
        assetClass: { $ref: "#/components/schemas/GlobalAssetClass" }
        source: { $ref: "#/components/schemas/GlobalDataSource" }
        sourceSymbol: { type: string, description: "Symbol as used at the data source (e.g. GC=F, EURUSD=X)" }
        currency: { type: string, description: "Quote currency / unit" }
        supportedTimeframes:
          type: array
          items: { $ref: "#/components/schemas/GlobalTimeframe" }
          description: Only timeframes the data source can actually back with real OHLCV.
        notes: { type: string, description: "Provider caveats e.g. 'Yahoo intraday FX is delayed/snapshot'" }

    GlobalDashboardRow:
      type: object
      required: [symbol, displayName, assetClass, source, stale]
      properties:
        symbol: { type: string }
        displayName: { type: string }
        assetClass: { $ref: "#/components/schemas/GlobalAssetClass" }
        source: { $ref: "#/components/schemas/GlobalDataSource" }
        currency: { type: ["string", "null"] }
        price: { type: ["number", "null"] }
        prevClose: { type: ["number", "null"] }
        changeAbs: { type: ["number", "null"] }
        changePct: { type: ["number", "null"] }
        dayHigh: { type: ["number", "null"] }
        dayLow: { type: ["number", "null"] }
        volume: { type: ["number", "null"] }
        updatedAt: { type: ["string", "null"], format: date-time }
        ageMs:
          type: ["integer", "null"]
          description: "Milliseconds since updatedAt; null if never updated."
        stale:
          type: boolean
          description: |
            True when this row's last successful update is older than the
            per-source freshness budget OR when the upstream source is
            currently failing (sourceHealthy=false). The UI must visibly
            mark stale rows so users never mistake a frozen value for live.
        sourceHealthy:
          type: boolean
          description: "Roll-up health of the upstream source (from /global/status)."
        lastError: { type: ["string", "null"] }
        exchange:
          type: ["string", "null"]
          description: |
            Exchange code (e.g. NYSE, LSE, XETR, TSE) for equity / index rows;
            null for crypto / commodity / FX rows that trade ~24×7. The dashboard
            uses this to render a market-session badge (Open / Closed / Pre / Post)
            and to suppress "stale" styling when the underlying market is closed.

    GlobalSourceStatus:
      type: object
      required: [source, healthy]
      properties:
        source: { $ref: "#/components/schemas/GlobalDataSource" }
        healthy: { type: boolean }
        lastOkAt: { type: ["string", "null"], format: date-time }
        lastErrorAt: { type: ["string", "null"], format: date-time }
        lastError: { type: ["string", "null"] }
        ageMs: { type: ["integer", "null"], description: "Milliseconds since lastOkAt" }
        notes: { type: ["string", "null"] }

    GlobalDashboardResponse:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/GlobalDashboardRow" }

    GlobalQuote:
      type: object
      properties:
        price: { type: ["number", "null"] }
        prevClose: { type: ["number", "null"] }
        changeAbs: { type: ["number", "null"] }
        changePct: { type: ["number", "null"] }
        dayHigh: { type: ["number", "null"] }
        dayLow: { type: ["number", "null"] }
        volume: { type: ["number", "null"] }
        updatedAt: { type: string, format: date-time }
        lastError: { type: ["string", "null"] }

    GlobalInstrumentDetail:
      type: object
      required: [instrument]
      properties:
        instrument: { $ref: "#/components/schemas/GlobalInstrument" }
        quote:
          oneOf:
            - { $ref: "#/components/schemas/GlobalQuote" }
            - { type: "null" }

    GlobalCandle:
      type: object
      required: [t, open, high, low, close]
      properties:
        t: { type: integer, format: int64, description: "Open time in ms since epoch" }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: ["number", "null"] }

    GlobalCandlesResponse:
      type: object
      required: [symbol, timeframe, source, candles]
      properties:
        symbol: { type: string }
        timeframe: { $ref: "#/components/schemas/GlobalTimeframe" }
        source: { $ref: "#/components/schemas/GlobalDataSource" }
        candles:
          type: array
          items: { $ref: "#/components/schemas/GlobalCandle" }

    GlobalIndicatorPoint:
      type: object
      required: [t]
      properties:
        t: { type: integer, format: int64 }
        v: { type: ["number", "null"] }

    GlobalIndicatorsResponse:
      type: object
      required: [symbol, timeframe, indicators]
      properties:
        symbol: { type: string }
        timeframe: { $ref: "#/components/schemas/GlobalTimeframe" }
        indicators:
          type: object
          description: "Map of indicator key (sma20, ema50, rsi14, macd, macdSignal, macdHist, bbUpper, bbMiddle, bbLower, atr14, vwap, supertrend, supertrendDir) to its time-series."
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/GlobalIndicatorPoint" }

    GlobalScreenerFilters:
      type: object
      properties:
        minChangePct:
          type: number
          description: "Minimum % change vs previous close (live snapshot)."
        maxChangePct: { type: number }
        minVolume:
          type: number
          description: "Minimum 24h / day volume (live snapshot units)."
        minRsi14: { type: number, minimum: 0, maximum: 100 }
        maxRsi14: { type: number, minimum: 0, maximum: 100 }
        breakoutLookback: { type: integer, minimum: 2, maximum: 500 }
        breakdownLookback: { type: integer, minimum: 2, maximum: 500 }
        min1dChangePct:
          type: number
          description: "Minimum % change over the trailing 1-day window, computed from candles in the chosen timeframe."
        min1wChangePct:
          type: number
          description: "Minimum % change over the trailing 1-week (5-day) window, computed from candles in the chosen timeframe."
        priceAboveSma50:
          type: boolean
          description: "Require last close > SMA(50) — classic intermediate-term trend filter."
        priceBelowSma50:
          type: boolean
          description: "Require last close < SMA(50)."
        priceAboveSma200:
          type: boolean
          description: "Require last close > SMA(200) — long-term trend filter."
        priceBelowSma200:
          type: boolean
          description: "Require last close < SMA(200)."
        trendUp:
          type: boolean
          description: "EMA20 > EMA50 > EMA200 cascade (bullish stack)."
        trendDown: { type: boolean }
        requireSupertrendUp: { type: boolean }
        requireSupertrendDown: { type: boolean }

    GlobalScreenerBody:
      type: object
      required: [assetClasses]
      properties:
        assetClasses:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/GlobalAssetClass" }
        timeframe: { $ref: "#/components/schemas/GlobalTimeframe" }
        filters: { $ref: "#/components/schemas/GlobalScreenerFilters" }
        limit: { type: integer, minimum: 1, maximum: 50 }

    GlobalScreenerTrend:
      type: string
      enum: [up, down, mixed]

    GlobalScreenerHit:
      type: object
      required: [symbol, displayName, assetClass, matched]
      properties:
        symbol: { type: string }
        displayName: { type: string }
        assetClass: { $ref: "#/components/schemas/GlobalAssetClass" }
        price: { type: ["number", "null"] }
        changePct: { type: ["number", "null"] }
        volume: { type: ["number", "null"] }
        rsi14: { type: ["number", "null"] }
        trend:
          oneOf:
            - { $ref: "#/components/schemas/GlobalScreenerTrend" }
            - { type: "null" }
        matched:
          type: array
          items: { type: string }

    GlobalScreenerResponse:
      type: object
      required: [hits, evaluatedCandidates, indicatorEvaluated]
      properties:
        hits:
          type: array
          items: { $ref: "#/components/schemas/GlobalScreenerHit" }
        evaluatedCandidates: { type: integer }
        indicatorEvaluated: { type: boolean }

    GlobalWatchlistItem:
      type: object
      required: [symbol, addedAt]
      properties:
        symbol: { type: string }
        addedAt: { type: string, format: date-time }

    GlobalWatchlistResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GlobalWatchlistItem" }

    GlobalWatchlistAddBody:
      type: object
      required: [symbol]
      properties:
        symbol: { type: string }

    GlobalWatchlistAddResponse:
      type: object
      required: [ok, symbol]
      properties:
        ok: { type: boolean }
        symbol: { type: string }

    GlobalWatchlistDeleteResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    PortfolioHolding:
      type: object
      description: "A single saved holding. Stores ONLY user-supplied figures — never any live-market or fabricated value."
      required: [id, symbol, qty, rate, sortIndex]
      properties:
        id: { type: string, format: uuid }
        symbol: { type: string }
        name: { type: string, nullable: true }
        exchange: { type: string, nullable: true }
        sector: { type: string, nullable: true }
        purchaseDate:
          type: string
          nullable: true
          description: "ISO yyyy-mm-dd (stored as text to avoid timezone shifts)."
        qty: { type: number }
        rate: { type: number }
        isin: { type: string, nullable: true }
        broker: { type: string, nullable: true }
        tag: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        dividendReceived: { type: number, nullable: true }
        realisedPnl: { type: number, nullable: true }
        sortIndex: { type: number }

    PortfolioHoldingInput:
      type: object
      required: [symbol, qty, rate]
      properties:
        symbol: { type: string }
        name: { type: string, nullable: true }
        exchange: { type: string, nullable: true }
        sector: { type: string, nullable: true }
        purchaseDate: { type: string, nullable: true }
        qty: { type: number }
        rate: { type: number }
        isin: { type: string, nullable: true }
        broker: { type: string, nullable: true }
        tag: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        dividendReceived: { type: number, nullable: true }
        realisedPnl: { type: number, nullable: true }

    PortfolioSummary:
      type: object
      required: [id, name, isDefault, holdingsCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isDefault: { type: boolean }
        holdingsCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Portfolio:
      type: object
      required: [id, name, isDefault, createdAt, updatedAt, holdings]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isDefault: { type: boolean }
        benchmark:
          type: string
          nullable: true
          description: "The user's chosen benchmark index key (e.g. NIFTY, NIFTY500). Null when none chosen. Persisted so the choice follows the user across devices."
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        holdings:
          type: array
          items: { $ref: "#/components/schemas/PortfolioHolding" }

    PortfolioListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PortfolioSummary" }

    PortfolioCreateBody:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        isDefault: { type: boolean }
        benchmark:
          type: string
          nullable: true
          description: "Optional chosen benchmark index key (e.g. NIFTY, NIFTY500) to persist with the new portfolio."
        holdings:
          type: array
          items: { $ref: "#/components/schemas/PortfolioHoldingInput" }

    PortfolioPatchBody:
      type: object
      description: "Provide `name` to rename, `isDefault: true` to make this the user's default portfolio, and/or `benchmark` to persist the chosen benchmark index."
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        isDefault: { type: boolean }
        benchmark:
          type: string
          nullable: true
          description: "Chosen benchmark index key (e.g. NIFTY, NIFTY500). Pass null to clear."

    PortfolioHoldingsReplaceBody:
      type: object
      required: [holdings]
      properties:
        holdings:
          type: array
          items: { $ref: "#/components/schemas/PortfolioHoldingInput" }

    PortfolioDeleteResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    BacktestRunRequest:
      type: object
      description: "Parameters for an F&O backtest. REAL_REPLAY reads the engine's actual captured history; DIRECTIONAL replays the reconstructable directional layer on historical spot candles with a clearly-labeled delta-proxy option P&L."
      required: [mode, instrument]
      properties:
        mode:
          type: string
          enum: [REAL_REPLAY, DIRECTIONAL]
        instrument:
          type: string
          enum: [NIFTY, BANKNIFTY, SENSEX, ALL]
        timeframe: { type: string, description: "Candle timeframe, e.g. 15m or 1D. Defaults to 15m." }
        fromDate: { type: string, nullable: true, description: "Inclusive YYYY-MM-DD. Null = earliest available." }
        toDate: { type: string, nullable: true, description: "Inclusive YYYY-MM-DD. Null = latest available." }
        startingCapital: { type: number, description: "Defaults to 1000000." }
        riskPerTradePct: { type: number, description: "Percent of capital risked per trade (DIRECTIONAL sizing). Defaults to 1." }
        backtestMode:
          type: string
          enum: [OFFICIAL_ENGINE, STRATEGY_RESEARCH, COMPARE_OFFICIAL_VS_STRATEGIES]
          description: "V2 selector. OFFICIAL_ENGINE (default) runs the existing REAL_REPLAY/DIRECTIONAL engine. STRATEGY_RESEARCH runs the generic strategy registry. COMPARE runs both for side-by-side comparison."
        strategies:
          type: array
          nullable: true
          items: { type: string }
          description: "Strategy ids for STRATEGY_RESEARCH / COMPARE runs (subset of the catalog from GET /backtest/fno/strategies)."
        filters:
          allOf: [{ $ref: "#/components/schemas/BacktestFilterConfig" }]
          nullable: true
          description: "Confirmation-filter toggles for strategy runs. Option/spread/volume filters are auto-disabled (no historical data)."
        maxTradesPerDay: { type: integer, nullable: true, description: "Cap on strategy entries per index per day. Defaults to a sane internal value." }
        includeCharges: { type: boolean, nullable: true, description: "Subtract modeled round-trip brokerage/taxes from net P&L (estimate)." }
        includeSlippage: { type: boolean, nullable: true, description: "Subtract modeled slippage from net P&L (estimate)." }
        strategyParams:
          type: object
          nullable: true
          additionalProperties:
            type: object
            additionalProperties: { type: number }
          description: "Per-strategy advanced-param overrides, keyed by strategy id (e.g. { ORB_BREAKOUT: { target2R: 3 } }). Only numeric keys present in the strategy's defaultParams are honored; everything else is ignored."

    BacktestEquityPoint:
      type: object
      required: [t, equity]
      properties:
        t: { type: string, description: "ISO timestamp of the trade exit." }
        equity: { type: number }
        drawdown: { type: number, nullable: true }

    BacktestInstrumentStat:
      type: object
      required: [instrument, trades, pnl]
      properties:
        instrument: { type: string }
        trades: { type: integer }
        pnl: { type: number }
        winRate: { type: number, nullable: true, description: "Null when no decided trades (honest — never a fake 100%)." }

    BacktestSummary:
      type: object
      description: "Computed performance summary. Win-rate / profit-factor / averages are null when undefined (zero-denominator) — never fabricated."
      required: [totalTrades, wins, losses, totalPnl]
      properties:
        totalTrades: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        breakeven: { type: integer }
        winRate: { type: number, nullable: true }
        totalPnl: { type: number }
        grossProfit: { type: number }
        grossLoss: { type: number }
        profitFactor: { type: number, nullable: true }
        avgWin: { type: number, nullable: true }
        avgLoss: { type: number, nullable: true }
        avgTradePnl: { type: number, nullable: true }
        expectancy: { type: number, nullable: true }
        maxDrawdown: { type: number }
        returnPct: { type: number, nullable: true }
        longTrades: { type: integer }
        shortTrades: { type: integer }
        bestTradePnl: { type: number, nullable: true }
        worstTradePnl: { type: number, nullable: true }
        byInstrument:
          type: array
          items: { $ref: "#/components/schemas/BacktestInstrumentStat" }
        equityCurve:
          type: array
          items: { $ref: "#/components/schemas/BacktestEquityPoint" }

    BacktestCoverageWindow:
      type: object
      required: [count]
      properties:
        from: { type: string, nullable: true }
        to: { type: string, nullable: true }
        count: { type: integer }

    BacktestDataQuality:
      type: object
      description: "Honesty panel: states exactly which inputs were real vs unavailable vs modeled for this run."
      required: [mode, optionDataAvailable, ivAvailable, oiAvailable, modeledFields, warnings]
      properties:
        mode: { type: string }
        candleCoverage:
          allOf: [{ $ref: "#/components/schemas/BacktestCoverageWindow" }]
          nullable: true
        optionDataAvailable: { type: boolean, description: "True only when real historical option premiums backed the P&L." }
        ivAvailable: { type: boolean }
        oiAvailable: { type: boolean }
        snapshotCoverage:
          allOf: [{ $ref: "#/components/schemas/BacktestSnapshotCoverage" }]
          nullable: true
        modeledFields:
          type: array
          items: { type: string }
          description: "Fields that were modeled (not real), e.g. optionEntry/optionExit via delta proxy."
        warnings:
          type: array
          items: { type: string }
        notes:
          type: array
          items: { type: string }

    BacktestRun:
      type: object
      required: [id, mode, instrument, timeframe, fromDate, toDate, startingCapital, riskPerTradePct, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        mode: { type: string }
        instrument: { type: string }
        timeframe: { type: string }
        fromDate: { type: string }
        toDate: { type: string }
        startingCapital: { type: number }
        riskPerTradePct: { type: number }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETE, FAILED] }
        summary:
          allOf: [{ $ref: "#/components/schemas/BacktestSummary" }]
          nullable: true
        dataQuality:
          allOf: [{ $ref: "#/components/schemas/BacktestDataQuality" }]
          nullable: true
        error: { type: string, nullable: true }
        backtestMode: { type: string, nullable: true, description: "V2: OFFICIAL_ENGINE | STRATEGY_RESEARCH | COMPARE_OFFICIAL_VS_STRATEGIES (null for legacy runs)." }
        selectedStrategies:
          type: array
          nullable: true
          items: { type: string }
        filters:
          allOf: [{ $ref: "#/components/schemas/BacktestFilterConfig" }]
          nullable: true
          description: "Confirmation-filter config the run was executed with (null for Official-engine runs). Lets a re-run reproduce this run's filters exactly."
        maxTradesPerDay: { type: integer, nullable: true, description: "Strategy entries-per-index-per-day cap the run was executed with (null for Official-engine runs)." }
        strategyComparison:
          allOf: [{ $ref: "#/components/schemas/BacktestStrategyComparison" }]
          nullable: true
        runKey: { type: string, nullable: true, description: "Deterministic idempotency key (sha256 of canonical inputs incl. candle data-version). Null for REAL_REPLAY (live data, never deduped) and legacy rows." }
        cached: { type: boolean, description: "True when this run was reused from an identical earlier modeled run instead of being freshly computed. Absent/false on a fresh run." }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    BacktestRunListItem:
      type: object
      required: [id, mode, instrument, timeframe, fromDate, toDate, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        mode: { type: string }
        instrument: { type: string }
        timeframe: { type: string }
        fromDate: { type: string }
        toDate: { type: string }
        status: { type: string }
        totalPnl: { type: number, nullable: true }
        totalTrades: { type: integer, nullable: true }
        filters:
          allOf: [{ $ref: "#/components/schemas/BacktestFilterConfig" }]
          nullable: true
          description: "Confirmation-filter config the run was executed with (null for Official-engine runs). Lets the runs list show how each run was configured at a glance."
        maxTradesPerDay: { type: integer, nullable: true, description: "Strategy entries-per-index-per-day cap the run was executed with (null for Official-engine runs)." }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    BacktestRunListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BacktestRunListItem" }

    BacktestTrade:
      type: object
      required: [id, indexSymbol, direction, modeled]
      properties:
        id: { type: string, format: uuid }
        indexSymbol: { type: string }
        setupKey: { type: string, nullable: true }
        setupName: { type: string, nullable: true }
        direction: { type: string }
        optionType: { type: string, nullable: true }
        strike: { type: number, nullable: true }
        entryAt: { type: string, format: date-time, nullable: true }
        exitAt: { type: string, format: date-time, nullable: true }
        entrySpot: { type: number, nullable: true }
        exitSpot: { type: number, nullable: true }
        optionEntry: { type: number, nullable: true }
        optionExit: { type: number, nullable: true }
        optionStop: { type: number, nullable: true }
        optionTarget1: { type: number, nullable: true }
        optionTarget2: { type: number, nullable: true }
        lots: { type: integer, nullable: true }
        lotSize: { type: integer, nullable: true }
        qty: { type: integer, nullable: true }
        pnl: { type: number, nullable: true }
        exitReason: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        tier: { type: string, nullable: true }
        regime: { type: string, nullable: true }
        modeled: { type: boolean, description: "True = DIRECTIONAL delta-proxy fill; False = REAL_REPLAY real fill." }
        maxFavorableExcursion: { type: number, nullable: true }
        maxAdverseExcursion: { type: number, nullable: true }
        backtestMode: { type: string, nullable: true }
        strategyId: { type: string, nullable: true }
        strategyName: { type: string, nullable: true }
        strategyCategory: { type: string, nullable: true }
        signalSource: { type: string, nullable: true, description: "STRATEGY | ENGINE." }
        strategyParams:
          type: object
          nullable: true
          additionalProperties: true
        confirmationFilters:
          type: array
          nullable: true
          items: { type: string }
        strategyConfidence: { type: number, nullable: true }
        historicalSetupMatch: { type: string, nullable: true }
        passedConditions:
          type: array
          nullable: true
          items: { type: string }
        failedConditions:
          type: array
          nullable: true
          items: { type: string }

    BacktestTradesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BacktestTrade" }

    BacktestBlockedSetup:
      type: object
      required: [id, indexSymbol, count]
      properties:
        id: { type: string, format: uuid }
        indexSymbol: { type: string }
        setupKey: { type: string, nullable: true }
        direction: { type: string, nullable: true }
        decision: { type: string, nullable: true }
        reasonCode: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        confluenceScore: { type: number, nullable: true }
        regime: { type: string, nullable: true }
        count: { type: integer }
        note: { type: string, nullable: true }
        strategyId: { type: string, nullable: true }
        strategyName: { type: string, nullable: true }
        signalSource: { type: string, nullable: true }
        failedCondition: { type: string, nullable: true }
        blockedRule: { type: string, nullable: true }
        category: { type: string, nullable: true, description: "FILTER | RISK | DATA." }

    BacktestBlockedResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BacktestBlockedSetup" }

    BacktestSnapshotCoverage:
      type: object
      description: "Mode D — how much real option-chain snapshot history has accumulated for a future faithful 2yr replay."
      required: [count, underlyings]
      properties:
        earliest: { type: string, format: date-time, nullable: true }
        latest: { type: string, format: date-time, nullable: true }
        count: { type: integer }
        underlyings:
          type: array
          items: { type: string }

    BacktestDeleteResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    BacktestFilterConfig:
      type: object
      description: "Confirmation-filter toggles. Option/spread/volume filters are auto-disabled in the backtest (no historical option data) and reported as such — never silently applied."
      properties:
        vwapFilter: { type: boolean }
        emaTrendFilter: { type: boolean }
        optionChainConfirmation: { type: boolean, description: "Auto-disabled — no historical option-chain data." }
        avoidChopZone: { type: boolean }
        avoidLast15Minutes: { type: boolean }
        avoidWideSpread: { type: boolean, description: "Auto-disabled — no historical option spread data." }
        avoidLowVolume: { type: boolean, description: "Auto-disabled — no historical option volume data." }
        minimumRiskReward: { type: number, description: "Minimum reward:risk multiple; <= 0 disables the filter." }

    BacktestStrategyMeta:
      type: object
      required: [id, name, category, bestCondition, suitableIndices, recommendedTimeframes, riskLevel, description, ignoredFilters, ignoredFiltersRationale, defaultParams]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        bestCondition: { type: string }
        suitableIndices:
          type: array
          items: { type: string }
        recommendedTimeframes:
          type: array
          items: { type: string }
        riskLevel: { type: string }
        description: { type: string }
        ignoredFilters:
          type: array
          items: { type: string }
          description: "Confirmation filters this strategy ignores by design."
        ignoredFiltersRationale:
          type: string
          description: "Short human-readable rationale for why this strategy ignores the filters above; empty string when it ignores nothing."
        defaultParams:
          type: object
          additionalProperties: { type: number }

    BacktestStrategiesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BacktestStrategyMeta" }

    BacktestComparisonRow:
      type: object
      description: "One row of the comparison table — per (strategy × index). P&L is GROSS in grossPnl; netPnl subtracts modeled charges + slippage when requested."
      required: [strategyId, strategyName, indexSymbol, timeframe, ignoredFilters, totalTrades, winningTrades, losingTrades, grossPnl, charges, slippage, netPnl, maxDrawdown, target1HitCount, target2HitCount, slHitCount, timeExitCount, rejectedSetupCount, dataBlockedCount, riskBlockedCount]
      properties:
        strategyId: { type: string }
        strategyName: { type: string }
        indexSymbol: { type: string }
        timeframe: { type: string }
        ignoredFilters:
          type: array
          items: { type: string }
          description: "Confirmation filters this strategy ignores by design (subset of the run's filters); empty for official-engine rows."
        totalTrades: { type: integer }
        winningTrades: { type: integer }
        losingTrades: { type: integer }
        winRate: { type: number, nullable: true }
        grossPnl: { type: number }
        charges: { type: number }
        slippage: { type: number }
        netPnl: { type: number }
        profitFactor: { type: number, nullable: true }
        avgR: { type: number, nullable: true }
        maxDrawdown: { type: number }
        bestTrade: { type: number, nullable: true }
        worstTrade: { type: number, nullable: true }
        avgHoldingMinutes: { type: number, nullable: true }
        target1HitCount: { type: integer }
        target2HitCount: { type: integer }
        slHitCount: { type: integer }
        timeExitCount: { type: integer }
        rejectedSetupCount: { type: integer }
        dataBlockedCount: { type: integer }
        riskBlockedCount: { type: integer }

    BacktestStrategyAggregate:
      type: object
      description: "Per-strategy aggregate across all selected indices. compositeScore is a multi-factor 0–100 score, null when the strategy has too few trades to rank."
      required: [strategyId, strategyName, ignoredFilters, totalTrades, netPnl, maxDrawdown, eligible]
      properties:
        strategyId: { type: string }
        strategyName: { type: string }
        ignoredFilters:
          type: array
          items: { type: string }
          description: "Confirmation filters this strategy ignores by design (subset of the run's filters); empty for official-engine rows."
        totalTrades: { type: integer }
        winRate: { type: number, nullable: true }
        netPnl: { type: number }
        profitFactor: { type: number, nullable: true }
        maxDrawdown: { type: number }
        avgR: { type: number, nullable: true }
        consistency: { type: number, nullable: true, description: "Mean per-trade net ÷ stdev of per-trade net (higher = steadier). Null when fewer than 2 trades." }
        dataQuality: { type: number, nullable: true, description: "Executed ÷ (executed + data-blocked) opportunities — how much edge survived missing-data bars. Null when no opportunities." }
        compositeScore: { type: number, nullable: true }
        eligible: { type: boolean }

    BacktestRankingCard:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
        strategyId: { type: string, nullable: true }
        strategyName: { type: string, nullable: true }
        value: { type: string, nullable: true }
        note: { type: string, nullable: true }

    BacktestStrategyComparison:
      type: object
      required: [rows, byStrategy, ranking, notes]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/BacktestComparisonRow" }
        byStrategy:
          type: array
          items: { $ref: "#/components/schemas/BacktestStrategyAggregate" }
        ranking:
          type: array
          items: { $ref: "#/components/schemas/BacktestRankingCard" }
        notes:
          type: array
          items: { type: string }

    GlobalDeadCandidate:
      type: object
      required: [symbol, displayName, assetClass, source, failureStreak]
      description: "An instrument that has failed >= threshold consecutive refresh cycles — likely delisted upstream and a candidate for pruning from `universe.ts`."
      properties:
        symbol: { type: string }
        displayName: { type: string }
        assetClass: { $ref: "#/components/schemas/GlobalAssetClass" }
        source: { $ref: "#/components/schemas/GlobalDataSource" }
        failureStreak:
          type: integer
          description: "Consecutive refresh cycles where the per-symbol fetch failed (reset on the next successful refresh)."
        lastFailureAt: { type: ["string", "null"], format: date-time }
        lastError: { type: ["string", "null"] }

    GlobalSourceStatusResponse:
      type: object
      required: [sources, universeCounts, deadCandidates, deadCandidateThreshold, disabledInstruments]
      properties:
        sources:
          type: array
          items: { $ref: "#/components/schemas/GlobalSourceStatus" }
        universeCounts:
          type: object
          additionalProperties: { type: integer }
          description: "Counts of instruments per asset class (crypto, commodity, forex, equity, index)"
        deadCandidates:
          type: array
          description: "Instruments whose per-symbol failure streak has crossed `deadCandidateThreshold`. Sorted worst-first."
          items: { $ref: "#/components/schemas/GlobalDeadCandidate" }
        deadCandidateThreshold:
          type: integer
          description: "Number of consecutive failed refresh cycles after which a symbol is flagged as a dead candidate."
        disabledInstruments:
          type: array
          description: "Instruments operators have muted via POST /global/instruments/{symbol}/disabled. Refreshers skip these and the dashboard hides them. Surfaced here so the StatusStrip popover can show a re-enable action."
          items: { $ref: "#/components/schemas/GlobalInstrumentOverride" }

    GlobalInstrumentOverride:
      type: object
      required: [symbol, disabled, updatedAt]
      description: "Operator-controlled runtime override for a universe instrument. Currently only `disabled` is supported."
      properties:
        symbol: { type: string }
        disabled: { type: boolean }
        disabledAt: { type: ["string", "null"], format: date-time }
        note: { type: ["string", "null"] }
        updatedAt: { type: string, format: date-time }

    GlobalInstrumentDisableBody:
      type: object
      description: "Optional body for muting an instrument. `note` is shown to other operators in the disabled list."
      properties:
        note:
          type: string
          maxLength: 500

    GlobalDisabledInstrumentsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GlobalInstrumentOverride" }

    GlobalScreenerPresetNewHit:
      type: object
      required: [symbol, displayName, assetClass, price, changePct, matched]
      properties:
        symbol: { type: string }
        displayName: { type: string }
        assetClass: { type: string }
        price:
          type: number
          nullable: true
        changePct:
          type: number
          nullable: true
        matched:
          type: array
          items: { type: string }

    GlobalScreenerPreset:
      type: object
      required:
        [id, name, body, createdAt, updatedAt, autoRunIntervalMin,
         lastRunAt, lastRunError, lastNewHits, lastNewHitsAt, shareToken]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        body: { $ref: "#/components/schemas/GlobalScreenerBody" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        autoRunIntervalMin:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1440
          description: "When set, the preset auto-runs every N minutes server-side and any new hits become alerts."
        lastRunAt:
          type: string
          format: date-time
          nullable: true
          description: "Timestamp of the most recent scheduled run, or null if it has never run."
        lastRunError:
          type: string
          nullable: true
        lastNewHits:
          type: array
          description: "Pending alert hits accumulated since the last `acknowledge`."
          items: { $ref: "#/components/schemas/GlobalScreenerPresetNewHit" }
        lastNewHitsAt:
          type: string
          format: date-time
          nullable: true
        shareToken:
          type: string
          nullable: true
          description: >-
            Opaque share token. Null until the owner generates a share link.
            Exposed only to the preset owner (the list endpoint is scoped to
            their session) so the UI can show whether a link is already
            active and offer a "Revoke" action.

    GlobalScreenerPresetsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GlobalScreenerPreset" }

    GlobalScreenerPresetCreateBody:
      type: object
      required: [name, body]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        body: { $ref: "#/components/schemas/GlobalScreenerBody" }
        autoRunIntervalMin:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1440

    GlobalScreenerPresetUpdateBody:
      type: object
      description: "Provide `name` to rename, `body` to replace the preset's filter payload, and/or `autoRunIntervalMin` to toggle background scheduling."
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        body: { $ref: "#/components/schemas/GlobalScreenerBody" }
        autoRunIntervalMin:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1440

    GlobalScreenerPresetDeleteResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    GlobalCuratedScreenerPreset:
      type: object
      description: >-
        A read-only entry from the curated starter library. The UI renders
        these as "Examples" and offers a "Fork" action that creates an
        editable personal copy via `POST /global/screener-presets`.
      required: [slug, name, description, body]
      properties:
        slug:
          type: string
          description: "Stable in-code identifier, e.g. `crypto-oversold-1h`."
        name: { type: string }
        description: { type: string }
        body: { $ref: "#/components/schemas/GlobalScreenerBody" }

    GlobalScreenerPresetLibraryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GlobalCuratedScreenerPreset" }

    GlobalScreenerPresetShareResponse:
      type: object
      description: >-
        Returned by `POST /global/screener-presets/{id}/share`. Contains
        the (possibly newly-generated) share token and a relative URL the
        UI can resolve against the artifact origin to copy to clipboard.
      required: [token, shareUrl]
      properties:
        token: { type: string }
        shareUrl:
          type: string
          description: "Path with `?share=<token>` query suitable for `new URL(value, window.location.origin)`."

    GlobalScreenerPresetSharePreview:
      type: object
      description: >-
        Sanitized public view of a shared preset. Deliberately omits the
        owner's session key, timestamps, alert state, and database id so
        nothing identifying about the original author leaks.
      required: [name, body]
      properties:
        name: { type: string }
        body: { $ref: "#/components/schemas/GlobalScreenerBody" }

    HomeIndexEnrichment:
      type: object
      required: [key, sparkline, topCeWalls, topPeWalls]
      properties:
        key:          { type: string, description: "Index key matching IndicesBoardItem.key (NIFTY50, BANKNIFTY, etc.)" }
        sparkline:
          type: array
          items: { type: number }
          description: "Intraday close prices (~78 points for 5-min bars)"
        rsi14:        { type: number, nullable: true, description: "RSI(14) from intraday closes" }
        macdHist:     { type: number, nullable: true, description: "MACD histogram (12,26,9) last value" }
        adx14:        { type: number, nullable: true, description: "ADX(14) trend strength" }
        volumeRatio:  { type: number, nullable: true, description: "Session volume / 20-period average" }
        pcrOi:        { type: number, nullable: true, description: "Put-Call Ratio by Open Interest" }
        pcrVolume:    { type: number, nullable: true, description: "Put-Call Ratio by Volume" }
        maxPain:      { type: number, nullable: true, description: "Max pain strike for current expiry" }
        atmIv:        { type: number, nullable: true, description: "ATM straddle implied volatility" }
        optionsBias:  { type: string, nullable: true, enum: [BULLISH, BEARISH, NEUTRAL] }
        topCeWalls:
          type: array
          items:
            type: object
            required: [strike, oi]
            properties:
              strike: { type: number }
              oi:     { type: integer }
        topPeWalls:
          type: array
          items:
            type: object
            required: [strike, oi]
            properties:
              strike: { type: number }
              oi:     { type: integer }

    HomeEnrichmentResponse:
      type: object
      required: [indices, generatedAt]
      properties:
        indices:
          type: array
          items: { $ref: "#/components/schemas/HomeIndexEnrichment" }
        generatedAt: { type: string, format: date-time }

    MacroSparkline:
      type: object
      required: [symbol, label, points]
      properties:
        symbol: { type: string, description: "Yahoo ticker (e.g. ^VIX, DX-Y.NYB, CL=F, ^INDIAVIX)" }
        label:  { type: string, description: "UI label (VIX, DXY, Crude, India VIX)" }
        invert: { type: boolean, description: "When true, rising = bearish for equities (used by UI to flip the colour scale)" }
        points:
          type: array
          description: "Daily closes oldest → newest (~5 trading days)"
          items:
            type: object
            required: [t, c]
            properties:
              t: { type: string, format: date-time }
              c: { type: number }

    MacroHistoryResponse:
      type: object
      required: [series, generatedAt]
      properties:
        series:
          type: array
          items: { $ref: "#/components/schemas/MacroSparkline" }
        generatedAt: { type: string, format: date-time }

    StrategyFeatureKey:
      type: string
      enum: [close, ema9, ema20, ema50, rsi14, atr14, vwap]

    StrategyEmaKey:
      type: string
      enum: [ema9, ema20, ema50]

    StrategyConditionOp:
      type: string
      enum: [gt, lt, gte, lte]

    StrategyConditionOperand:
      type: object
      required: [type]
      description: "Right-hand operand: another feature, or a literal numeric value. `feature` is set when type=feature; `value` when type=value."
      properties:
        type: { type: string, enum: [feature, value] }
        feature: { $ref: "#/components/schemas/StrategyFeatureKey" }
        value: { type: number }

    StrategyDirectionMode:
      type: string
      enum: [BOTH, CALL_ONLY, PUT_ONLY]
      description: "Which option side(s) the strategy may take."

    StrategyRuleBlock:
      type: object
      required: [type]
      description: >
        One v2 rule block, discriminated by `type`. The server Zod schema is the
        strict, fail-closed validator; this OpenAPI shape keeps non-`type` fields
        optional (so the builder UI can carry any block kind) but its numeric
        ranges MIRROR the server Zod bounds so a typed client cannot construct a
        value the server will reject. Block types: price_vs_ema, ema_stack,
        ema_cross, ema_slope, ema_pullback, ema_distance_max, price_vs_vwap,
        vwap_cross, vwap_distance_max, fib_zone, compare.
      properties:
        type:
          type: string
          enum: [price_vs_ema, ema_stack, ema_cross, ema_slope, ema_pullback, ema_distance_max, price_vs_vwap, vwap_cross, vwap_distance_max, fib_zone, compare]
        ema: { $ref: "#/components/schemas/StrategyEmaKey" }
        cmp: { type: string, enum: [above, below] }
        order: { type: string, enum: [bull, bear] }
        fast: { $ref: "#/components/schemas/StrategyEmaKey" }
        slow: { $ref: "#/components/schemas/StrategyEmaKey" }
        dir: { type: string, enum: [golden, death, rising, falling, reclaim, reject], description: "Direction token; valid set depends on block type." }
        lookback: { type: integer, minimum: 1, maximum: 20, description: "ema_slope lookback (server Zod: 1-20)." }
        side: { type: string, enum: [bull, bear] }
        tolPct: { type: number, minimum: 0, maximum: 5, description: "ema_pullback tolerance % (server Zod: 0-5)." }
        maxPct: { type: number, minimum: 0, maximum: 20, description: "ema_distance_max / vwap_distance_max % (server Zod: 0-20)." }
        lo: { type: number, minimum: 0, maximum: 3, description: "fib_zone lower bound (server Zod: 0-3); must be < hi." }
        hi: { type: number, minimum: 0, maximum: 3, description: "fib_zone upper bound (server Zod: 0-3); must be > lo." }
        swingSpan: { type: integer, minimum: 2, maximum: 10, description: "fib_zone swing span (server Zod: 2-10)." }
        left: { $ref: "#/components/schemas/StrategyFeatureKey" }
        op: { $ref: "#/components/schemas/StrategyConditionOp" }
        right: { $ref: "#/components/schemas/StrategyConditionOperand" }

    StrategyRuleGroup:
      type: object
      required: [logic, blocks]
      description: "A boolean group of blocks plus (optionally) nested groups. AND = all must pass; OR = any."
      properties:
        logic: { type: string, enum: [AND, OR] }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/StrategyRuleBlock" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/StrategyRuleGroup" }

    StrategySideRules:
      type: object
      required: [market, setup]
      description: "One direction's two gating layers. Empty layers are pass-through; an entirely-empty side is disabled."
      properties:
        market: { $ref: "#/components/schemas/StrategyRuleGroup" }
        setup: { $ref: "#/components/schemas/StrategyRuleGroup" }

    StrategyStopConfig:
      type: object
      required: [type]
      description: "Stop geometry: `atr` (atrMult × ATR14) or `swing` (recent fractal ± bufferAtrMult × ATR14)."
      properties:
        type: { type: string, enum: [atr, swing] }
        atrMult: { type: number, minimum: 0.25, maximum: 8, description: "Set when type=atr (server Zod: 0.25-8)." }
        swingSpan: { type: integer, minimum: 2, maximum: 10, description: "Set when type=swing (server Zod: 2-10)." }
        bufferAtrMult: { type: number, minimum: 0, maximum: 3, description: "Set when type=swing (server Zod: 0-3)." }

    StrategyExecutionConfig:
      type: object
      required: [stop, target1R, target2R]
      properties:
        stop: { $ref: "#/components/schemas/StrategyStopConfig" }
        target1R: { type: number, minimum: 0.25, maximum: 10, description: "Target 1 as a multiple of the risk (server Zod: 0.25-10)." }
        target2R: { type: number, minimum: 0.25, maximum: 20, description: "Target 2 as a multiple of the risk (server Zod: 0.25-20)." }
        minRR: { type: number, minimum: 0, maximum: 10, description: "Reject if planned target-1 reward (in R) is below this (server Zod: 0-10)." }
        maxStopAtrMult: { type: number, minimum: 0.5, maximum: 10, description: "Reject if stop distance exceeds this multiple of ATR, swing sanity (server Zod: 0.5-10)." }
        maxEntryDistanceAtrMult: { type: number, minimum: 0.5, maximum: 20, description: "Anti-chase: reject if entry is more than this multiple of ATR from EMA20 (server Zod: 0.5-20)." }
        sessionWindow:
          type: object
          required: [startMin, endMin]
          description: "IST minute-of-day window [start,end] inclusive within which entries may fire."
          properties:
            startMin: { type: integer, minimum: 0, maximum: 1439 }
            endMin: { type: integer, minimum: 0, maximum: 1439 }
        trailingToBreakeven: { type: boolean, description: "Runner-enforced metadata: trail to breakeven after +1R." }
        dailyCap: { type: integer, minimum: 1, maximum: 50, description: "Runner-enforced metadata: max entries/day (server Zod: 1-50)." }

    CustomStrategyDef:
      type: object
      required: [version, id, name, category, description, direction, bull, bear, execution, baseConfidence]
      properties:
        version: { type: integer, enum: [2], description: "Spec language version (always 2)." }
        id: { type: string, description: "Stable id, always CUSTOM_<slug>." }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        direction: { $ref: "#/components/schemas/StrategyDirectionMode" }
        bull: { $ref: "#/components/schemas/StrategySideRules" }
        bear: { $ref: "#/components/schemas/StrategySideRules" }
        execution: { $ref: "#/components/schemas/StrategyExecutionConfig" }
        baseConfidence: { type: number, minimum: 0, maximum: 100, description: "Transparent base confidence (0-100) carried into both surfaces." }

    CustomStrategyInput:
      type: object
      required: [slug, name, category]
      properties:
        slug: { type: string, minLength: 2, maxLength: 40, description: "Lowercase alphanumeric words separated by underscores; forms the CUSTOM_<slug> id." }
        name: { type: string, minLength: 2, maxLength: 80 }
        category: { type: string, minLength: 2, maxLength: 40 }
        description: { type: string, maxLength: 400 }
        direction: { $ref: "#/components/schemas/StrategyDirectionMode" }
        bull: { $ref: "#/components/schemas/StrategySideRules" }
        bear: { $ref: "#/components/schemas/StrategySideRules" }
        execution: { $ref: "#/components/schemas/StrategyExecutionConfig" }
        baseConfidence: { type: number, minimum: 0, maximum: 100 }

    StrategyCatalogEntry:
      type: object
      required: [id, name, category, description, surfaces, kind, engineSelectable, engineEnabled]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        surfaces:
          type: array
          description: "Which surfaces this strategy appears on."
          items: { type: string, enum: [engine, backtest] }
        kind: { type: string, enum: [BUILTIN_ENGINE, BUILTIN_BACKTEST, CUSTOM] }
        engineSelectable: { type: boolean, description: "Whether this strategy can be toggled onto the live engine allow-list." }
        engineEnabled: { type: boolean, description: "Effective live-engine enabled state (builtins default ON, custom default OFF)." }

    StrategyCatalogResponse:
      type: object
      required: [entries, engineGatingActive]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/StrategyCatalogEntry" }
        engineGatingActive: { type: boolean, description: "True once the owner has narrowed the engine (disabled a builtin or enabled a custom); false = legacy all-builtins behaviour." }

    StrategyEngineUpdateItem:
      type: object
      required: [strategyId, enabled]
      properties:
        strategyId: { type: string }
        enabled: { type: boolean }

    StrategyEngineUpdateBody:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/StrategyEngineUpdateItem" }

    CustomStrategyMutationResponse:
      type: object
      required: [id, catalog]
      properties:
        id: { type: string }
        catalog: { $ref: "#/components/schemas/StrategyCatalogResponse" }

    CustomStrategyDeleteResponse:
      type: object
      required: [ok, id, catalog]
      properties:
        ok: { type: boolean }
        id: { type: string }
        catalog: { $ref: "#/components/schemas/StrategyCatalogResponse" }
