        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Portfolio" }
    patch:
      operationId: updatePortfolio
      tags: [portfolio]
      summary: Rename a portfolio and/or set it as the user's default
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortfolioPatchBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Portfolio" }
    delete:
      operationId: deletePortfolio
      tags: [portfolio]
      summary: Delete a portfolio and all its holdings
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioDeleteResponse" }

  /portfolios/{id}/holdings:
    put:
      operationId: replacePortfolioHoldings
      tags: [portfolio]
      summary: Replace all holdings in a portfolio (bulk save)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortfolioHoldingsReplaceBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Portfolio" }

  /strategy-control/catalog:
    get:
