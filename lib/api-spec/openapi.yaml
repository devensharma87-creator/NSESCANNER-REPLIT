      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalWatchlistAddBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalWatchlistAddResponse" }

  /global/watchlist/{symbol}:
    delete:
      operationId: deleteGlobalWatchlist
      tags: [global-watchlist]
      summary: Remove an instrument from the personal global watchlist
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalWatchlistDeleteResponse" }

  /portfolios:
    get:
      operationId: listPortfolios
      tags: [portfolio]
      summary: List the current user's saved portfolios (metadata only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioListResponse" }
    post:
      operationId: createPortfolio
      tags: [portfolio]
      summary: Create a named portfolio (optionally seeded with holdings)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortfolioCreateBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Portfolio" }

  /portfolios/{id}:
    get:
      operationId: getPortfolio
      tags: [portfolio]
      summary: Get one portfolio with its holdings
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
