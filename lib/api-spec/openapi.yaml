openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NSE Stock Scanner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: market
  - name: sectors
  - name: stocks
  - name: scan
  - name: options
  - name: news
  - name: global-auth
  - name: global-data
  - name: global-watchlist
  - name: global-screener
  - name: global-status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /market/summary:
    get:
      operationId: getMarketSummary
      tags: [market]
      summary: Indian market indices snapshot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketSummary" }

  /market/global:
    get:
      operationId: getGlobalIndices
      tags: [market]
      summary: Global indices including GIFT NIFTY for pre-market read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalMarket" }

  /market/trend:
    get:
      operationId: getMarketTrend
      tags: [market]
      summary: Overall market trend (breadth + index alignment)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketTrend" }

  /sectors:
    get:
      operationId: listSectors
      tags: [sectors]
      summary: All sectors with aggregate stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SectorSummary" }

  /sectors/{sector}:
    get:
      operationId: getSector
      tags: [sectors]
      summary: Sector detail with all stocks
      parameters:
        - in: path
          name: sector
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectorDetail" }

  /stocks:
    get:
      operationId: listStocks
      tags: [stocks]
      summary: List all scanned stocks (with live quote + signal)
      parameters:
        - in: query
          name: sector
          schema: { type: string }
        - in: query
          name: signal
          schema:
            type: string
            enum: [STRONG_BUY, BUY, NEUTRAL, SELL, STRONG_SELL]
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StockRow" }

  /stocks/{symbol}:
    get:
      operationId: getStockDetail
      tags: [stocks]
      summary: Detailed view of a single stock
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockDetail" }

  /stocks/{symbol}/statements:
    get:
      operationId: getStockStatements
      tags: [stocks]
      summary: Full financial statements (P&L, Balance Sheet, Cash Flow, Ratios, Shareholding)
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockStatements" }

  /stocks/{symbol}/history:
    get:
      operationId: getStockHistory
      tags: [stocks]
      summary: Historical OHLC + indicators
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: range
          schema:
            type: string
            enum: ["1mo", "3mo", "6mo", "1y", "2y"]
            default: "6mo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockHistory" }

  /scan/top:
    get:
      operationId: getTopScans
      tags: [scan]
      summary: Top buy and sell ideas right now
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopScans" }

  /options/signals:
    get:
      operationId: getOptionSignals
      tags: [options]
      summary: Index option (CALL/PUT) buy/sell setups with entry/SL/target
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionSignalSet" }

  /options/signal-history:
    get:
      operationId: getOptionSignalHistory
      tags: [options]
      summary: "Today's persisted option signals with live status, MFE/MAE and exit info."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionSignalHistorySet" }

  /paper/account:
    get:
      operationId: getPaperAccount
      tags: [paper]
      summary: "Owner-only paper trading account state for one segment."
      parameters:
        - in: query
          name: segment
          required: true
          schema: { type: string, enum: [FNO, EQUITY] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperAccountState" }

  /paper/positions/fo:
    get:
      operationId: getPaperPositionsFO
      tags: [paper]
      summary: "Owner-only list of currently OPEN F&O paper positions with live MTM."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperPositionsFOResponse" }

  /paper/trades/fo:
    get:
      operationId: getPaperTradesFO
      tags: [paper]
      summary: "Owner-only list of CLOSED F&O paper trades for a given IST date."
      parameters:
        - in: query
          name: date
          required: false
          schema: { type: string, description: "IST date YYYY-MM-DD; defaults to today." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperTradesFOResponse" }

  /paper/positions/fo/{id}/close:
    post:
      operationId: closePaperPositionFO
      tags: [paper]
      summary: "Owner-only manual force-exit of an OPEN F&O paper position at last known premium."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, description: "paper_trade_fo.id (uuid)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperTradeFOClosed" }

  /paper/reports/fo/monthly:
    get:
      operationId: getPaperReportFoMonthly
      tags: [paper]
      summary: "Owner-only F&O paper P&L report for one IST calendar month with daily buckets and per-trade detail."
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, description: "IST calendar month YYYY-MM" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperReportFoMonthly" }

  /paper/reports/fo/yearly:
    get:
      operationId: getPaperReportFoYearly
      tags: [paper]
      summary: "Owner-only F&O paper P&L report for one Indian financial year with monthly buckets."
      parameters:
        - in: query
          name: fy
          required: true
          schema: { type: string, description: "Indian FY in YYYY-YYYY form, eg 2026-2027" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperReportFoYearly" }

  /paper/positions/eq:
    get:
      operationId: getPaperPositionsEq
      tags: [paper]
      summary: "Owner-only list of currently OPEN equity (delivery) paper positions with live MTM."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperPositionsEqResponse" }

  /paper/trades/eq:
    get:
      operationId: getPaperTradesEq
      tags: [paper]
      summary: "Owner-only list of CLOSED equity paper trades for a given IST date (by exitedAt)."
      parameters:
        - in: query
          name: date
          required: false
          schema: { type: string, description: "IST date YYYY-MM-DD; defaults to today." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperTradesEqResponse" }

  /paper/positions/eq/{id}/close:
    post:
      operationId: closePaperPositionEq
      tags: [paper]
      summary: "Owner-only manual force-exit of an OPEN equity paper position at last known LTP."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, description: "paper_trade_eq.id (uuid)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperTradeEqClosed" }

  /paper/reports/eq/monthly:
    get:
      operationId: getPaperReportEqMonthly
      tags: [paper]
      summary: "Owner-only equity paper P&L report for one IST calendar month with daily buckets and per-trade detail."
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, description: "IST calendar month YYYY-MM" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperReportEqMonthly" }

  /paper/reports/eq/yearly:
    get:
      operationId: getPaperReportEqYearly
      tags: [paper]
      summary: "Owner-only equity paper P&L report for one Indian financial year with monthly buckets."
      parameters:
        - in: query
          name: fy
          required: true
          schema: { type: string, description: "Indian FY in YYYY-YYYY form, eg 2026-2027" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperReportEqYearly" }

  /options/chain/{underlying}:
    get:
      operationId: getOptionChain
      tags: [options]
      summary: "Live NSE option chain (indices + F&O equities)"
      parameters:
        - in: path
          name: underlying
          required: true
          schema: { type: string, description: "NIFTY, BANKNIFTY, FINNIFTY, MIDCPNIFTY or NSE equity symbol" }
        - in: query
          name: expiry
          required: false
          schema: { type: string, description: "Active expiry YYYY-MM-DD; defaults to nearest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionChainResponse" }

  /options/analytics/{underlying}:
    get:
      operationId: getOptionAnalytics
      tags: [options]
      summary: "PCR, Max Pain, ATM IV, OI buildup interpretation"
      parameters:
        - in: path
          name: underlying
          required: true
          schema: { type: string }
        - in: query
          name: expiry
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionAnalyticsResponse" }

  /options/strategies/{underlying}:
    get:
      operationId: getOptionStrategies
      tags: [options]
      summary: "Pre-built multi-leg strategies with payoff diagrams + Greeks"
      parameters:
        - in: path
          name: underlying
          required: true
          schema: { type: string }
        - in: query
          name: expiry
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionStrategiesResponse" }

  /inst/fii-dii:
    get:
      operationId: getFiiDii
      tags: [institutional]
      summary: FII / DII cash market monthly aggregates with daily breakdown
      parameters:
        - in: query
          name: months
          schema: { type: integer, minimum: 1, maximum: 36, default: 12 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiiDiiResponse" }

  /inst/participant-oi:
    get:
      operationId: getParticipantOi
      tags: [institutional]
      summary: Participant-wise OI (Client / FII / DII / Pro / TOTAL) for a single trading day
      parameters:
        - in: query
          name: date
          schema: { type: string, description: "YYYY-MM-DD; latest if omitted" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantOiResponse" }

  /inst/refresh:
    post:
      operationId: refreshInstFlows
      tags: [institutional]
      summary: Force-refresh FII/DII and participant OI from upstream sources
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /news:
    get:
      operationId: getNews
      tags: [news]
      summary: Market news (optionally filtered by symbol)
      parameters:
        - in: query
          name: symbol
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NewsItem" }

  /market/events:
    get:
      operationId: getMarketEvents
      tags: [news]
      summary: Market events — exchange holidays, earnings calendar, central bank & macro events (90-day horizon)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketEventsResponse" }

  /market/premarket:
    get:
      operationId: getPreMarket
      tags: [market]
      summary: Pre/Post-market deep analysis — overnight cues, GIFT NIFTY, gainers/losers, gappers, market internals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreMarketReport" }
  /watchlist/{key}:
    get:
      operationId: getWatchlist
      tags: [market]
      summary: Pre-defined watchlist (Nifty 100 / Midcap 100 / Smallcap 100) with live quotes and MC trend
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
            enum: [SENSEX, BANKNIFTY, NIFTY50, NIFTY100, NIFTYMIDCAP100, NIFTYSMALLCAP100, NIFTY500]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchlistResponse" }

  /indices:
    get:
      operationId: getIndicesBoard
      tags: [market]
      summary: Indices board — Indian + global benchmarks + commodities with full fact pack
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndicesBoardSnapshot" }

  # ---------------------------------------------------------------------
  # Global Multi-Asset Scanner (Phase 1 — Crypto / Commodities / Forex)
  # All endpoints below are gated by the new GLOBAL_APP_ACCESS_PASSWORD
  # cookie ("global_session"); independent from the NSE scanner gate.
  # ---------------------------------------------------------------------

  /global/auth/status:
    get:
      operationId: getGlobalAuthStatus
      tags: [global-auth]
      summary: Whether the global-scanner session cookie is present and the password is configured
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalAuthStatus" }

  /global/auth/login:
    post:
      operationId: globalLogin
      tags: [global-auth]
      summary: Log into the global scanner with the configured access password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalLoginBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalLoginResponse" }

  /global/auth/logout:
    post:
      operationId: globalLogout
      tags: [global-auth]
      summary: Clear the global scanner session cookie
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalLogoutResponse" }

  /global/instruments:
    get:
      operationId: listGlobalInstruments
      tags: [global-data]
      summary: Full instrument universe (crypto + commodities + forex + equities + indices)
      parameters:
        - in: query
          name: assetClass
          required: false
          schema: { type: string, enum: [crypto, commodity, forex, equity, index] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GlobalInstrument" }

  /global/dashboard:
    get:
      operationId: getGlobalDashboard
      tags: [global-data]
      summary: Live snapshot rows for an asset class (or watchlist) with freshness metadata
      parameters:
        - in: query
          name: asset
          required: true
          schema: { type: string, enum: [crypto, commodities, forex, equities, indices, watchlist] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalDashboardResponse" }

  /global/instruments/{symbol}:
    get:
      operationId: getGlobalInstrumentDetail
      tags: [global-data]
      summary: Per-instrument quote, day stats and supported timeframes
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalInstrumentDetail" }

  /global/instruments/{symbol}/candles:
    get:
      operationId: getGlobalCandles
      tags: [global-data]
      summary: OHLCV candles for an instrument and timeframe (real source data)
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: timeframe
          required: true
          schema: { type: string, enum: ["1m","5m","15m","1h","4h","1d"] }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 10, maximum: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalCandlesResponse" }

  /global/instruments/{symbol}/indicators:
    get:
      operationId: getGlobalInstrumentIndicators
      tags: [global-data]
      summary: Indicator series (SMA/EMA/RSI/MACD/BB/ATR/VWAP/Supertrend) for an instrument
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: timeframe
          required: true
          schema: { type: string, enum: ["1m","5m","15m","1h","4h","1d"] }
        - in: query
          name: list
          required: false
          schema: { type: string, description: "CSV of indicator ids (sma20,sma50,sma200,ema20,ema50,rsi14,macd,bb20,atr14,vwap,supertrend)" }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 20, maximum: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalIndicatorsResponse" }

  /global/screen:
    post:
      operationId: runGlobalScreener
      tags: [global-screener]
      summary: Run a screener against the universe using cached candles + indicator filters
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalScreenerBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalScreenerResponse" }

  /global/watchlist:
    get:
      operationId: getGlobalWatchlist
      tags: [global-watchlist]
      summary: Current user's personal global-scanner watchlist
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalWatchlistResponse" }
    post:
      operationId: addGlobalWatchlist
      tags: [global-watchlist]
      summary: Add an instrument to the personal global watchlist (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalWatchlistAddBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalWatchlistAddResponse" }

  /global/watchlist/{symbol}:
    delete:
      operationId: deleteGlobalWatchlist
      tags: [global-watchlist]
      summary: Remove an instrument from the personal global watchlist
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalWatchlistDeleteResponse" }

  /global/status:
    get:
      operationId: getGlobalSourceStatus
      tags: [global-status]
      summary: Per-data-source freshness / last-error for the dashboard health strip
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalSourceStatusResponse" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Signal:
      type: string
      enum: [STRONG_BUY, BUY, NEUTRAL, SELL, STRONG_SELL]

    Quote:
      type: object
      required: [symbol, price, change, changePercent, open, high, low, previousClose, volume, updatedAt]
      properties:
        symbol: { type: string }
        name: { type: string }
        exchange: { type: string }
        price: { type: number }
        change: { type: number }
        changePercent: { type: number }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        previousClose: { type: number }
        volume: { type: number }
        avgVolume: { type: number }
        marketCap: { type: number }
        dayRange: { type: string }
        yearRange: { type: string }
        fiftyTwoWeekHigh: { type: number }
        fiftyTwoWeekLow: { type: number }
        updatedAt: { type: string, format: date-time }

    Indicators:
      type: object
      # Every field is optional — Kite-only rows have no intraday bars to
      # compute EMAs/RSI/MACD/VWAP/ATR with, so they ship `undefined` for
      # those fields and the UI renders "—" instead of fake zeros.
      # Pivot/S/R/delivery% are derived from real OHLC and are always
      # populated when a row exists.
      properties:
        ema9: { type: number }
        ema21: { type: number }
        ema20: { type: number }
        ema50: { type: number }
        ema100: { type: number }
        ema200: { type: number }
        vwap: { type: number, description: "Daily intraday VWAP if available, else rolling proxy" }
        rsi14: { type: number }
        macd: { type: number }
        macdSignal: { type: number }
        macdHist: { type: number }
        atr14: { type: number }
        adx14: { type: number }
        volumeRatio: { type: number, description: "current volume / 20-day average" }
        deliveryPct: { type: number, description: "estimated delivery percentage" }
        trendStrength: { type: number, description: "0-100" }
        supportLevel: { type: number }
        resistanceLevel: { type: number }
        pivot: { type: number }
        r1: { type: number }
        s1: { type: number }
        valueAreaHigh: { type: number }
        valueAreaLow: { type: number }
        pointOfControl: { type: number }

    SignalReason:
      type: object
      required: [label, weight, bullish]
      properties:
        label: { type: string }
        detail: { type: string }
        weight: { type: number }
        bullish: { type: boolean }

    Recommendation:
      type: object
      required: [signal, score, confidence, reasons]
      properties:
        signal: { $ref: "#/components/schemas/Signal" }
        score: { type: number, description: "-100 to 100" }
        confidence: { type: number, description: "0 to 100" }
        timeframe: { type: string, description: "e.g. swing, intraday, positional" }
        target: { type: number }
        stopLoss: { type: number }
        riskRewardRatio: { type: number }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/SignalReason" }

    StockRow:
      type: object
      required: [symbol, name, sector, quote, recommendation]
      properties:
        symbol: { type: string }
        name: { type: string }
        sector: { type: string }
        quote: { $ref: "#/components/schemas/Quote" }
        indicators: { $ref: "#/components/schemas/Indicators" }
        recommendation: { $ref: "#/components/schemas/Recommendation" }

    Candle:
      type: object
      required: [t, o, h, l, c, v]
      properties:
        t: { type: string, format: date-time }
        o: { type: number }
        h: { type: number }
        l: { type: number }
        c: { type: number }
        v: { type: number }

    StockHistory:
      type: object
      required: [symbol, range, candles]
      properties:
        symbol: { type: string }
        range: { type: string }
        candles:
          type: array
          items: { $ref: "#/components/schemas/Candle" }
        ema20Series:
          type: array
          items: { type: number, nullable: true }
        ema50Series:
          type: array
          items: { type: number, nullable: true }
        rsiSeries:
          type: array
          items: { type: number, nullable: true }

    QuarterlyFinancial:
      type: object
      required: [period]
      properties:
        period: { type: string }
        revenue: { type: number }
        netProfit: { type: number }
        eps: { type: number }
        operatingMargin: { type: number }
        netMargin: { type: number }

    Holding:
      type: object
      required: [period]
      properties:
        period: { type: string }
        promoter: { type: number }
        fii: { type: number }
        dii: { type: number }
        public: { type: number }

    NewsItem:
      type: object
      required: [id, title, source, publishedAt]
      properties:
        id: { type: string }
        title: { type: string }
        source: { type: string }
        url: { type: string }
        publishedAt: { type: string, format: date-time }
        summary: { type: string }
        symbol: { type: string }
        sentiment:
          type: string
          enum: [positive, neutral, negative]

    CompanyProfile:
      type: object
      required: [symbol, name, sector]
      properties:
        symbol: { type: string }
        name: { type: string }
        sector: { type: string }
        industry: { type: string }
        description: { type: string }
        website: { type: string }
        seasonality: { type: string }
        catalysts:
          type: array
          items: { type: string }
        keyStats:
          $ref: "#/components/schemas/KeyStats"
        peers:
          type: array
          items:
            type: object
            required: [symbol, name]
            properties:
              symbol: { type: string }
              name: { type: string }
              changePercent: { type: number }
              price: { type: number }

    KeyStats:
      type: object
      properties:
        marketCapCr: { type: number, description: "Market cap in ₹ crore" }
        peRatio: { type: number }
        pbRatio: { type: number }
        eps: { type: number }
        bookValue: { type: number }
        dividendYield: { type: number, description: "%" }
        beta: { type: number }
        roe: { type: number, description: "%" }
        roce: { type: number, description: "%" }
        debtToEquity: { type: number }
        profitMargin: { type: number, description: "%" }
        operatingMargin: { type: number, description: "%" }
        sharesOutstandingCr: { type: number, description: "Shares outstanding in crore" }
        fiftyDayAverage: { type: number }
        twoHundredDayAverage: { type: number }
        revenueGrowthYoy: { type: number, description: "%" }
        earningsGrowthYoy: { type: number, description: "%" }
        forwardPe: { type: number }
        priceToSales: { type: number }
        promoterHolding: { type: number, description: "%" }

    StockDetail:
      type: object
      required: [profile, quote, indicators, recommendation, financials, holdings, news]
      properties:
        profile: { $ref: "#/components/schemas/CompanyProfile" }
        quote: { $ref: "#/components/schemas/Quote" }
        indicators: { $ref: "#/components/schemas/Indicators" }
        recommendation: { $ref: "#/components/schemas/Recommendation" }
        financials:
          type: array
          items: { $ref: "#/components/schemas/QuarterlyFinancial" }
        holdings:
          type: array
          items: { $ref: "#/components/schemas/Holding" }
        news:
          type: array
          items: { $ref: "#/components/schemas/NewsItem" }

    AnnualPLRow:
      type: object
      required: [period, endDate]
      properties:
        period: { type: string }
        endDate: { type: string, format: date }
        revenue: { type: number, description: "₹ crore" }
        costOfRevenue: { type: number }
        grossProfit: { type: number }
        ebitda: { type: number }
        ebit: { type: number }
        interestExpense: { type: number }
        netProfit: { type: number }
        eps: { type: number }
        taxProvision: { type: number }
        operatingMargin: { type: number, description: "%" }
        netMargin: { type: number, description: "%" }

    BalanceSheetRow:
      type: object
      required: [period, endDate]
      properties:
        period: { type: string }
        endDate: { type: string, format: date }
        totalAssets: { type: number, description: "₹ crore" }
        totalLiabilities: { type: number }
        totalEquity: { type: number }
        totalDebt: { type: number }
        cashAndEquivalents: { type: number }
        inventory: { type: number }
        receivables: { type: number }
        fixedAssets: { type: number }
        currentAssets: { type: number }
        currentLiabilities: { type: number }
        workingCapital: { type: number }
        bookValuePerShare: { type: number }

    CashFlowRow:
      type: object
      required: [period, endDate]
      properties:
        period: { type: string }
        endDate: { type: string, format: date }
        operatingCashFlow: { type: number, description: "₹ crore" }
        investingCashFlow: { type: number }
        financingCashFlow: { type: number }
        capex: { type: number }
        freeCashFlow: { type: number }
        netChangeInCash: { type: number }
        dividendsPaid: { type: number }

    KeyRatio:
      type: object
      required: [period, endDate]
      properties:
        period: { type: string }
        endDate: { type: string, format: date }
        currentRatio: { type: number }
        quickRatio: { type: number }
        debtToEquity: { type: number }
        roe: { type: number, description: "%" }
        roa: { type: number, description: "%" }
        roce: { type: number, description: "%" }
        assetTurnover: { type: number }
        interestCoverage: { type: number }
        netMargin: { type: number, description: "%" }
        operatingMargin: { type: number, description: "%" }

    InstitutionalHolder:
      type: object
      required: [name, percentHeld]
      properties:
        name: { type: string }
        percentHeld: { type: number, description: "%" }
        valueCr: { type: number }
        reportDate: { type: string, format: date }

    ShareholdingBreakdown:
      type: object
      required: [topInstitutions, topInsiders]
      properties:
        insidersPct: { type: number, description: "%" }
        institutionsPct: { type: number, description: "%" }
        publicPct: { type: number, description: "%" }
        topInstitutions:
          type: array
          items: { $ref: "#/components/schemas/InstitutionalHolder" }
        topInsiders:
          type: array
          items: { $ref: "#/components/schemas/InstitutionalHolder" }

    StockStatements:
      type: object
      required: [annualPL, quarterlyPL, balanceSheet, cashFlow, ratios, shareholding]
      properties:
        annualPL:
          type: array
          items: { $ref: "#/components/schemas/AnnualPLRow" }
        quarterlyPL:
          type: array
          items: { $ref: "#/components/schemas/AnnualPLRow" }
        balanceSheet:
          type: array
          items: { $ref: "#/components/schemas/BalanceSheetRow" }
        cashFlow:
          type: array
          items: { $ref: "#/components/schemas/CashFlowRow" }
        ratios:
          type: array
          items: { $ref: "#/components/schemas/KeyRatio" }
        shareholding: { $ref: "#/components/schemas/ShareholdingBreakdown" }

    SectorSummary:
      type: object
      required: [sector, stockCount, avgScore, gainers, losers, topPick]
      properties:
        sector: { type: string }
        stockCount: { type: integer }
        avgScore: { type: number }
        avgChangePercent: { type: number }
        gainers: { type: integer }
        losers: { type: integer }
        topPick: { $ref: "#/components/schemas/StockRow" }

    SectorDetail:
      type: object
      required: [sector, stocks, summary]
      properties:
        sector: { type: string }
        summary: { $ref: "#/components/schemas/SectorSummary" }
        stocks:
          type: array
          items: { $ref: "#/components/schemas/StockRow" }

    IndexQuote:
      type: object
      required: [symbol, name, price, change, changePercent]
      properties:
        symbol: { type: string }
        name: { type: string }
        region: { type: string }
        price: { type: number }
        change: { type: number }
        changePercent: { type: number }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        previousClose: { type: number }
        fiftyTwoWeekHigh: { type: number }
        fiftyTwoWeekLow: { type: number }
        volume: { type: number }
        asOf: { type: integer, description: "Last update unix seconds" }
        sparkline:
          type: array
          description: "Recent close prices for sparkline (oldest → newest)"
          items: { type: number }
        trend: { type: string, enum: [bullish, bearish, neutral] }
        vwap: { type: number }
        ema9: { type: number }
        ema21: { type: number }
        rsi14: { type: number }
        breadth:
          type: object
          properties:
            advancers: { type: integer }
            decliners: { type: integer }
            unchanged: { type: integer }
            adRatio: { type: number, nullable: true, description: "advancers/decliners; null when decliners=0 and advancers>0 (interpreted as ∞)" }
        constituentSlug: { type: string, description: "URL slug for index detail page" }

    MarketSummary:
      type: object
      required: [indices, advancers, decliners, unchanged, lastUpdated]
      properties:
        indices:
          type: array
          items: { $ref: "#/components/schemas/IndexQuote" }
        advancers: { type: integer }
        decliners: { type: integer }
        unchanged: { type: integer }
        marketStatus:
          type: string
          enum: [open, closed, pre_open]
        lastUpdated: { type: string, format: date-time }

    GlobalMarket:
      type: object
      required: [indices, lastUpdated]
      properties:
        indices:
          type: array
          items: { $ref: "#/components/schemas/IndexQuote" }
        lastUpdated: { type: string, format: date-time }

    IndexBoardItem:
      type: object
      required: [key, name, category, yahooSymbol, currency, support, resistance, notes]
      properties:
        key: { type: string, description: "Stable instrument identifier (e.g. NIFTY50, GOLD)" }
        name: { type: string, description: "Display name" }
        category:
          type: string
          enum: [INDIA, GLOBAL, COMMODITY, ADR, FX]
        yahooSymbol: { type: string }
        currency: { type: string }
        source:
          type: string
          enum: [kite, yahoo]
          nullable: true
          description: "Origin of LTP/OHLC. kite = live, yahoo = ~15min delayed."
        asOf: { type: integer, description: "Last update unix seconds" }
        ltp: { type: number }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        change: { type: number }
        changePercent: { type: number }
        fiftyTwoWeekHigh: { type: number }
        fiftyTwoWeekLow: { type: number }
        prevOpen: { type: number }
        prevHigh: { type: number }
        prevLow: { type: number }
        prevClose: { type: number }
        ema9: { type: number }
        ema20: { type: number }
        ema50: { type: number }
        ema100: { type: number }
        ema200: { type: number }
        vwap: { type: number, description: "Session VWAP from intraday bars" }
        vah: { type: number, description: "Value Area High (intraday volume profile)" }
        val: { type: number, description: "Value Area Low (intraday volume profile)" }
        poc: { type: number, description: "Point of Control (intraday volume profile)" }
        pivot: { type: number, description: "Floor-trader pivot from prev day OHLC" }
        support:
          type: array
          description: "S1, S2, S3 floor-trader pivots (length 3 when prev OHLC present, [] otherwise)"
          items: { type: number }
        resistance:
          type: array
          description: "R1, R2, R3 floor-trader pivots"
          items: { type: number }
        notes:
          type: array
          description: "Human-readable diagnostic notes (e.g. partial-data warnings)"
          items: { type: string }

    IndicesBoardSnapshot:
      type: object
      required: [items, lastUpdated, kiteAuthenticated]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IndexBoardItem" }
        lastUpdated: { type: string, format: date-time }
        kiteAuthenticated:
          type: boolean
          description: "True when Indian-index LTPs were sourced from a live Kite session"

    MarketTrend:
      type: object
      required: [bias, score, breadth, headline, drivers, lastUpdated]
      properties:
        bias: { type: string, enum: [STRONG_BULLISH, BULLISH, NEUTRAL, BEARISH, STRONG_BEARISH] }
        score: { type: number, description: "-100 to 100" }
        headline: { type: string }
        breadth:
          type: object
          required: [advancers, decliners]
          properties:
            advancers: { type: integer }
            decliners: { type: integer }
            unchanged: { type: integer }
            advanceDeclineRatio: { type: number }
        drivers:
          type: array
          items: { $ref: "#/components/schemas/SignalReason" }
        sectorLeaders:
          type: array
          items: { $ref: "#/components/schemas/SectorSummary" }
        sectorLaggards:
          type: array
          items: { $ref: "#/components/schemas/SectorSummary" }
        lastUpdated: { type: string, format: date-time }

    OptionLeg:
      type: object
      required: [type, strike, action, entry, stopLoss, target1]
      properties:
        type: { type: string, enum: [CALL, PUT] }
        strike: { type: number }
        action: { type: string, enum: [BUY, SELL] }
        expiry: { type: string }
        entry: { type: number, description: "Underlying spot trigger price" }
        instrument: { type: string, enum: [UNDERLYING_LEVEL, OPTION_PREMIUM], description: "Whether entry/SL/target are spot levels or premium values" }
        stopLoss: { type: number }
        target1: { type: number }
        target2: { type: number }
        riskRewardRatio: { type: number }

    OptionSignal:
      type: object
      required: [index, indexName, spot, bias, confidence, leg, drivers, generatedAt]
      properties:
        index: { type: string }
        indexName: { type: string }
        spot: { type: number }
        spotChangePercent: { type: number }
        bias: { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        confidence: { type: number }
        tier:
          type: string
          enum: [HIGH_CONVICTION, BASELINE]
          description: "HIGH_CONVICTION fires from a named setup; BASELINE is the always-on directional read."
        timeframe: { type: string, description: "e.g. intraday-15m" }
        vwap: { type: number }
        ema9: { type: number }
        ema21: { type: number }
        rsi: { type: number }
        valueAreaHigh: { type: number }
        valueAreaLow: { type: number }
        pointOfControl: { type: number }
        dailyEma50: { type: number, description: "Higher-timeframe EMA50 used for HTF bias." }
        htfBias:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
          description: "Daily-timeframe bias derived from spot vs daily EMA50."
        htfConflict:
          type: boolean
          description: "True if intraday signal direction opposes the daily HTF bias."
        tags:
          type: array
          items: { type: string }
          description: "Status tags e.g. HTF_CONFLICT, RR_LOW, EXTENDED, BASELINE."
        setupKey:
          type: string
          enum: [TREND_CONTINUATION, VWAP_RECLAIM, VOLUME_BREAKOUT, EMA_PULLBACK, MEAN_REVERSION, BASELINE]
          description: "Type of intraday setup"
        setupName: { type: string, description: "Human-readable setup label" }
        setupSummary: { type: string, description: "One-line trade idea explanation" }
        entryTrigger: { type: string, description: "Precise condition to enter (e.g. 15-min close above level X)" }
        leg: { $ref: "#/components/schemas/OptionLeg" }
        drivers:
          type: array
          items: { $ref: "#/components/schemas/SignalReason" }
        invalidation: { type: string }
        generatedAt: { type: string, format: date-time }
        status:
          type: string
          enum: [PENDING, TRIGGERED, TARGET1_HIT, TARGET2_HIT, STOPPED, EXPIRED]
          description: "Live lifecycle state vs locked entry/SL/targets."
        firstSeenAt:
          type: string
          format: date-time
          description: "When this exact (date+index+setup+direction) signal was first emitted today; persisted, never moves."
        triggeredAt:
          type: string
          format: date-time
          description: "First time spot crossed the entry trigger in trade direction."
        exitedAt:
          type: string
          format: date-time
          description: "Time the trade was closed by stop, target, or session end."
        exitReason:
          type: string
          enum: [TARGET1_HIT, TARGET2_HIT, STOPPED, EXPIRED_TRIGGERED, EXPIRED_PENDING]
        exitPrice: { type: number }
        maxFavorableExcursionPts:
          type: number
          description: "Maximum points moved in trade's favour from entry, observed today."
        maxAdverseExcursionPts:
          type: number
          description: "Maximum points moved against trade from entry, observed today."
        lastSpot:
          type: number
          description: "Most recent observed spot used to evaluate this signal."
        lastEvaluatedAt:
          type: string
          format: date-time
          description: "Wall-clock time the lifecycle was last evaluated against live spot. Surfaced on the card so the user can verify the trigger pipeline is alive — not stuck on stale data."
        optionLtp:
          type: number
          description: "Current premium (₹/share) of the option at the chosen strike — CE for BULLISH, PE for BEARISH. Sourced from Kite or NSE option chain when available."
        optionEntry:
          type: number
          description: "Greeks-projected option premium at the spot entry trigger. Equals optionLtp + delta×(spotEntry − spot). What the trader will likely pay if the trigger fires now."
        optionTarget1:
          type: number
          description: "Greeks-projected option premium at the spot target 1. Equals optionEntry + delta×(spotT1 − spotEntry)."
        optionTarget2:
          type: number
          description: "Greeks-projected option premium at the spot target 2."
        optionStopLoss:
          type: number
          description: "Greeks-projected option premium at the spot stop. Floored at 0.05 ₹/share so it never goes negative."
        optionDelta:
          type: number
          description: "Delta of the chosen strike at signal time. Used to translate spot moves into option moves."
        optionTheta:
          type: number
          description: "Theta (₹/share/day, time decay) of the chosen strike."
        optionVega:
          type: number
          description: "Vega (₹/share per 1 vol point) of the chosen strike."

    OptionSignalDiagnostics:
      type: object
      required: [indicesConfigured, indicesWithBars, highConvictionCount, baselineCount, suppressed]
      properties:
        indicesConfigured: { type: integer }
        indicesWithBars: { type: integer }
        highConvictionCount: { type: integer }
        baselineCount: { type: integer }
        suppressed:
          type: array
          description: "Per-index report of why no high-conviction setup fired."
          items:
            type: object
            required: [index, reasons]
            properties:
              index: { type: string }
              reasons:
                type: array
                items: { type: string }

    OptionSignalSet:
      type: object
      required: [signals, generatedAt]
      properties:
        signals:
          type: array
          items: { $ref: "#/components/schemas/OptionSignal" }
        generatedAt: { type: string, format: date-time }
        lastUpdated: { type: string, format: date-time, description: "Alias for generatedAt for UI consistency." }
        marketState:
          type: string
          enum: [open, closed, pre_open]
          description: "NSE equity-market session state at generation time."
        diagnostics: { $ref: "#/components/schemas/OptionSignalDiagnostics" }

    OptionSignalHistoryItem:
      type: object
      required:
        - signalDate
        - indexSymbol
        - indexName
        - setupKey
        - direction
        - optionType
        - strike
        - entry
        - stopLoss
        - target1
        - target2
        - confidence
        - status
        - generatedAt
        - maxFavorableExcursionPts
        - maxAdverseExcursionPts
        - lastSpot
        - lastEvaluatedAt
      properties:
        signalDate:    { type: string, description: "IST trading date YYYY-MM-DD" }
        indexSymbol:   { type: string }
        indexName:     { type: string }
        setupKey:      { type: string }
        setupName:     { type: string, nullable: true }
        direction:     { type: string, enum: [BULLISH, BEARISH] }
        optionType:    { type: string, enum: [CALL, PUT] }
        strike:        { type: number }
        entry:         { type: number }
        stopLoss:      { type: number }
        target1:       { type: number }
        target2:       { type: number }
        entryTrigger:  { type: string, nullable: true }
        # Option-premium plan locked at signal generation time. Nullable
        # because (a) older lifecycle rows pre-date these columns, and
        # (b) the option chain may have been unavailable when the signal
        # was first emitted.
        optionEntry:     { type: number, nullable: true }
        optionStopLoss:  { type: number, nullable: true }
        optionTarget1:   { type: number, nullable: true }
        optionTarget2:   { type: number, nullable: true }
        confidence:    { type: integer }
        tier:          { type: string, nullable: true }
        status:
          type: string
          enum: [PENDING, TRIGGERED, TARGET1_HIT, TARGET2_HIT, STOPPED, EXPIRED]
        generatedAt:   { type: string, format: date-time }
        triggeredAt:   { type: string, format: date-time, nullable: true }
        exitedAt:      { type: string, format: date-time, nullable: true }
        exitReason:
          type: string
          nullable: true
          enum: [TARGET1_HIT, TARGET2_HIT, STOPPED, EXPIRED_TRIGGERED, EXPIRED_PENDING]
        exitPrice:     { type: number, nullable: true }
        maxFavorableExcursionPts: { type: number }
        maxAdverseExcursionPts:   { type: number }
        lastSpot:      { type: number }
        lastEvaluatedAt: { type: string, format: date-time }

    OptionSignalHistorySet:
      type: object
      required: [signalDate, generatedAt, signals]
      properties:
        signalDate:  { type: string, description: "IST trading date YYYY-MM-DD" }
        generatedAt: { type: string, format: date-time }
        signals:
          type: array
          items: { $ref: "#/components/schemas/OptionSignalHistoryItem" }

    TopScans:
      type: object
      required: [topBuys, topSells, generatedAt]
      properties:
        topBuys:
          type: array
          items: { $ref: "#/components/schemas/StockRow" }
        topSells:
          type: array
          items: { $ref: "#/components/schemas/StockRow" }
        generatedAt: { type: string, format: date-time }

    FiiDiiDay:
      type: object
      required: [date, fiiBuy, fiiSell, fiiNet, diiBuy, diiSell, diiNet, source]
      properties:
        date:    { type: string, description: "YYYY-MM-DD" }
        fiiBuy:  { type: number }
        fiiSell: { type: number }
        fiiNet:  { type: number }
        diiBuy:  { type: number }
        diiSell: { type: number }
        diiNet:  { type: number }
        source:  { type: string }
        niftyClose:     { type: number, nullable: true }
        niftyChangePct: { type: number, nullable: true }

    FiiDiiMonth:
      type: object
      required: [month, label, fiiBuy, fiiSell, fiiNet, diiBuy, diiSell, diiNet, daysCount, days]
      properties:
        month:     { type: string, description: "YYYY-MM" }
        label:     { type: string }
        fiiBuy:    { type: number }
        fiiSell:   { type: number }
        fiiNet:    { type: number }
        diiBuy:    { type: number }
        diiSell:   { type: number }
        diiNet:    { type: number }
        daysCount: { type: integer }
        days:
          type: array
          items: { $ref: "#/components/schemas/FiiDiiDay" }

    FiiDiiResponse:
      type: object
      required: [months, generatedAt]
      properties:
        months:
          type: array
          items: { $ref: "#/components/schemas/FiiDiiMonth" }
        generatedAt: { type: string, format: date-time }

    ParticipantOiRow:
      type: object
      required:
        - clientType
        - futureIndexLong
        - futureIndexShort
        - futureIndexNet
        - futureStockLong
        - futureStockShort
        - futureStockNet
        - optionIndexCallLong
        - optionIndexCallShort
        - optionIndexPutLong
        - optionIndexPutShort
        - optionStockCallLong
        - optionStockCallShort
        - optionStockPutLong
        - optionStockPutShort
        - totalLongContracts
        - totalShortContracts
        - netContracts
      properties:
        clientType:             { type: string }
        futureIndexLong:        { type: integer }
        futureIndexShort:       { type: integer }
        futureIndexNet:         { type: integer }
        futureStockLong:        { type: integer }
        futureStockShort:       { type: integer }
        futureStockNet:         { type: integer }
        optionIndexCallLong:    { type: integer }
        optionIndexCallShort:   { type: integer }
        optionIndexPutLong:     { type: integer }
        optionIndexPutShort:    { type: integer }
        optionStockCallLong:    { type: integer }
        optionStockCallShort:   { type: integer }
        optionStockPutLong:     { type: integer }
        optionStockPutShort:    { type: integer }
        totalLongContracts:     { type: integer }
        totalShortContracts:    { type: integer }
        netContracts:           { type: integer }

    ParticipantOiResponse:
      type: object
      required: [date, rows, availableDates, generatedAt]
      properties:
        date:           { type: string, nullable: true }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ParticipantOiRow" }
        availableDates:
          type: array
          items: { type: string }
        previousDate:
          type: string
          nullable: true
          description: |
            The trading date immediately preceding `date` for which we have
            participant-OI data, used by the Segment View to compute
            day-over-day "Change OI". Null if `date` is the oldest available.
        previousRows:
          type: array
          description: |
            Participant rows for `previousDate`. Empty when no prior date
            exists. Same shape as `rows`.
          items: { $ref: "#/components/schemas/ParticipantOiRow" }
        generatedAt:    { type: string, format: date-time }

    MarketHoliday:
      type: object
      required: [date, name, exchange, region]
      properties:
        date:     { type: string, description: "YYYY-MM-DD" }
        name:     { type: string }
        exchange: { type: string }
        region:   { type: string, enum: [IN, US, UK, EU, JP, HK, CN] }

    EarningResult:
      type: object
      required: [date, symbol, name, source]
      properties:
        date:        { type: string }
        symbol:      { type: string }
        name:        { type: string }
        estimateEPS: { type: number }
        source:      { type: string }

    EconomicEvent:
      type: object
      required: [date, name, region, category, impact]
      properties:
        date:        { type: string }
        name:        { type: string }
        region:      { type: string, enum: [IN, US, UK, EU, JP, GLOBAL] }
        category:    { type: string, enum: [rate, data, policy, event] }
        impact:      { type: string, enum: [high, medium, low] }
        description: { type: string }

    MarketEventsResponse:
      type: object
      required: [generatedAt, holidays, earnings, events]
      properties:
        generatedAt: { type: string, format: date-time }
        holidays:
          type: object
          required: [upcoming, total]
          properties:
            upcoming:
              type: array
              items: { $ref: "#/components/schemas/MarketHoliday" }
            total: { type: integer }
        earnings:
          type: array
          items: { $ref: "#/components/schemas/EarningResult" }
        events:
          type: array
          items: { $ref: "#/components/schemas/EconomicEvent" }

    PreMarketSentiment:
      type: string
      enum: [STRONG_BULLISH, BULLISH, NEUTRAL, BEARISH, STRONG_BEARISH]

    OvernightCue:
      type: object
      required: [label, value, changePercent, sentiment]
      properties:
        label:         { type: string, description: "Human label e.g. 'GIFT NIFTY (proxy)'" }
        symbol:        { type: string }
        category:      { type: string, enum: [proxy, asia, us, europe, commodity, currency, vix] }
        value:         { type: number }
        changePercent: { type: number }
        change:        { type: number }
        sentiment:     { type: string, enum: [bullish, bearish, neutral] }
        note:          { type: string, description: "Optional context note" }
        asOf:          { type: string, format: date-time }
        inverted:      { type: boolean, description: "True if cue inversely correlates with Indian equities (e.g. DXY, VIX)" }

    PreMarketMover:
      type: object
      required: [symbol, name, price, changePercent, change]
      properties:
        symbol:        { type: string }
        name:          { type: string }
        sector:        { type: string }
        price:         { type: number }
        previousClose: { type: number }
        change:        { type: number }
        changePercent: { type: number }
        volume:        { type: number }

    GapStock:
      type: object
      required: [symbol, name, gapPercent, gapDirection, atrPct]
      properties:
        symbol:       { type: string }
        name:         { type: string }
        sector:       { type: string }
        previousClose: { type: number }
        currentPrice: { type: number }
        gapPercent:   { type: number, description: "(current - prev) / prev * 100" }
        gapDirection: { type: string, enum: [UP, DOWN] }
        atrPct:       { type: number, description: "ATR(14) as % of price" }
        gapVsAtr:     { type: number, description: "gapPercent / atrPct — >1 means gap exceeds normal daily range" }
        signal:       { type: string, enum: [STRONG_BUY, BUY, NEUTRAL, SELL, STRONG_SELL] }

    PreMarketIndexPreview:
      type: object
      required: [symbol, name, previousClose, indicativeChangePercent]
      properties:
        symbol: { type: string }
        name:   { type: string }
        previousClose: { type: number }
        indicativePrice: { type: number, description: "Best estimate of opening price (GIFT proxy or last close)" }
        indicativeChange: { type: number }
        indicativeChangePercent: { type: number }
        source: { type: string, description: "e.g. 'GIFT NIFTY proxy', 'previous close (no pre-open data)'" }

    PostMarketDigest:
      type: object
      required: [advancers, decliners, unchanged, totalVolume, marketBreadthScore, new52wHigh, new52wLow, upperCircuits, lowerCircuits, narrative]
      properties:
        advancers: { type: integer }
        decliners: { type: integer }
        unchanged: { type: integer }
        adRatio:   { type: number, nullable: true }
        totalVolume: { type: number }
        avgChangePercent: { type: number }
        marketBreadthScore: { type: number, description: "-100 to 100" }
        new52wHigh:    { type: integer, description: "Stocks within 0.5% of their 52-week high" }
        new52wLow:     { type: integer, description: "Stocks within 0.5% of their 52-week low" }
        upperCircuits: { type: integer, description: "Stocks at +4.8% or more (probable upper circuit hit)" }
        lowerCircuits: { type: integer, description: "Stocks at -4.8% or less (probable lower circuit hit)" }
        narrative: { type: string, description: "One-line market summary" }

    KeyIndexLevels:
      type: object
      required: [symbol, name, previousClose, prevHigh, prevLow, weekHigh, weekLow, yearHigh, yearLow, pivot, r1, r2, s1, s2, cprTop, cprPivot, cprBottom, cprWidthPct, cprWidthLabel, positionInYearRangePct]
      description: "Pro pre-market index level pack. CPR (Central Pivot Range) and classic floor pivots from previous-session OHLC. Narrow CPR (<0.4% of price) tends to precede a trending day, wide CPR (>1.0%) precedes range/chop. positionInYearRangePct = where price sits inside the 52-week high-low band (0%=at low, 100%=at high)."
      properties:
        symbol:                  { type: string, description: "Yahoo-style symbol (e.g. ^NSEI)" }
        name:                    { type: string, description: "Display name (e.g. NIFTY 50)" }
        previousClose:           { type: number }
        prevHigh:                { type: number, description: "Previous session high" }
        prevLow:                 { type: number, description: "Previous session low" }
        todayOpen:               { type: number, nullable: true, description: "Today's open if market has opened" }
        weekHigh:                { type: number, description: "Highest close over last 5 trading days" }
        weekLow:                 { type: number, description: "Lowest close over last 5 trading days" }
        monthHigh:               { type: number, nullable: true, description: "Highest close over last 21 trading days" }
        monthLow:                { type: number, nullable: true, description: "Lowest close over last 21 trading days" }
        yearHigh:                { type: number, description: "52-week high (~252 trading days)" }
        yearLow:                 { type: number, description: "52-week low" }
        pivot:                   { type: number, description: "Classic floor pivot P = (PH + PL + PC) / 3" }
        r1:                      { type: number }
        r2:                      { type: number }
        s1:                      { type: number }
        s2:                      { type: number }
        cprTop:                  { type: number, description: "TC = 2P - BC (top of CPR)" }
        cprPivot:                { type: number, description: "= classic pivot, middle of CPR" }
        cprBottom:               { type: number, description: "BC = (PH + PL) / 2 (bottom of CPR)" }
        cprWidthPct:             { type: number, description: "(TC - BC) / PC * 100" }
        cprWidthLabel:           { type: string, enum: [NARROW, NORMAL, WIDE], description: "NARROW < 0.4% (trending day likely), WIDE > 1.0% (range/chop likely)" }
        positionInYearRangePct:  { type: number, description: "0..100 — distance through the 52-week range (PC at yearLow=0, at yearHigh=100)" }

    OptionSnapshot:
      type: object
      required: [underlying, spot, expiry, daysToExpiry, expiryContext, atmStrike, atmStraddle, expectedMovePct, pcrOi, pcrVolume, maxPain, bias, interpretation, generatedAt]
      description: "Compact pre-market option-chain read for a single F&O underlying. Sourced from the same chain endpoint that powers the Options page; surfaced here so the morning checklist (ATM strike, expected move, PCR, max-pain, top OI walls) is one glance away."
      properties:
        underlying:       { type: string, description: "F&O underlying e.g. NIFTY, BANKNIFTY, FINNIFTY" }
        spot:             { type: number }
        expiry:           { type: string, description: "Active expiry as returned by NSE (YYYY-MM-DD or DD-MMM-YYYY)" }
        daysToExpiry:     { type: integer, description: "Calendar days from today (IST) to the active expiry; 0 = expires today" }
        expiryContext:    { type: string, enum: [EXPIRY_TODAY, EXPIRY_TOMORROW, EXPIRY_THIS_WEEK, EXPIRY_NEXT_WEEK, FAR], description: "Bucket for quick visual flagging — expiry day means heightened intraday volatility and theta-decay traps" }
        atmStrike:        { type: number }
        atmStraddle:      { type: number, description: "ATM CE LTP + ATM PE LTP (in points)" }
        expectedMovePct:  { type: number, description: "atmStraddle / spot * 100 — implied move by expiry" }
        pcrOi:            { type: number }
        pcrVolume:        { type: number }
        atmIv:            { type: number, nullable: true, description: "ATM straddle IV (% annualised)" }
        maxPain:          { type: number, description: "Strike where option writers lose least" }
        maxCallOiStrike:  { type: number, nullable: true, description: "Resistance — strike with biggest CE open interest" }
        maxPutOiStrike:   { type: number, nullable: true, description: "Support — strike with biggest PE open interest" }
        bias:             { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        interpretation:   { type: string, description: "Plain-English read in one line" }
        generatedAt:      { type: string, format: date-time }

    SectorHeatmapEntry:
      type: object
      required: [sector, avgChangePercent, gainers, losers, stockCount]
      description: "One row of the daily sector ranking — full leader→laggard list (the existing /market/trend endpoint only returns top-3 leaders + bottom-3 laggards, this ranks every NSE sectoral index)."
      properties:
        sector:           { type: string, description: "Sector display name (Banks, IT, Auto, Pharma, …)" }
        avgChangePercent: { type: number, description: "Mean % change of constituent stocks today" }
        gainers:          { type: integer, description: "Stocks closing positive in the sector" }
        losers:           { type: integer, description: "Stocks closing negative in the sector" }
        stockCount:       { type: integer, description: "Sector universe size from this scan" }
        topPickSymbol:    { type: string, description: "Highest-scoring stock in the sector" }

    FiiDiiSnapshot:
      type: object
      required: [latestDate, fiiCashCr, diiCashCr, fiveDayFiiCr, fiveDayDiiCr]
      description: "Last published cash-segment FII / DII net activity, plus 5-day rolling totals. Values are in INR Crores. Negative = net seller, positive = net buyer."
      properties:
        latestDate:    { type: string, format: date, description: "Trading date the latest figures belong to (T-1 typically)" }
        fiiCashCr:     { type: number, description: "FII cash-segment net for latestDate (INR Cr)" }
        diiCashCr:     { type: number, description: "DII cash-segment net for latestDate (INR Cr)" }
        fiveDayFiiCr:  { type: number, description: "Sum of FII cash-segment net over the most recent 5 trading days" }
        fiveDayDiiCr:  { type: number, description: "Sum of DII cash-segment net over the most recent 5 trading days" }

    TradingScenario:
      type: object
      required: [kind, label, trigger, actions, invalidation, probability]
      description: "One of three pre-planned scenarios for the day (bullish / bearish / range). A pro trader prepares all three before the open and follows whichever one the market actually takes — never tries to predict a single outcome."
      properties:
        kind:        { type: string, enum: [BULLISH, BEARISH, RANGE] }
        label:       { type: string, description: "Short headline e.g. 'Bullish breakout above R1'" }
        trigger:     { type: string, description: "Specific level/condition that activates this scenario" }
        actions:
          type: array
          items: { type: string }
          description: "Concrete steps to take if this scenario plays out"
        invalidation: { type: string, description: "Specific level/condition that proves this scenario is wrong — abandon the plan and switch to the appropriate alternative." }
        probability: { type: string, enum: [HIGH, MEDIUM, LOW], description: "Heuristic likelihood given current overnight setup" }

    PreMarketReport:
      type: object
      required: [mode, sentiment, sentimentScore, narrative, overnightCues, indexPreviews, generatedAt]
      properties:
        mode: { type: string, enum: [PRE_MARKET, POST_MARKET, LIVE], description: "Auto-detected based on IST time" }
        sentiment: { $ref: "#/components/schemas/PreMarketSentiment" }
        sentimentScore: { type: number, description: "-100..+100 composite of all overnight cues" }
        narrative: { type: string, description: "Human-readable trading-desk style summary" }
        keyTakeaways:
          type: array
          items: { type: string }
          description: "Bullet points distilled from the cues"
        overnightCues:
          type: array
          items: { $ref: "#/components/schemas/OvernightCue" }
        indexPreviews:
          type: array
          items: { $ref: "#/components/schemas/PreMarketIndexPreview" }
        scenarios:
          type: array
          items: { $ref: "#/components/schemas/TradingScenario" }
          description: "3 pre-planned scenarios for today (bullish / bearish / range) with triggers + action plans"
        indexLevels:
          type: array
          items: { $ref: "#/components/schemas/KeyIndexLevels" }
          description: "Pro pre-market level pack — CPR + classic pivots + previous-day H/L + weekly H/L + 52-week H/L for the 5 main F&O indices"
        optionSnapshots:
          type: array
          items: { $ref: "#/components/schemas/OptionSnapshot" }
          description: "Morning option-chain summary for NIFTY / BANKNIFTY / FINNIFTY (omitted when no Kite session is active and NSE is geo-blocked)"
        sectorHeatmap:
          type: array
          items: { $ref: "#/components/schemas/SectorHeatmapEntry" }
          description: "Full sector ranking, leader → laggard"
        fiiDii: { $ref: "#/components/schemas/FiiDiiSnapshot" }
        topGainers:
          type: array
          items: { $ref: "#/components/schemas/PreMarketMover" }
        topLosers:
          type: array
          items: { $ref: "#/components/schemas/PreMarketMover" }
        gapUps:
          type: array
          items: { $ref: "#/components/schemas/GapStock" }
        gapDowns:
          type: array
          items: { $ref: "#/components/schemas/GapStock" }
        eventsToday:
          type: array
          items: { $ref: "#/components/schemas/EconomicEvent" }
        earningsToday:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              name: { type: string }
              date: { type: string, format: date }
        postMarketDigest: { $ref: "#/components/schemas/PostMarketDigest" }
        generatedAt: { type: string, format: date-time }

    WatchlistTrend:
      type: string
      enum: ["Very Bullish", "Bullish", "Neutral", "Bearish", "Very Bearish"]
    WatchlistRow:
      type: object
      required: [symbol, name, livePrice, previousClose, change, changePercent, open, todayHigh, todayLow, volume, mcTrend]
      properties:
        symbol: { type: string }
        name: { type: string }
        livePrice: { type: number }
        previousClose: { type: number }
        change: { type: number }
        changePercent: { type: number }
        open: { type: number }
        todayHigh: { type: number }
        todayLow: { type: number }
        volume: { type: number }
        ema20: { type: number }
        ema50: { type: number }
        rsi: { type: number }
        mcTrend: { $ref: "#/components/schemas/WatchlistTrend" }
    WatchlistResponse:
      type: object
      required: [key, label, description, asOf, count, rows]
      properties:
        key: { type: string, enum: [SENSEX, BANKNIFTY, NIFTY50, NIFTY100, NIFTYMIDCAP100, NIFTYSMALLCAP100, NIFTY500] }
        label: { type: string }
        description: { type: string }
        asOf: { type: string, format: date-time }
        count: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/WatchlistRow" }

    OptionChainSide:
      type: object
      properties:
        oi:           { type: integer, description: "Open Interest in contracts" }
        chgOi:        { type: integer, description: "OI change since prev close" }
        oiChgPct:     { type: number, nullable: true, description: "Day-over-day OI % change. Null when prior-day OI cannot be derived." }
        volume:       { type: integer }
        volOiRatio:   { type: number, nullable: true, description: "Volume / OI for this leg — proxy for fresh speculative activity. Null when OI is zero/missing." }
        iv:           { type: number, description: "Implied Volatility (% annualised)" }
        ltp:          { type: number, description: "Last traded premium" }
        ltpChgPct:    { type: number, nullable: true, description: "Day-over-day LTP % change vs previous session close. Null when prev close is unavailable (e.g. NSE-direct path)." }
        bid:          { type: number }
        ask:          { type: number }
        bidQty:       { type: integer }
        askQty:       { type: integer }
        delta:        { type: number }
        theta:        { type: number }
        gamma:        { type: number }
        vega:         { type: number }
        intrinsic:    { type: number }
        intrinsicPct: { type: number, nullable: true, description: "Intrinsic / LTP × 100 — share of premium that is real intrinsic value (rest is time value)." }
        timeValue:    { type: number }
        moneyness:    { type: string, enum: [ITM, ATM, OTM] }
        oiBuildup:    { type: string, enum: [LONG_BUILDUP, SHORT_BUILDUP, LONG_UNWINDING, SHORT_COVERING, NEUTRAL] }

    OptionChainStrikeRow:
      type: object
      required: [strike]
      properties:
        strike:    { type: number }
        ce:        { $ref: "#/components/schemas/OptionChainSide" }
        pe:        { $ref: "#/components/schemas/OptionChainSide" }
        pcrOi:     { type: number, nullable: true, description: "Per-strike Put/Call ratio by OI (pe.oi / ce.oi). Null when CE OI is zero." }
        pcrVol:    { type: number, nullable: true, description: "Per-strike Put/Call ratio by Volume. Null when CE volume is zero." }
        isMaxPain: { type: boolean, description: "True on the single Max-Pain strike for the expiry." }

    OptionChainResponse:
      type: object
      required: [underlying, spot, expiry, expiries, atmStrike, strikeStep, rows, source, generatedAt]
      properties:
        underlying:     { type: string }
        underlyingName: { type: string }
        kind:           { type: string, enum: [INDEX, EQUITY] }
        spot:           { type: number }
        prevClose:      { type: number }
        changePercent:  { type: number }
        expiry:         { type: string, description: "Active expiry YYYY-MM-DD" }
        expiries:
          type: array
          items: { type: string }
        atmStrike:      { type: number }
        strikeStep:     { type: number }
        lotSize:        { type: integer }
        maxPainStrike:  { type: number, nullable: true, description: "Strike where option writers' aggregate loss is minimised — same algorithm as analytics, surfaced inline so the chain table can mark the row." }
        rows:
          type: array
          items: { $ref: "#/components/schemas/OptionChainStrikeRow" }
        source:         { type: string, description: "Origin tag — 'NSE' for live fetch, 'kite' for Kite-derived" }
        generatedAt:    { type: string, format: date-time }

    OiClusterStrike:
      type: object
      required: [strike, oi]
      properties:
        strike: { type: number }
        oi:     { type: integer }

    OptionAnalyticsResponse:
      type: object
      required: [underlying, spot, expiry, pcrOi, pcrVolume, maxPain, totalCallOi, totalPutOi, generatedAt]
      properties:
        underlying:    { type: string }
        spot:          { type: number }
        expiry:        { type: string }
        pcrOi:         { type: number, description: "Put/Call ratio by Open Interest" }
        pcrVolume:     { type: number, description: "Put/Call ratio by Volume" }
        maxPain:       { type: number, description: "Max-pain strike — where most options expire worthless" }
        atmIv:         { type: number, nullable: true, description: "ATM straddle IV (avg of CE+PE)" }
        ivPercentile:  { type: number, nullable: true, description: "30-day IV percentile (null until history is built)" }
        totalCallOi:   { type: integer }
        totalPutOi:    { type: integer }
        callOiAdded:   { type: integer }
        putOiAdded:    { type: integer }
        topResistance:
          type: array
          items: { $ref: "#/components/schemas/OiClusterStrike" }
        topSupport:
          type: array
          items: { $ref: "#/components/schemas/OiClusterStrike" }
        interpretation: { type: string, description: "Plain-English read on bias from PCR + OI flow + Max Pain" }
        bias:           { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        generatedAt:    { type: string, format: date-time }

    OptionStrategyLeg:
      type: object
      required: [type, action, strike, premium, qty]
      properties:
        type:    { type: string, enum: [CALL, PUT] }
        action:  { type: string, enum: [BUY, SELL] }
        strike:  { type: number }
        premium: { type: number, description: "Per-share premium (LTP)" }
        qty:     { type: integer, description: "Number of lots × lot size (positive)" }
        delta:   { type: number }
        theta:   { type: number }
        gamma:   { type: number }
        vega:    { type: number }

    PayoffPoint:
      type: object
      required: [spot, pnl]
      properties:
        spot: { type: number }
        pnl:  { type: number, description: "P/L at expiry, INR (per 1 lot)" }

    OptionStrategy:
      type: object
      required: [key, name, category, outlook, legs, payoff, breakEvens, maxProfit, maxLoss, netDebit, generatedAt]
      properties:
        key:        { type: string, description: "Stable identifier e.g. LONG_STRADDLE" }
        name:       { type: string }
        category:   { type: string, enum: [DIRECTIONAL_BULL, DIRECTIONAL_BEAR, NEUTRAL_VOL, INCOME, HEDGE] }
        outlook:    { type: string, description: "Market view this strategy expresses" }
        whenToUse:  { type: string }
        legs:
          type: array
          items: { $ref: "#/components/schemas/OptionStrategyLeg" }
        payoff:
          type: array
          items: { $ref: "#/components/schemas/PayoffPoint" }
        breakEvens:
          type: array
          items: { type: number }
        maxProfit:    { type: number, description: "INR per lot; null = unlimited" , nullable: true }
        maxLoss:      { type: number, description: "INR per lot; null = unlimited" , nullable: true }
        netDebit:     { type: number, description: "Cost per lot (positive = debit, negative = credit)" }
        netDelta:     { type: number }
        netTheta:     { type: number }
        netGamma:     { type: number }
        netVega:      { type: number }
        rrRatio:      { type: number, nullable: true }
        recommendation: { type: string, description: "Why this strategy fits the current view (1-line)" }
        generatedAt:  { type: string, format: date-time }

    OptionStrategiesResponse:
      type: object
      required: [underlying, spot, expiry, lotSize, strategies, generatedAt]
      properties:
        underlying:  { type: string }
        spot:        { type: number }
        expiry:      { type: string }
        lotSize:     { type: integer }
        atmIv:       { type: number, nullable: true }
        bias:        { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        strategies:
          type: array
          items: { $ref: "#/components/schemas/OptionStrategy" }
        generatedAt: { type: string, format: date-time }

    PaperAccountState:
      type: object
      required:
