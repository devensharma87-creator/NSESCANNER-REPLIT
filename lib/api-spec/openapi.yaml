openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NSE Stock Scanner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: market
  - name: sectors
  - name: stocks
  - name: scan
  - name: options
  - name: news
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /market/summary:
    get:
      operationId: getMarketSummary
      tags: [market]
      summary: Indian market indices snapshot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketSummary" }

  /market/global:
    get:
      operationId: getGlobalIndices
      tags: [market]
      summary: Global indices including GIFT NIFTY for pre-market read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalMarket" }

  /market/trend:
    get:
      operationId: getMarketTrend
      tags: [market]
      summary: Overall market trend (breadth + index alignment)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketTrend" }

  /sectors:
    get:
      operationId: listSectors
      tags: [sectors]
      summary: All sectors with aggregate stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SectorSummary" }

  /sectors/{sector}:
    get:
      operationId: getSector
      tags: [sectors]
      summary: Sector detail with all stocks
      parameters:
        - in: path
          name: sector
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectorDetail" }

  /stocks:
    get:
      operationId: listStocks
      tags: [stocks]
      summary: List all scanned stocks (with live quote + signal)
      parameters:
        - in: query
          name: sector
          schema: { type: string }
        - in: query
          name: signal
          schema:
            type: string
            enum: [STRONG_BUY, BUY, NEUTRAL, SELL, STRONG_SELL]
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StockRow" }

  /stocks/{symbol}:
    get:
      operationId: getStockDetail
      tags: [stocks]
      summary: Detailed view of a single stock
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockDetail" }

  /stocks/{symbol}/statements:
    get:
      operationId: getStockStatements
      tags: [stocks]
      summary: Full financial statements (P&L, Balance Sheet, Cash Flow, Ratios, Shareholding)
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockStatements" }

  /stocks/{symbol}/history:
    get:
      operationId: getStockHistory
      tags: [stocks]
      summary: Historical OHLC + indicators
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: range
          schema:
            type: string
            enum: ["1mo", "3mo", "6mo", "1y", "2y"]
            default: "6mo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockHistory" }

  /scan/top:
    get:
      operationId: getTopScans
      tags: [scan]
      summary: Top buy and sell ideas right now
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopScans" }

  /options/signals:
    get:
      operationId: getOptionSignals
      tags: [options]
      summary: Index option (CALL/PUT) buy/sell setups with entry/SL/target
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionSignalSet" }

  /inst/fii-dii:
    get:
      operationId: getFiiDii
      tags: [institutional]
      summary: FII / DII cash market monthly aggregates with daily breakdown
      parameters:
        - in: query
          name: months
          schema: { type: integer, minimum: 1, maximum: 36, default: 12 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiiDiiResponse" }

  /inst/participant-oi:
    get:
      operationId: getParticipantOi
      tags: [institutional]
      summary: Participant-wise OI (Client / FII / DII / Pro / TOTAL) for a single trading day
      parameters:
        - in: query
          name: date
          schema: { type: string, description: "YYYY-MM-DD; latest if omitted" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantOiResponse" }

  /inst/refresh:
    post:
      operationId: refreshInstFlows
      tags: [institutional]
      summary: Force-refresh FII/DII and participant OI from upstream sources
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /news:
    get:
      operationId: getNews
      tags: [news]
      summary: Market news (optionally filtered by symbol)
      parameters:
        - in: query
          name: symbol
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NewsItem" }

  /market/events:
    get:
      operationId: getMarketEvents
      tags: [news]
      summary: Market events — exchange holidays, earnings calendar, central bank & macro events (90-day horizon)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketEventsResponse" }

  /market/premarket:
    get:
      operationId: getPreMarket
      tags: [market]
      summary: Pre/Post-market deep analysis — overnight cues, GIFT NIFTY, gainers/losers, gappers, market internals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreMarketReport" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Signal:
      type: string
      enum: [STRONG_BUY, BUY, NEUTRAL, SELL, STRONG_SELL]

    Quote:
      type: object
      required: [symbol, price, change, changePercent, open, high, low, previousClose, volume, updatedAt]
      properties:
        symbol: { type: string }
        name: { type: string }
        exchange: { type: string }
        price: { type: number }
        change: { type: number }
        changePercent: { type: number }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        previousClose: { type: number }
        volume: { type: number }
        avgVolume: { type: number }
        marketCap: { type: number }
        dayRange: { type: string }
        yearRange: { type: string }
        fiftyTwoWeekHigh: { type: number }
        fiftyTwoWeekLow: { type: number }
        updatedAt: { type: string, format: date-time }

    Indicators:
      type: object
      required: [ema20, ema50, rsi14]
      properties:
        ema9: { type: number }
        ema21: { type: number }
        ema20: { type: number }
        ema50: { type: number }
        ema100: { type: number }
        ema200: { type: number }
        vwap: { type: number, description: "Daily intraday VWAP if available, else rolling proxy" }
        rsi14: { type: number }
        macd: { type: number }
        macdSignal: { type: number }
        macdHist: { type: number }
        atr14: { type: number }
        adx14: { type: number }
        volumeRatio: { type: number, description: "current volume / 20-day average" }
        deliveryPct: { type: number, description: "estimated delivery percentage" }
        trendStrength: { type: number, description: "0-100" }
        supportLevel: { type: number }
        resistanceLevel: { type: number }
        pivot: { type: number }
        r1: { type: number }
        s1: { type: number }
        valueAreaHigh: { type: number }
        valueAreaLow: { type: number }
        pointOfControl: { type: number }

    SignalReason:
      type: object
      required: [label, weight, bullish]
      properties:
        label: { type: string }
        detail: { type: string }
        weight: { type: number }
        bullish: { type: boolean }

    Recommendation:
      type: object
      required: [signal, score, confidence, reasons]
      properties:
        signal: { $ref: "#/components/schemas/Signal" }
        score: { type: number, description: "-100 to 100" }
        confidence: { type: number, description: "0 to 100" }
        timeframe: { type: string, description: "e.g. swing, intraday, positional" }
        target: { type: number }
        stopLoss: { type: number }
        riskRewardRatio: { type: number }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/SignalReason" }

    StockRow:
      type: object
      required: [symbol, name, sector, quote, recommendation]
      properties:
        symbol: { type: string }
        name: { type: string }
        sector: { type: string }
        quote: { $ref: "#/components/schemas/Quote" }
        indicators: { $ref: "#/components/schemas/Indicators" }
        recommendation: { $ref: "#/components/schemas/Recommendation" }

    Candle:
      type: object
      required: [t, o, h, l, c, v]
      properties:
        t: { type: string, format: date-time }
        o: { type: number }
        h: { type: number }
        l: { type: number }
        c: { type: number }
        v: { type: number }

    StockHistory:
      type: object
      required: [symbol, range, candles]
      properties:
        symbol: { type: string }
        range: { type: string }
        candles:
          type: array
          items: { $ref: "#/components/schemas/Candle" }
        ema20Series:
          type: array
          items: { type: number, nullable: true }
        ema50Series:
          type: array
          items: { type: number, nullable: true }
        rsiSeries:
          type: array
          items: { type: number, nullable: true }

    QuarterlyFinancial:
      type: object
      required: [period]
      properties:
        period: { type: string }
        revenue: { type: number }
        netProfit: { type: number }
        eps: { type: number }
        operatingMargin: { type: number }
        netMargin: { type: number }

    Holding:
      type: object
      required: [period]
      properties:
        period: { type: string }
        promoter: { type: number }
        fii: { type: number }
        dii: { type: number }
        public: { type: number }

    NewsItem:
      type: object
      required: [id, title, source, publishedAt]
      properties:
        id: { type: string }
        title: { type: string }
        source: { type: string }
        url: { type: string }
        publishedAt: { type: string, format: date-time }
        summary: { type: string }
        symbol: { type: string }
        sentiment:
          type: string
          enum: [positive, neutral, negative]

    CompanyProfile:
      type: object
      required: [symbol, name, sector]
      properties:
        symbol: { type: string }
        name: { type: string }
        sector: { type: string }
        industry: { type: string }
        description: { type: string }
        website: { type: string }
        seasonality: { type: string }
        catalysts:
          type: array
          items: { type: string }
        keyStats:
          $ref: "#/components/schemas/KeyStats"
        peers:
          type: array
          items:
            type: object
            required: [symbol, name]
            properties:
              symbol: { type: string }
              name: { type: string }
              changePercent: { type: number }
              price: { type: number }

    KeyStats:
      type: object
      properties:
        marketCapCr: { type: number, description: "Market cap in ₹ crore" }
        peRatio: { type: number }
        pbRatio: { type: number }
        eps: { type: number }
        bookValue: { type: number }
        dividendYield: { type: number, description: "%" }
        beta: { type: number }
        roe: { type: number, description: "%" }
        roce: { type: number, description: "%" }
        debtToEquity: { type: number }
        profitMargin: { type: number, description: "%" }
        operatingMargin: { type: number, description: "%" }
        sharesOutstandingCr: { type: number, description: "Shares outstanding in crore" }
        fiftyDayAverage: { type: number }
        twoHundredDayAverage: { type: number }
        revenueGrowthYoy: { type: number, description: "%" }
        earningsGrowthYoy: { type: number, description: "%" }
        forwardPe: { type: number }
        priceToSales: { type: number }
        promoterHolding: { type: number, description: "%" }

    StockDetail:
      type: object
      required: [profile, quote, indicators, recommendation, financials, holdings, news]
      properties:
        profile: { $ref: "#/components/schemas/CompanyProfile" }
        quote: { $ref: "#/components/schemas/Quote" }
        indicators: { $ref: "#/components/schemas/Indicators" }
        recommendation: { $ref: "#/components/schemas/Recommendation" }
        financials:
          type: array
          items: { $ref: "#/components/schemas/QuarterlyFinancial" }
        holdings:
          type: array
          items: { $ref: "#/components/schemas/Holding" }
        news:
          type: array
          items: { $ref: "#/components/schemas/NewsItem" }

    AnnualPLRow:
      type: object
      required: [period, endDate]
      properties:
        period: { type: string }
        endDate: { type: string, format: date }
        revenue: { type: number, description: "₹ crore" }
        costOfRevenue: { type: number }
        grossProfit: { type: number }
        ebitda: { type: number }
        ebit: { type: number }
        interestExpense: { type: number }
        netProfit: { type: number }
        eps: { type: number }
        taxProvision: { type: number }
        operatingMargin: { type: number, description: "%" }
        netMargin: { type: number, description: "%" }

    BalanceSheetRow:
      type: object
      required: [period, endDate]
      properties:
        period: { type: string }
        endDate: { type: string, format: date }
        totalAssets: { type: number, description: "₹ crore" }
        totalLiabilities: { type: number }
        totalEquity: { type: number }
        totalDebt: { type: number }
        cashAndEquivalents: { type: number }
        inventory: { type: number }
        receivables: { type: number }
        fixedAssets: { type: number }
        currentAssets: { type: number }
        currentLiabilities: { type: number }
        workingCapital: { type: number }
        bookValuePerShare: { type: number }

    CashFlowRow:
      type: object
      required: [period, endDate]
      properties:
        period: { type: string }
        endDate: { type: string, format: date }
        operatingCashFlow: { type: number, description: "₹ crore" }
        investingCashFlow: { type: number }
        financingCashFlow: { type: number }
        capex: { type: number }
        freeCashFlow: { type: number }
        netChangeInCash: { type: number }
        dividendsPaid: { type: number }

    KeyRatio:
      type: object
      required: [period, endDate]
      properties:
        period: { type: string }
        endDate: { type: string, format: date }
        currentRatio: { type: number }
        quickRatio: { type: number }
        debtToEquity: { type: number }
        roe: { type: number, description: "%" }
        roa: { type: number, description: "%" }
        roce: { type: number, description: "%" }
        assetTurnover: { type: number }
        interestCoverage: { type: number }
        netMargin: { type: number, description: "%" }
        operatingMargin: { type: number, description: "%" }

    InstitutionalHolder:
      type: object
      required: [name, percentHeld]
      properties:
        name: { type: string }
        percentHeld: { type: number, description: "%" }
        valueCr: { type: number }
        reportDate: { type: string, format: date }

    ShareholdingBreakdown:
      type: object
      required: [topInstitutions, topInsiders]
      properties:
        insidersPct: { type: number, description: "%" }
        institutionsPct: { type: number, description: "%" }
        publicPct: { type: number, description: "%" }
        topInstitutions:
          type: array
          items: { $ref: "#/components/schemas/InstitutionalHolder" }
        topInsiders:
          type: array
          items: { $ref: "#/components/schemas/InstitutionalHolder" }

    StockStatements:
      type: object
      required: [annualPL, quarterlyPL, balanceSheet, cashFlow, ratios, shareholding]
      properties:
        annualPL:
          type: array
          items: { $ref: "#/components/schemas/AnnualPLRow" }
        quarterlyPL:
          type: array
          items: { $ref: "#/components/schemas/AnnualPLRow" }
        balanceSheet:
          type: array
          items: { $ref: "#/components/schemas/BalanceSheetRow" }
        cashFlow:
          type: array
          items: { $ref: "#/components/schemas/CashFlowRow" }
        ratios:
          type: array
          items: { $ref: "#/components/schemas/KeyRatio" }
        shareholding: { $ref: "#/components/schemas/ShareholdingBreakdown" }

    SectorSummary:
      type: object
      required: [sector, stockCount, avgScore, gainers, losers, topPick]
      properties:
        sector: { type: string }
        stockCount: { type: integer }
        avgScore: { type: number }
        avgChangePercent: { type: number }
        gainers: { type: integer }
        losers: { type: integer }
        topPick: { $ref: "#/components/schemas/StockRow" }

    SectorDetail:
      type: object
      required: [sector, stocks, summary]
      properties:
        sector: { type: string }
        summary: { $ref: "#/components/schemas/SectorSummary" }
        stocks:
          type: array
          items: { $ref: "#/components/schemas/StockRow" }

    IndexQuote:
      type: object
      required: [symbol, name, price, change, changePercent]
      properties:
        symbol: { type: string }
        name: { type: string }
        region: { type: string }
        price: { type: number }
        change: { type: number }
        changePercent: { type: number }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        previousClose: { type: number }
        fiftyTwoWeekHigh: { type: number }
        fiftyTwoWeekLow: { type: number }
        volume: { type: number }
        asOf: { type: integer, description: "Last update unix seconds" }
        sparkline:
          type: array
          description: "Recent close prices for sparkline (oldest → newest)"
          items: { type: number }
        trend: { type: string, enum: [bullish, bearish, neutral] }
        vwap: { type: number }
        ema9: { type: number }
        ema21: { type: number }
        rsi14: { type: number }
        breadth:
          type: object
          properties:
            advancers: { type: integer }
            decliners: { type: integer }
            unchanged: { type: integer }
            adRatio: { type: number, nullable: true, description: "advancers/decliners; null when decliners=0 and advancers>0 (interpreted as ∞)" }
        constituentSlug: { type: string, description: "URL slug for index detail page" }

    MarketSummary:
      type: object
      required: [indices, advancers, decliners, unchanged, lastUpdated]
      properties:
        indices:
          type: array
          items: { $ref: "#/components/schemas/IndexQuote" }
        advancers: { type: integer }
        decliners: { type: integer }
        unchanged: { type: integer }
        marketStatus:
          type: string
          enum: [open, closed, pre_open]
        lastUpdated: { type: string, format: date-time }

    GlobalMarket:
      type: object
      required: [indices, lastUpdated]
      properties:
        indices:
          type: array
          items: { $ref: "#/components/schemas/IndexQuote" }
        lastUpdated: { type: string, format: date-time }

    MarketTrend:
      type: object
      required: [bias, score, breadth, headline, drivers, lastUpdated]
      properties:
        bias: { type: string, enum: [STRONG_BULLISH, BULLISH, NEUTRAL, BEARISH, STRONG_BEARISH] }
        score: { type: number, description: "-100 to 100" }
        headline: { type: string }
        breadth:
          type: object
          required: [advancers, decliners]
          properties:
            advancers: { type: integer }
            decliners: { type: integer }
            unchanged: { type: integer }
            advanceDeclineRatio: { type: number }
        drivers:
          type: array
          items: { $ref: "#/components/schemas/SignalReason" }
        sectorLeaders:
          type: array
          items: { $ref: "#/components/schemas/SectorSummary" }
        sectorLaggards:
          type: array
          items: { $ref: "#/components/schemas/SectorSummary" }
        lastUpdated: { type: string, format: date-time }

    OptionLeg:
      type: object
      required: [type, strike, action, entry, stopLoss, target1]
      properties:
        type: { type: string, enum: [CALL, PUT] }
        strike: { type: number }
        action: { type: string, enum: [BUY, SELL] }
        expiry: { type: string }
        entry: { type: number, description: "Underlying spot trigger price" }
        instrument: { type: string, enum: [UNDERLYING_LEVEL, OPTION_PREMIUM], description: "Whether entry/SL/target are spot levels or premium values" }
        stopLoss: { type: number }
        target1: { type: number }
        target2: { type: number }
        riskRewardRatio: { type: number }

    OptionSignal:
      type: object
      required: [index, indexName, spot, bias, confidence, leg, drivers, generatedAt]
      properties:
        index: { type: string }
        indexName: { type: string }
        spot: { type: number }
        spotChangePercent: { type: number }
        bias: { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        confidence: { type: number }
        timeframe: { type: string, description: "e.g. intraday-15m" }
        vwap: { type: number }
        ema9: { type: number }
        ema21: { type: number }
        rsi: { type: number }
        valueAreaHigh: { type: number }
        valueAreaLow: { type: number }
        pointOfControl: { type: number }
        setupKey:
          type: string
          enum: [TREND_CONTINUATION, VWAP_RECLAIM, VOLUME_BREAKOUT, EMA_PULLBACK, MEAN_REVERSION]
          description: "Type of intraday setup"
        setupName: { type: string, description: "Human-readable setup label" }
        setupSummary: { type: string, description: "One-line trade idea explanation" }
        entryTrigger: { type: string, description: "Precise condition to enter (e.g. 15-min close above level X)" }
        leg: { $ref: "#/components/schemas/OptionLeg" }
        drivers:
          type: array
          items: { $ref: "#/components/schemas/SignalReason" }
        invalidation: { type: string }
        generatedAt: { type: string, format: date-time }

    OptionSignalSet:
      type: object
      required: [signals, generatedAt]
      properties:
        signals:
          type: array
          items: { $ref: "#/components/schemas/OptionSignal" }
        generatedAt: { type: string, format: date-time }

    TopScans:
      type: object
      required: [topBuys, topSells, generatedAt]
      properties:
        topBuys:
          type: array
          items: { $ref: "#/components/schemas/StockRow" }
        topSells:
          type: array
          items: { $ref: "#/components/schemas/StockRow" }
        generatedAt: { type: string, format: date-time }

    FiiDiiDay:
      type: object
      required: [date, fiiBuy, fiiSell, fiiNet, diiBuy, diiSell, diiNet, source]
      properties:
        date:    { type: string, description: "YYYY-MM-DD" }
        fiiBuy:  { type: number }
        fiiSell: { type: number }
        fiiNet:  { type: number }
        diiBuy:  { type: number }
        diiSell: { type: number }
        diiNet:  { type: number }
        source:  { type: string }
        niftyClose:     { type: number, nullable: true }
        niftyChangePct: { type: number, nullable: true }

    FiiDiiMonth:
      type: object
      required: [month, label, fiiBuy, fiiSell, fiiNet, diiBuy, diiSell, diiNet, daysCount, days]
      properties:
        month:     { type: string, description: "YYYY-MM" }
        label:     { type: string }
        fiiBuy:    { type: number }
        fiiSell:   { type: number }
        fiiNet:    { type: number }
        diiBuy:    { type: number }
        diiSell:   { type: number }
        diiNet:    { type: number }
        daysCount: { type: integer }
        days:
          type: array
          items: { $ref: "#/components/schemas/FiiDiiDay" }

    FiiDiiResponse:
      type: object
      required: [months, generatedAt]
      properties:
        months:
          type: array
          items: { $ref: "#/components/schemas/FiiDiiMonth" }
        generatedAt: { type: string, format: date-time }

    ParticipantOiRow:
      type: object
      required:
        - clientType
        - futureIndexLong
        - futureIndexShort
        - futureIndexNet
        - futureStockLong
        - futureStockShort
        - futureStockNet
        - optionIndexCallLong
        - optionIndexCallShort
        - optionIndexPutLong
        - optionIndexPutShort
        - optionStockCallLong
        - optionStockCallShort
        - optionStockPutLong
        - optionStockPutShort
        - totalLongContracts
        - totalShortContracts
        - netContracts
      properties:
        clientType:             { type: string }
        futureIndexLong:        { type: integer }
        futureIndexShort:       { type: integer }
        futureIndexNet:         { type: integer }
        futureStockLong:        { type: integer }
        futureStockShort:       { type: integer }
        futureStockNet:         { type: integer }
        optionIndexCallLong:    { type: integer }
        optionIndexCallShort:   { type: integer }
        optionIndexPutLong:     { type: integer }
        optionIndexPutShort:    { type: integer }
        optionStockCallLong:    { type: integer }
        optionStockCallShort:   { type: integer }
        optionStockPutLong:     { type: integer }
        optionStockPutShort:    { type: integer }
        totalLongContracts:     { type: integer }
        totalShortContracts:    { type: integer }
        netContracts:           { type: integer }

    ParticipantOiResponse:
      type: object
      required: [date, rows, availableDates, generatedAt]
      properties:
        date:           { type: string, nullable: true }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ParticipantOiRow" }
        availableDates:
          type: array
          items: { type: string }
        generatedAt:    { type: string, format: date-time }

    MarketHoliday:
      type: object
      required: [date, name, exchange, region]
      properties:
        date:     { type: string, description: "YYYY-MM-DD" }
        name:     { type: string }
        exchange: { type: string }
        region:   { type: string, enum: [IN, US, UK, EU, JP, HK, CN] }

    EarningResult:
      type: object
      required: [date, symbol, name, source]
      properties:
        date:        { type: string }
        symbol:      { type: string }
        name:        { type: string }
        estimateEPS: { type: number }
        source:      { type: string }

    EconomicEvent:
      type: object
      required: [date, name, region, category, impact]
      properties:
        date:        { type: string }
        name:        { type: string }
        region:      { type: string, enum: [IN, US, UK, EU, JP, GLOBAL] }
        category:    { type: string, enum: [rate, data, policy, event] }
        impact:      { type: string, enum: [high, medium, low] }
        description: { type: string }

    MarketEventsResponse:
      type: object
      required: [generatedAt, holidays, earnings, events]
      properties:
        generatedAt: { type: string, format: date-time }
        holidays:
          type: object
          required: [upcoming, total]
          properties:
            upcoming:
              type: array
              items: { $ref: "#/components/schemas/MarketHoliday" }
            total: { type: integer }
        earnings:
          type: array
          items: { $ref: "#/components/schemas/EarningResult" }
        events:
          type: array
          items: { $ref: "#/components/schemas/EconomicEvent" }

    PreMarketSentiment:
      type: string
      enum: [STRONG_BULLISH, BULLISH, NEUTRAL, BEARISH, STRONG_BEARISH]

    OvernightCue:
      type: object
      required: [label, value, changePercent, sentiment]
      properties:
        label:         { type: string, description: "Human label e.g. 'GIFT NIFTY (proxy)'" }
        symbol:        { type: string }
        category:      { type: string, enum: [proxy, asia, us, europe, commodity, currency, vix] }
        value:         { type: number }
        changePercent: { type: number }
        change:        { type: number }
        sentiment:     { type: string, enum: [bullish, bearish, neutral] }
        note:          { type: string, description: "Optional context note" }
        asOf:          { type: string, format: date-time }
        inverted:      { type: boolean, description: "True if cue inversely correlates with Indian equities (e.g. DXY, VIX)" }

    PreMarketMover:
      type: object
      required: [symbol, name, price, changePercent, change]
      properties:
        symbol:        { type: string }
        name:          { type: string }
        sector:        { type: string }
        price:         { type: number }
        previousClose: { type: number }
        change:        { type: number }
        changePercent: { type: number }
        volume:        { type: number }

    GapStock:
      type: object
      required: [symbol, name, gapPercent, gapDirection, atrPct]
      properties:
        symbol:       { type: string }
        name:         { type: string }
        sector:       { type: string }
        previousClose: { type: number }
        currentPrice: { type: number }
        gapPercent:   { type: number, description: "(current - prev) / prev * 100" }
        gapDirection: { type: string, enum: [UP, DOWN] }
        atrPct:       { type: number, description: "ATR(14) as % of price" }
        gapVsAtr:     { type: number, description: "gapPercent / atrPct — >1 means gap exceeds normal daily range" }
        signal:       { type: string, enum: [STRONG_BUY, BUY, NEUTRAL, SELL, STRONG_SELL] }

    PreMarketIndexPreview:
      type: object
      required: [symbol, name, previousClose, indicativeChangePercent]
      properties:
        symbol: { type: string }
        name:   { type: string }
        previousClose: { type: number }
        indicativePrice: { type: number, description: "Best estimate of opening price (GIFT proxy or last close)" }
        indicativeChange: { type: number }
        indicativeChangePercent: { type: number }
        source: { type: string, description: "e.g. 'GIFT NIFTY proxy', 'previous close (no pre-open data)'" }

    PostMarketDigest:
      type: object
      required: [advancers, decliners, unchanged, totalVolume, marketBreadthScore, narrative]
      properties:
        advancers: { type: integer }
        decliners: { type: integer }
        unchanged: { type: integer }
        adRatio:   { type: number, nullable: true }
        totalVolume: { type: number }
        avgChangePercent: { type: number }
        marketBreadthScore: { type: number, description: "-100 to 100" }
        narrative: { type: string, description: "One-line market summary" }

    PreMarketReport:
      type: object
      required: [mode, sentiment, sentimentScore, narrative, overnightCues, indexPreviews, generatedAt]
      properties:
        mode: { type: string, enum: [PRE_MARKET, POST_MARKET, LIVE], description: "Auto-detected based on IST time" }
        sentiment: { $ref: "#/components/schemas/PreMarketSentiment" }
        sentimentScore: { type: number, description: "-100..+100 composite of all overnight cues" }
        narrative: { type: string, description: "Human-readable trading-desk style summary" }
        keyTakeaways:
          type: array
          items: { type: string }
          description: "Bullet points distilled from the cues"
        overnightCues:
          type: array
          items: { $ref: "#/components/schemas/OvernightCue" }
        indexPreviews:
          type: array
          items: { $ref: "#/components/schemas/PreMarketIndexPreview" }
        topGainers:
          type: array
          items: { $ref: "#/components/schemas/PreMarketMover" }
        topLosers:
          type: array
          items: { $ref: "#/components/schemas/PreMarketMover" }
        gapUps:
          type: array
          items: { $ref: "#/components/schemas/GapStock" }
        gapDowns:
          type: array
          items: { $ref: "#/components/schemas/GapStock" }
        eventsToday:
          type: array
          items: { $ref: "#/components/schemas/EconomicEvent" }
        earningsToday:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              name: { type: string }
              date: { type: string, format: date }
        postMarketDigest: { $ref: "#/components/schemas/PostMarketDigest" }
        generatedAt: { type: string, format: date-time }
